            });
            text += `---------------------\n#FNL #eFootball`;
            executeShare(`FNL Matchweek ${mwNum} 結果速報`, text);
        };

        async function executeShare(title, text) {
            if (navigator.share) {
                try {
                    await navigator.share({ title, text });
                    return;
                } catch (e) {}
            }
            openCopyModal(title, text);
        }

        function openCopyModal(title, text) {
            const body = document.getElementById('sheet-body');
            body.innerHTML = `
                <div style="text-align:center; margin-bottom:0.8rem;">
                    <h3 style="font-size:1.1rem; font-weight:700;">${escapeHtml(title)}</h3>
                    <p style="font-size:0.75rem; color:var(--text-muted);">テキストをコピーしてLINEへ貼り付けられます</p>
                </div>
                <textarea id="copy-target-area" class="copy-textarea" readonly>${escapeHtml(text)}</textarea>
                <button class="btn-primary" onclick="copyTextToClipboard()">📋 クリップボードにコピー</button>
            `;
            document.getElementById('sheet-overlay').classList.add('active');
        }

        window.copyTextToClipboard = async function() {
            const area = document.getElementById('copy-target-area');
            if (!area) return;
            try {
                await navigator.clipboard.writeText(area.value);
                alert('LINE共有用テキストをコピーしました！');
                document.getElementById('sheet-overlay').classList.remove('active');
            } catch (err) {
                area.select();
                alert('手動でコピーを行ってください。');
            }
        };

        // --- ニュース ---
        function getNewsSourceLabel(item) {
            if (item?.sourceType === 'team') return item.sourceName || RAW_TEAMS.find(team => team.id === item.sourceTeamId)?.name || 'クラブメディア';
            return 'FNL運営';
        }

        function getNewsCategoryLabel(item) {
            const legacyLabels = {
                '結果速報': '試合結果',
                'プレビュー': '試合情報',
                '運営': '規約・運営'
            };
            const category = item?.category || 'お知らせ';
            return legacyLabels[category] || category;
        }

        let currentNewsPage = 1;
        const NEWS_PER_PAGE = 6;

        function renderNews() {
            const homeWrap = document.getElementById('home-news-preview');
            const fullWrap = document.getElementById('full-news-list');
            const paginationWrap = document.getElementById('news-pagination');
            if (!homeWrap || !fullWrap || !paginationWrap) return;

            if (state.news.length === 0) {
                homeWrap.innerHTML = `<div style="text-align:center; color:var(--text-muted); font-size:0.8rem; padding:1rem;">ニュースはありません</div>`;
                fullWrap.innerHTML = `<div style="text-align:center; color:var(--text-muted); font-size:0.8rem; padding:1rem;">ニュースはありません</div>`;
                paginationWrap.innerHTML = '';
                return;
            }

            const renderNewsItems = items => items.map(n => `
                    <button type="button" class="news-item" onclick="openNewsDetailSheet('${n.id}')">
                        <div class="news-meta">
                            <span class="news-category">${escapeHtml(getNewsCategoryLabel(n))}</span>
                            <span class="news-source">${escapeHtml(getNewsSourceLabel(n))}</span>
                            <span class="news-date">${escapeHtml(n.date)}</span>
                        </div>
                        <div class="news-title">${escapeHtml(n.title)}</div>
                    </button>
                `).join('');
            homeWrap.innerHTML = renderNewsItems(state.news.slice(0, 3));
            const totalPages = Math.ceil(state.news.length / NEWS_PER_PAGE);
            currentNewsPage = Math.min(Math.max(currentNewsPage, 1), totalPages);
            const start = (currentNewsPage - 1) * NEWS_PER_PAGE;
            fullWrap.innerHTML = renderNewsItems(state.news.slice(start, start + NEWS_PER_PAGE));
            paginationWrap.innerHTML = totalPages > 1 ? `
                <button class="news-page-button" type="button" onclick="goToNewsPage(${currentNewsPage - 1})" ${currentNewsPage === 1 ? 'disabled' : ''} aria-label="前のページ">‹</button>
                ${Array.from({ length: totalPages }, (_, index) => {
                    const page = index + 1;
                    return `<button class="news-page-button ${page === currentNewsPage ? 'active' : ''}" type="button" onclick="goToNewsPage(${page})" ${page === currentNewsPage ? 'aria-current="page"' : ''}>${page}</button>`;
                }).join('')}
                <button class="news-page-button" type="button" onclick="goToNewsPage(${currentNewsPage + 1})" ${currentNewsPage === totalPages ? 'disabled' : ''} aria-label="次のページ">›</button>` : '';
        }

        window.goToNewsPage = function(page) {
            const totalPages = Math.ceil(state.news.length / NEWS_PER_PAGE);
            if (page < 1 || page > totalPages || page === currentNewsPage) return;
            currentNewsPage = page;
            renderNews();
            document.getElementById('page-news')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };

        window.openNewsDetailSheet = function(newsId) {
            const item = state.news.find(n => n.id === newsId);
            if (!item) return;

            const body = document.getElementById('sheet-body');
            body.innerHTML = `
                <div class="news-detail-header">
                    <div class="news-meta">
                        <span class="news-category">${escapeHtml(getNewsCategoryLabel(item))}</span>
                        <span class="news-source">${escapeHtml(getNewsSourceLabel(item))}</span>
                        <span class="news-date">${escapeHtml(item.date)}</span>
                    </div>
                    <h2 class="news-detail-title">${escapeHtml(item.title)}</h2>
                </div>
                <div class="news-detail-content">${escapeHtml(item.content)}</div>
                <button class="btn-danger news-detail-delete" onclick="deleteNewsFromCloud('${item.id}')">このニュースを削除</button>
            `;
            document.getElementById('sheet-overlay').classList.add('active');
        };

        window.deleteNewsFromCloud = function(newsId) {
            if (confirm('このニュースを削除しますか？')) {
                state.news = state.news.filter(n => n.id !== newsId);
                renderNews();
                persistAppState();
                document.getElementById('sheet-overlay').classList.remove('active');
            }
        };

        window.openPostNewsSheet = function() {
            if (!requireEditMode('ニュース投稿')) return;
            const todayStr = new Date().toISOString().split('T')[0].replace(/-/g, '.');
            const body = document.getElementById('sheet-body');
            body.innerHTML = `
                <div class="news-composer-header">
                    <div class="news-composer-kicker">FNL NEWSROOM</div>
                    <h3 class="news-composer-title">ニュースを投稿</h3>
                    <div class="news-composer-copy">掲載情報を選び、見出しと本文を入力して公開します。</div>
                </div>
                <div class="news-composer-section">
                    <div class="news-composer-section-heading"><span>掲載情報</span><small>公開時に表示されます</small></div>
                    <div class="news-composer-panel news-composer-meta">
                        <div class="form-group news-composer-field"><label class="form-label">カテゴリー</label><select id="post-category" class="form-select"><option value="お知らせ">お知らせ</option><option value="試合情報">試合情報</option><option value="試合結果">試合結果</option><option value="移籍情報">移籍情報</option><option value="チーム情報">チーム情報</option><option value="選手情報">選手情報</option><option value="大会・イベント">大会・イベント</option><option value="規約・運営">規約・運営</option></select></div>
                        <div class="form-group news-composer-field"><label class="form-label">発信元</label><select id="post-source" class="form-select"><option value="official">FNL運営</option>${RAW_TEAMS.map(team => `<option value="team:${team.id}">${escapeHtml(team.name)} メディア</option>`).join('')}</select></div>
                        <div class="form-group news-composer-field is-wide"><label class="form-label">投稿日</label><input type="text" id="post-date" class="form-input" value="${todayStr}" aria-label="投稿日"></div>
                    </div>
                </div>
                <div class="news-composer-section">
                    <div class="news-composer-section-heading"><span>記事内容</span><small>タイトルは60文字まで</small></div>
                    <div class="news-composer-panel">
                        <div class="form-group news-composer-field"><label class="form-label">タイトル</label><input type="text" id="post-title" class="form-input" placeholder="例：MATCHWEEK 3 の試合結果を公開" maxlength="60" autocomplete="off"></div>
                        <div class="form-group news-composer-field"><label class="form-label">本文</label><textarea id="post-content" class="form-textarea" placeholder="ニュースの詳細を入力してください"></textarea></div>
                    </div>
                </div>
                <div class="news-composer-publish-note">公開するとホームとニュース一覧に表示され、通知を受け取る設定の利用者へもお知らせされます。</div>
                <button class="btn-primary news-composer-submit" onclick="submitNewsPostToCloud()">ニュースを公開</button>
            `;
            document.getElementById('sheet-overlay').classList.add('active');
        };

        window.submitNewsPostToCloud = function() {
            const category = document.getElementById('post-category').value;
            const date = document.getElementById('post-date').value.trim();
            const title = document.getElementById('post-title').value.trim();
            const content = document.getElementById('post-content').value.trim();
            const sourceValue = document.getElementById('post-source')?.value || 'official';
            if (!title || !content) return;

            const sourceTeamId = sourceValue.startsWith('team:') ? sourceValue.slice(5) : '';
            const sourceTeam = RAW_TEAMS.find(team => team.id === sourceTeamId);

            const newsId = 'n_' + Date.now();
            state.news.unshift({
                id: newsId, date: date || new Date().toISOString().split('T')[0].replace(/-/g, '.'),
                category, title, content,
                sourceType: sourceTeam ? 'team' : 'official',
                sourceTeamId: sourceTeam?.id || '',
                sourceName: sourceTeam?.name || 'FNL運営'
            });
            currentNewsPage = 1;
            renderNews();
            Promise.resolve(persistAppState())
                .then(() => window.notifyNewsPublished?.(newsId))
                .catch(error => console.error('News publish sync failed', error));
            document.getElementById('sheet-overlay').classList.remove('active');
            navigateTo('news', 'ニュース');
        };

        // --- 試合センター ---
        function ensureMatchDetails(match) {
            if (!match.details || typeof match.details !== 'object') match.details = {};
            if (!Array.isArray(match.details.events)) match.details.events = [];
            return match.details;
        }

        function clearMatchDetails(match) {
            match.details = { events: [], motm: null, appearances: { home: [], away: [] } };
        }

        function getRecordedGoalTotals(match, events = ensureMatchDetails(match).events) {
            return events.reduce((totals, event) => {
                if (event.type !== 'goal') return totals;
                if (event.team === match.h) totals.home += 1;
                if (event.team === match.a) totals.away += 1;
                return totals;
            }, { home: 0, away: 0 });
        }

        function cloneMatch(match) {
            return JSON.parse(JSON.stringify(match));
        }

        function addActivity(title, detail, change = {}) {
            if (!Array.isArray(state.activityLog)) state.activityLog = [];
            state.activityLog.unshift({ id: `a_${Date.now()}_${Math.random().toString(16).slice(2)}`, title, detail, actor: 'この端末', before: change.before ?? null, after: change.after ?? null, createdAt: new Date().toISOString() });
            state.activityLog = state.activityLog.slice(0, 100);
        }

        function getRosterNamesByTeamName(teamName) {
            const team = RAW_TEAMS.find(item => item.name === teamName);
            if (!team || !Array.isArray(state.rosters[team.id])) return [];
            return state.rosters[team.id]
                .filter(player => player.status !== 'released' && player.status !== 'transferred' && player.name)
                .map(player => player.name);
        }

        function getAppearancePickerNames(teamName) {
            const appearancesByName = new Map(
                calculatePlayerStats()
                    .filter(player => player.team === teamName)
                    .map(player => [player.name, player.appearances])
            );
            return getRosterNamesByTeamName(teamName).sort((left, right) =>
                (appearancesByName.get(right) || 0) - (appearancesByName.get(left) || 0)
                || left.localeCompare(right, 'ja')
            );
        }

        function renderAppearancePicker(teamName, side, selectedNames = [], changeHandler = '') {
            const players = getAppearancePickerNames(teamName);
            if (!players.length) return `<div class="empty-state">先に「選手名簿」で選手を登録してください</div>`;
            return `<div class="appearance-picker">${players.map(name => `<label class="appearance-option"><input type="checkbox" data-record-input data-appearance="${side}" value="${escapeHtml(name)}" ${selectedNames.includes(name) ? 'checked' : ''} ${changeHandler ? `onchange="${changeHandler}"` : ''}><span>${escapeHtml(name)}</span></label>`).join('')}</div>`;
        }

        function matchEventPlayerOptions(teamName, placeholder = '選手を選択', selectedName = '', allowedNames = null) {
            const players = Array.isArray(allowedNames) ? allowedNames : getRosterNamesByTeamName(teamName);
            if (selectedName && !players.includes(selectedName)) players.unshift(selectedName);
            return `<option value="">${placeholder}</option>${players.map(name => `<option value="${escapeHtml(name)}" ${name === selectedName ? 'selected' : ''}>${escapeHtml(name)}</option>`).join('')}`;
        }

        const OWN_GOAL_VALUE = '__own_goal__';

        function goalScorerOptions(teamName, allowedNames = null, selectedName = '') {
            const players = Array.isArray(allowedNames) ? allowedNames : getRosterNamesByTeamName(teamName);
            if (selectedName && selectedName !== OWN_GOAL_VALUE && !players.includes(selectedName)) players.unshift(selectedName);
            return `<option value="">得点者を選択</option><option value="${OWN_GOAL_VALUE}" ${selectedName === OWN_GOAL_VALUE ? 'selected' : ''}>オウンゴール</option>${players.map(name => `<option value="${escapeHtml(name)}" ${name === selectedName ? 'selected' : ''}>${escapeHtml(name)}</option>`).join('')}`;
        }

        function isOwnGoalEvent(event) {
            return event?.ownGoal === true || event?.player === 'オウンゴール';
        }

        window.updateGoalAssistAvailability = function(playerSelectId, assistSelectId) {
            const playerSelect = document.getElementById(playerSelectId);
            const assistSelect = document.getElementById(assistSelectId);
            if (!playerSelect || !assistSelect) return;
            const ownGoal = playerSelect.value === OWN_GOAL_VALUE;
            if (ownGoal) assistSelect.value = '';
            assistSelect.disabled = ownGoal;
        };

        const leagueMatchDrafts = new Map();

        function createLeagueMatchDraft(match) {
            const details = ensureMatchDetails(match);
            return { hs: match.hs ?? '', as: match.as ?? '', motmTeam: details.motm?.team === match.a ? match.a : match.h, motm: details.motm?.name || '', appearances: { home: [...(details.appearances?.home || [])], away: [...(details.appearances?.away || [])] }, events: JSON.parse(JSON.stringify(details.events || [])), goalTeam: match.h };
        }

        function captureLeagueMatchDraft(match) {
            const existing = leagueMatchDrafts.get(match.id) || createLeagueMatchDraft(match);
            if (!document.getElementById('input-hs')) return existing;
            const selected = side => [...document.querySelectorAll(`[data-appearance="league-${side}"]:checked`)].map(input => input.value);
            const draft = { ...existing, hs: document.getElementById('input-hs')?.value ?? existing.hs, as: document.getElementById('input-as')?.value ?? existing.as, motmTeam: document.getElementById('input-motm-team')?.value || existing.motmTeam, motm: document.getElementById('input-motm')?.value || '', appearances: { home: selected('home'), away: selected('away') }, goalTeam: document.getElementById('league-goal-team')?.value || existing.goalTeam };
            leagueMatchDrafts.set(match.id, draft);
            return draft;
        }

        function allowedMatchPlayers(match, teamName, draft) {
            return teamName === match.h ? draft.appearances.home : draft.appearances.away;
        }

        function renderLeagueMatchCenter(match) {
            const draft = leagueMatchDrafts.get(match.id) || createLeagueMatchDraft(match);
            leagueMatchDrafts.set(match.id, draft);
            const goalEvents = draft.events.filter(event => event.type === 'goal');
            const goalTeam = draft.goalTeam === match.a ? match.a : match.h;
            const goalPlayers = allowedMatchPlayers(match, goalTeam, draft);
            const motmPlayers = allowedMatchPlayers(match, draft.motmTeam, draft);
            document.getElementById('sheet-body').innerHTML = `
                <div class="match-center-header"><div class="match-center-kicker">MATCHWEEK ${match.mw}</div><h3 class="match-center-title">マッチセンター</h3><div class="match-center-subtitle">公式試合記録</div></div>
                <section class="match-step" data-step="1"><div class="match-step-title">スコア</div><div class="match-center-scoreboard"><div class="match-center-team"><img src="${getTeamLogo(match.h)}" alt=""><div class="match-center-team-name">${escapeHtml(match.h)}</div><input data-record-input type="number" id="input-hs" aria-label="${escapeHtml(match.h)}の得点" class="form-input match-center-score-input" inputmode="numeric" min="0" max="20" value="${draft.hs}" placeholder="0"></div><div class="match-center-versus">VS</div><div class="match-center-team"><img src="${getTeamLogo(match.a)}" alt=""><div class="match-center-team-name">${escapeHtml(match.a)}</div><input data-record-input type="number" id="input-as" aria-label="${escapeHtml(match.a)}の得点" class="form-input match-center-score-input" inputmode="numeric" min="0" max="20" value="${draft.as}" placeholder="0"></div></div></section>
                <section class="match-step" data-step="2"><div class="match-step-title">出場選手・MOM</div><div class="match-center-lineup-grid"><div class="match-center-lineup"><div class="match-center-lineup-name"><img src="${getTeamLogo(match.h)}" alt="">${escapeHtml(match.h)}</div>${renderAppearancePicker(match.h, 'league-home', draft.appearances.home, `refreshLeagueParticipantOptions('${match.id}')`)}</div><div class="match-center-lineup"><div class="match-center-lineup-name"><img src="${getTeamLogo(match.a)}" alt="">${escapeHtml(match.a)}</div>${renderAppearancePicker(match.a, 'league-away', draft.appearances.away, `refreshLeagueParticipantOptions('${match.id}')`)}</div></div><span class="match-center-core-label" style="margin-top:.8rem">MOM</span><div class="match-center-mom"><select data-record-input id="input-motm-team" class="form-select" onchange="refreshLeagueParticipantOptions('${match.id}')"><option value="${escapeHtml(match.h)}" ${draft.motmTeam === match.h ? 'selected' : ''}>${escapeHtml(match.h)}</option><option value="${escapeHtml(match.a)}" ${draft.motmTeam === match.a ? 'selected' : ''}>${escapeHtml(match.a)}</option></select><select data-record-input id="input-motm" class="form-select">${matchEventPlayerOptions(draft.motmTeam, 'MOMを選択', draft.motm, motmPlayers)}</select></div></section>
                <section class="match-step" data-step="3"><div class="match-step-title">得点記録</div><div class="event-entry-card edit-only"><div class="form-group"><label class="form-label">得点したチーム</label><select data-record-input id="league-goal-team" class="form-select" onchange="updateLeagueGoalOptions('${match.id}')"><option value="${escapeHtml(match.h)}" ${goalTeam === match.h ? 'selected' : ''}>${escapeHtml(match.h)}</option><option value="${escapeHtml(match.a)}" ${goalTeam === match.a ? 'selected' : ''}>${escapeHtml(match.a)}</option></select></div><div class="form-group"><label class="form-label">得点者</label><select data-record-input id="league-goal-player" class="form-select" onchange="updateGoalAssistAvailability('league-goal-player','league-goal-assist')">${goalScorerOptions(goalTeam, goalPlayers)}</select></div><div class="form-group"><label class="form-label">アシスト</label><select data-record-input id="league-goal-assist" class="form-select">${matchEventPlayerOptions(goalTeam, 'アシストなし', '', goalPlayers)}</select></div></div><button class="btn-secondary edit-only" style="width:100%;" onclick="addLeagueGoal('${match.id}')">得点を追加</button><div class="match-center-events">${goalEvents.length ? goalEvents.map(event => `<div class="event-row"><div class="ranking-main"><div class="match-event-type">${isOwnGoalEvent(event) ? 'OWN GOAL' : 'GOAL'}</div><div class="ranking-name">${escapeHtml(event.player)}</div><div class="ranking-team">${escapeHtml(event.team)}${event.assist ? ` ・ AS ${escapeHtml(event.assist)}` : ''}</div></div><button class="btn-secondary edit-only" onclick="deleteMatchEvent('${match.id}','${event.id}')">削除</button></div>`).join('') : '<div class="empty-state">得点記録はありません</div>'}</div></section>
                <div class="match-center-save-bar edit-only"><button class="btn-primary match-center-save" onclick="saveScoreToCloud('${match.id}')">内容を確認</button></div>
                <div class="match-center-utilities"><button class="share-action-btn" onclick="generateMatchShareText('${match.id}')">試合結果を共有</button></div>${match.hs !== null ? `<button class="btn-danger edit-only" onclick="clearScoreInCloud('${match.id}')">スコアを取り消す</button>` : ''}<button class="btn-secondary event-entry-back" onclick="dismissLeagueMatchCenter('${match.id}')">閉じる</button>`;
        }

        window.openScoreInputSheet = function(mId) {
            const m = state.schedule.find(item => item.id === mId);
            if (!m) return;
            leagueMatchDrafts.set(m.id, createLeagueMatchDraft(m));
            renderLeagueMatchCenter(m);
            document.getElementById('sheet-overlay').classList.add('active');
        };

        window.saveScoreToCloud = function(mId) {
            if (!requireEditMode('試合結果の保存')) return;
            const m = state.schedule.find(item => item.id === mId);
            if (!m) return;
            const draft = captureLeagueMatchDraft(m);
            const hsVal = String(draft.hs).trim(), asVal = String(draft.as).trim();
            if (hsVal === '' || asVal === '') return alert('両チームの得点を入力してください。');
            const homeScore = Number(hsVal), awayScore = Number(asVal);
            if (!Number.isInteger(homeScore) || !Number.isInteger(awayScore) || homeScore < 0 || awayScore < 0 || homeScore > 20 || awayScore > 20) return alert('スコアは0〜20の整数で入力してください。');
            const totals = getRecordedGoalTotals(m, draft.events);
            if (totals.home > homeScore || totals.away > awayScore) return alert('得点記録の数がスコアを超えています。得点記録を確認してください。');
            if (draft.motm && !allowedMatchPlayers(m, draft.motmTeam, draft).includes(draft.motm)) return alert('MOMは出場選手から選択してください。');
            document.getElementById('sheet-body').innerHTML = `<div class="match-center-header"><div class="match-center-kicker">MATCHWEEK ${m.mw}</div><h3 class="match-center-title">保存内容の確認</h3></div><div class="match-review"><div class="match-review-score"><span>${escapeHtml(m.h)}</span><strong>${homeScore} - ${awayScore}</strong><span>${escapeHtml(m.a)}</span></div><div class="match-review-meta"><div>MOM：${escapeHtml(draft.motm || '未入力')}</div><div>出場選手：${draft.appearances.home.length}名 / ${draft.appearances.away.length}名</div><div>得点記録：${draft.events.filter(event => event.type === 'goal').length}件</div></div></div><div class="match-center-save-bar"><button class="btn-primary match-center-save" onclick="commitLeagueMatch('${m.id}')">この内容で保存</button></div><button class="btn-secondary" style="width:100%" onclick="renderLeagueMatchCenter(state.schedule.find(item=>item.id==='${m.id}'))">入力に戻る</button>`;
        };

        window.commitLeagueMatch = function(mId) {
            if (!requireEditMode('試合結果の保存')) return;
            const m = state.schedule.find(item => item.id === mId), draft = leagueMatchDrafts.get(mId);
            if (!m || !draft) return;
            if (m) {
                const homeScore = Number(draft.hs), awayScore = Number(draft.as);
                const before = `${m.hs ?? '-'}-${m.as ?? '-'}`;
                const rollbackMatch = cloneMatch(m);
                m.hs = homeScore;
                m.as = awayScore;
                const details = ensureMatchDetails(m);
                details.motm = draft.motm ? { name: draft.motm, team: draft.motmTeam } : null;
                details.appearances = JSON.parse(JSON.stringify(draft.appearances));
                details.events = JSON.parse(JSON.stringify(draft.events));
                addActivity('試合結果を更新', `MW${m.mw} ${m.h} ${m.hs}-${m.as} ${m.a}`, { before, after: `${m.hs}-${m.as}` });
                state.standingsDirty = true;
                refreshAllViews();
                Promise.resolve(persistAppState()).catch(error => {
                    const index = state.schedule.findIndex(item => item.id === mId);
                    if (index >= 0) state.schedule[index] = rollbackMatch;
                    state.standingsDirty = true;

        window.addLeagueGoal = function(mId) { if (!requireEditMode('得点記録の追加')) return; const match = state.schedule.find(item => item.id === mId), selectedPlayer = document.getElementById('league-goal-player')?.value; if (!match || !selectedPlayer) return alert('得点者を選択してください。'); const draft = captureLeagueMatchDraft(match), team = document.getElementById('league-goal-team').value, allowed = allowedMatchPlayers(match, team, draft), ownGoal = selectedPlayer === OWN_GOAL_VALUE, assist = ownGoal ? '' : (document.getElementById('league-goal-assist').value || ''); if (!ownGoal && !allowed.includes(selectedPlayer)) return alert('得点者は出場選手から選択してください。'); if (assist && (!allowed.includes(assist) || assist === selectedPlayer)) return alert('アシストは同じチームの別の出場選手を選択してください。'); const targetScore = Number(team === match.h ? draft.hs : draft.as); const recorded = draft.events.filter(event => event.type === 'goal' && event.team === team).length; if (!Number.isFinite(targetScore) || String(team === match.h ? draft.hs : draft.as).trim() === '') return alert('先にスコアを入力してください。'); if (recorded >= targetScore) return alert('これ以上追加すると得点記録がスコアを超えます。'); draft.events.push({ id: `e_${Date.now()}_${Math.random().toString(16).slice(2)}`, type: 'goal', team, player: ownGoal ? 'オウンゴール' : selectedPlayer, ownGoal, assist, minute: 0 }); leagueMatchDrafts.set(mId, draft); renderLeagueMatchCenter(match); };

        function resolvePlayerTeam(match, playerName, fallback = '') {
            if (!playerName) return fallback;
            if (getRosterNamesByTeamName(match.h).includes(playerName)) return match.h;
            if (getRosterNamesByTeamName(match.a).includes(playerName)) return match.a;
            return fallback;
        }

        function calculatePlayerStats() {
            const map = new Map();
            const get = (name, team = '') => {
                const safeName = String(name || '').trim();
                if (!safeName) return null;
                const key = `${team}|${safeName}`;
                if (!map.has(key)) map.set(key, { name: safeName, team, appearances: 0, goals: 0, assists: 0, motm: 0, yellow: 0, red: 0 });
                return map.get(key);
            };
            state.schedule.forEach(match => {
                if (match.hs === null || match.as === null) return;
                const details = ensureMatchDetails(match);
                (details.appearances?.home || []).forEach(name => { const stat = get(name, match.h); if (stat) stat.appearances += 1; });
                (details.appearances?.away || []).forEach(name => { const stat = get(name, match.a); if (stat) stat.appearances += 1; });
                details.events.forEach(event => {
                    if (event.type === 'goal' && isOwnGoalEvent(event)) return;
                    const stat = get(event.player, event.team || '');
                    if (!stat) return;
                    if (event.type === 'goal') stat.goals += 1;
                    if (event.type === 'yellow') stat.yellow += 1;
                    if (event.type === 'red') stat.red += 1;
                    if (event.type === 'goal' && event.assist) {
                        const assist = get(event.assist, event.team || '');
                        if (assist) assist.assists += 1;
                    }
                });
                if (details.motm?.name) {
                    const team = details.motm.team || resolvePlayerTeam(match, details.motm.name);
                    const motm = get(details.motm.name, team);
                    if (motm) motm.motm += 1;
                }
            });
            return [...map.values()];
        }

        function renderRankingRows(players, valueRenderer, limit = 5) {
            if (!players.length) return `<div class="empty-state">試合センターで選手記録を入力すると表示されます</div>`;
            return players.slice(0, limit).map((player, index) => `
                <div class="ranking-row">
                    <div class="ranking-position">${index + 1}</div>
                    <div class="ranking-main"><div class="ranking-name">${escapeHtml(player.name)}</div><div class="ranking-team">${escapeHtml(player.team || '所属未設定')} ・ 出場 ${player.appearances}</div></div>
                    <div class="ranking-number">${valueRenderer(player)}</div>
                </div>`).join('');
        }

        function getPlayerRanking(type) {
            const stats = calculatePlayerStats();
            const rankings = {
                goals: {
                    title: '得点ランキング',
                    players: [...stats].filter(player => player.goals > 0).sort((a,b) => b.goals - a.goals || b.assists - a.assists),
                    valueRenderer: player => `${player.goals}`
                },
                assists: {
                    title: 'アシストランキング',
                    players: [...stats].filter(player => player.assists > 0).sort((a,b) => b.assists - a.assists || b.goals - a.goals),
                    valueRenderer: player => `${player.assists}`
                },
                mom: {
                    title: 'MOMランキング',
                    players: [...stats].filter(player => player.motm > 0).sort((a,b) => b.motm - a.motm || b.appearances - a.appearances),
                    valueRenderer: player => `${player.motm}`
                }
            };
            return rankings[type];
        }

            const latestCompletedMatch = state.schedule
                .filter(m => m.hs !== null && m.as !== null)
                .reduce((latest, match) => !latest || Number(match.mw) > Number(latest.mw) ? match : latest, null);
            const target = nextMatch || latestCompletedMatch || state.schedule[0];
            if (!target) return;
            const homeLogo = getTeamLogo(target.h);
            const awayLogo = getTeamLogo(target.a);
            const isPlayed = target.hs !== null && target.as !== null;
            const scoreText = isPlayed ? `${target.hs} - ${target.as}` : 'VS';

            wrap.innerHTML = `
                <div class="match-card-top"><span class="match-sec-badge">MATCHWEEK ${target.mw}</span><span class="match-status-badge ${isPlayed ? 'is-finished' : ''}">${isPlayed ? '試合終了' : '次の試合'}</span></div>
                <div class="match-main-row">
                    <div class="match-teams-center">
                        <div class="match-team-box home"><span>${escapeHtml(target.h)}</span><img src="${homeLogo}" class="team-logo-img"></div>
                        <span class="match-score-pill ${isPlayed ? 'played' : ''}">${scoreText}</span>
                        <div class="match-team-box away"><img src="${awayLogo}" class="team-logo-img"><span>${escapeHtml(target.a)}</span></div>
                    </div>
                </div>
                <button class="edit-score-btn" onclick="openScoreInputSheet('${target.id}')">MATCH CENTERを開く</button>
            `;
        }

        function renderTeams() {
            const grid = document.getElementById('teams-grid');
            if (!grid) return;
            const list = calculateStandings();
            let html = '';
            list.forEach(t => {
                html += `<button type="button" class="card team-directory-card" onclick="openTeamSheet('${escapeHtml(t.name)}')" aria-label="${escapeHtml(t.name)}の詳細を開く">
                    <span class="team-directory-rank">RANK <b>${String(t.rank).padStart(2, '0')}</b></span>
                    <span class="team-directory-crest"><img src="${t.logo}" class="team-directory-logo" alt=""></span>
                    <span class="team-directory-name">${escapeHtml(t.name)}</span>
                    <span class="team-directory-meta">${t.pts}<small>PTS</small></span>
                </button>`;
            });
            grid.innerHTML = html;
        }

        // --- 選手名簿 ---
        const cloneRosterData = value => JSON.parse(JSON.stringify(value));

        function getRoster(teamId) {
            if (!Array.isArray(state.rosters[teamId])) state.rosters[teamId] = [];
            return state.rosters[teamId];
        }

        function activeRosterPlayers(teamId) {
            return getRoster(teamId).filter(player => player?.status !== 'released' && player?.status !== 'transferred');
        }

        function getRosterCounts(teamId) {
            const roster = activeRosterPlayers(teamId);
            return {
                total: roster.length,
                special: roster.filter(player => player.cardType === 'special').length,
                normal: roster.filter(player => player.cardType !== 'special').length
            };
        }

        function normalizePlayerIdentity(name = '') {
            return String(name).normalize('NFKC').trim().toLocaleLowerCase('ja-JP').replace(/[\s　._・-]+/g, '');
        }

        function findPlayerOwnership(name, exceptTeamId = '') {
            const identity = normalizePlayerIdentity(name);
            if (!identity) return null;
            for (const team of RAW_TEAMS) {
                if (team.id === exceptTeamId) continue;
                const player = activeRosterPlayers(team.id).find(item => normalizePlayerIdentity(item.name) === identity);
                if (player) return { team, player };
            }
            return null;
        }

        function validateRoster(teamId, roster, allowIncomplete = false) {
            const active = (roster || []).filter(player => player?.status !== 'released' && player?.status !== 'transferred');
            const normal = active.filter(player => player.cardType !== 'special').length;
            const special = active.length - normal;
            const errors = [];
            if (active.length > 25) errors.push('登録上限25名を超えています');
            if (special > 18) errors.push('特別カードは18名までです');
            if (!allowIncomplete && normal < 7) errors.push('ノーマルカードが7名未満になります');
            const names = new Set();
            active.forEach(player => {
                const identity = normalizePlayerIdentity(player.name);
                if (identity && names.has(identity)) errors.push(`${player.name} が重複しています`);
                names.add(identity);
            });
            return { valid: !errors.length, errors };
        }

        function getPlayerSeasonAppearances(teamName, playerName) {
            return calculatePlayerStats().find(stat => stat.team === teamName && stat.name === playerName)?.appearances || 0;
        }

        function commitRosterChange(previousRosters) {
            refreshAllViews();
            return Promise.resolve(persistAppState()).catch(error => {
                state.rosters = previousRosters;
                saveStateToStorage();
                refreshAllViews();
                alert(`${error?.message || '保存に失敗しました。'}\n名簿を変更前に戻しました。`);
            });
        }

        window.openRosterSheet = function(teamId) {
            const team = RAW_TEAMS.find(item => item.id === teamId);
            if (!team) return;
            const counts = getRosterCounts(teamId);
            const players = activeRosterPlayers(teamId);
            const positions = ['FW', 'MF', 'DF', 'GK'];
            const positionCounts = Object.fromEntries(positions.map(position => [position, players.filter(player => player.position === position).length]));
            const groups = positions.map(position => ({ position, players: players.filter(player => player.position === position) })).filter(group => group.players.length);
            const uncategorized = players.filter(player => !positions.includes(player.position));
            if (uncategorized.length) groups.push({ position: '未登録', players: uncategorized });
            const playerRows = groups.length ? groups.map(group => `
                <section class="roster-position-section">
                    <div class="roster-position-header">${group.position}<span>${group.players.length}名</span></div>
                    <div class="roster-player-list">${group.players.map((player, index) => {
                        const appearances = getPlayerSeasonAppearances(team.name, player.name);
                        return `<div class="roster-player-card"><div class="roster-player-index">${String(index + 1).padStart(2, '0')}</div><div class="roster-player-info"><div class="roster-player-name">${escapeHtml(player.name)}</div><div class="roster-player-tags"><span class="position">${escapeHtml(player.position || '未登録')}</span><span>出場 ${appearances}</span><span>${player.cardType === 'special' ? '特別' : '通常'}</span>${appearances >= 10 ? '<span class="protection-ready" title="今シーズン10試合以上出場">プロテクト可</span>' : ''}</div></div><button class="btn-secondary" onclick="removePlayer('${teamId}','${player.id}')">削除</button></div>`;
                    }).join('')}</div>
                </section>`).join('') : '<div class="roster-empty">登録選手はまだいません</div>';
            document.getElementById('sheet-body').innerHTML = `
                <div class="roster-sheet-hero"><img src="${team.logo}" class="team-logo-lg" alt=""><div class="roster-sheet-title">${escapeHtml(team.name)}</div><div class="roster-sheet-subtitle">SQUAD LIST · ${counts.total} PLAYERS</div><div class="roster-composition-grid">${positions.map(position => `<div class="roster-composition-item"><div class="roster-composition-position">${position}</div><div class="roster-composition-count">${positionCounts[position]}</div></div>`).join('')}</div><div class="roster-sheet-summary"><span>登録 ${counts.total}/25</span><span>特別 ${counts.special}/18</span><span>通常 ${counts.normal}</span></div></div>
                <div class="roster-list-heading"><strong>選手一覧</strong><span>10試合以上でプロテクト可</span></div>${playerRows}
                <button class="btn-primary roster-add-button" onclick="openAddPlayerSheet('${teamId}')">選手を追加</button>`;
            document.getElementById('sheet-overlay').classList.add('active');
        };

        window.openAddPlayerSheet = function(defaultTeamId = '') {
            const teamOptions = RAW_TEAMS.map(team => `<option value="${team.id}" ${team.id === defaultTeamId ? 'selected' : ''}>${escapeHtml(team.name)}</option>`).join('');
            document.getElementById('sheet-body').innerHTML = `<div style="text-align:center;margin-bottom:1rem"><h3>選手を登録</h3></div><div class="form-group"><label class="form-label">所属チーム</label><select id="player-team" class="form-select">${teamOptions}</select></div><div class="form-group"><label class="form-label">選手名</label><input id="player-name" class="form-input" maxlength="40" autocomplete="off"></div><div class="form-group"><label class="form-label">ポジション</label><select id="player-position" class="form-select"><option>FW</option><option>MF</option><option>DF</option><option>GK</option></select></div><div class="form-group"><label class="form-label">カード種別</label><select id="player-card-type" class="form-select"><option value="normal">ノーマルカード</option><option value="special">特別カード</option></select></div><button class="btn-primary" onclick="savePlayerToRoster()">登録して同期</button>`;
            document.getElementById('sheet-overlay').classList.add('active');
        };

        window.savePlayerToRoster = function() {
            const teamId = document.getElementById('player-team')?.value;
            const name = document.getElementById('player-name')?.value.trim();
            const position = document.getElementById('player-position')?.value;
            const cardType = document.getElementById('player-card-type')?.value;
            if (!teamId || !name) return alert('所属チームと選手名を入力してください。');
            const owner = findPlayerOwnership(name);
            if (owner) return alert(`この選手は${owner.team.name}に登録されています。`);
            const current = activeRosterPlayers(teamId);
            const proposed = [...current, { id:'preview', name, position, cardType, status:'active' }];
            const validation = validateRoster(teamId, proposed, current.filter(player => player.cardType !== 'special').length < 7);
            if (!validation.valid) return alert(validation.errors.join('\n'));
            const previous = cloneRosterData(state.rosters);
            getRoster(teamId).push({ id:`p_${Date.now()}`, name, position, cardType, status:'active' });
            addActivity('選手登録', `${name} を ${RAW_TEAMS.find(team => team.id === teamId)?.name || ''} に登録`);
            document.getElementById('sheet-overlay').classList.remove('active');
            commitRosterChange(previous);
        };

        window.removePlayer = function(teamId, playerId) {
            const player = getRoster(teamId).find(item => item.id === playerId);
            if (!player || !confirm(`${player.name}を名簿から削除しますか？`)) return;
            const proposed = getRoster(teamId).filter(item => item.id !== playerId);
            const validation = validateRoster(teamId, proposed, true);
            if (!validation.valid) return alert(validation.errors.join('\n'));
            const previous = cloneRosterData(state.rosters);
            state.rosters[teamId] = proposed;
            addActivity('選手削除', `${player.name} を名簿から削除`);
            commitRosterChange(previous).then(() => openRosterSheet(teamId));
        };

        function getRuleChapterCategory(chapterName = '') {
            if (/選手登録|移籍/.test(chapterName)) return 'transfer';
            if (/試合|リーグ戦|カップ戦/.test(chapterName)) return 'matches';
            if (/表彰|メディア|運営|懲戒|改正/.test(chapterName)) return 'operation';
            return 'basic';
        }

        function renderRules() {
            const regulations = ensureRegulationState();
            const current = regulations.current;
            const wrap = document.getElementById('rules-accordion-container');
            const meta = document.getElementById('rules-current-meta');
            const filterBar = document.getElementById('rules-filter-bar');
            const category = state.ruleCategory || 'basic';
            if (meta) meta.innerHTML = `<div class="market-note"><b>Version ${Number(current.version) || 1}</b> ・ 施行日 ${escapeHtml(current.effectiveDate || '未設定')}<br>${escapeHtml(current.reason || '')}</div>`;
            if (filterBar) {
                const filters = [['basic', '基本'], ['matches', '試合'], ['transfer', '移籍'], ['operation', '運営'], ['all', 'すべて']];
                filterBar.innerHTML = filters.map(([key, label]) => `<button class="rule-filter-button ${category === key ? 'active' : ''}" onclick="filterRules('${key}')">${label}</button>`).join('');
            }
            if (wrap) {
                let html = '';
                current.chapters.forEach((ch, idx) => {
                    if (category !== 'all' && getRuleChapterCategory(ch.chapter) !== category) return;
                    const articleCount = (ch.articles || []).length;
                    html += `
                        <div class="rule-chapter">
                            <div class="rule-chapter-header" onclick="toggleRuleChapter(${idx}, this)">
                                <span>${escapeHtml(ch.chapter)}</span>
                                <span class="rule-chapter-count">${articleCount}条</span>
                                <span class="rule-arrow" style="font-size:0.65rem; color:var(--text-muted);">▼</span>
                            </div>
                            <div class="rule-chapter-content" id="rule-chapter-${idx}">`;
                    (ch.articles || []).forEach(art => {
                        html += `<div class="rule-article-title">${escapeHtml(art.title)}</div><div>${art.text}</div>`;
                    });
                    html += `</div></div>`;
                });
                wrap.innerHTML = html;
            }
            renderRegulationHistory();
            renderRegulationManager();
        }

        window.filterRules = function(category) {
            state.ruleCategory = category;
            renderRules();
        };

        window.switchRulesView = function(view, button) {
            document.querySelectorAll('[id^="rules-pane-"]').forEach(pane => pane.classList.remove('active'));
            document.querySelectorAll('[data-rules-tab]').forEach(tab => tab.classList.remove('active'));
            document.getElementById(`rules-pane-${view}`)?.classList.add('active');
            button?.classList.add('active');
            if (view === 'manage') renderRegulationManager();
        };

        function renderRegulationHistory() {
            const wrap = document.getElementById('rules-history-list');
            if (!wrap) return;
            const regulations = ensureRegulationState();
            const versions = [regulations.current, ...regulations.history];
            wrap.innerHTML = versions.map((version, index) => `
                <div class="card" style="margin-bottom:0.6rem;">
                    <div class="ranking-row">
                        <div class="ranking-main" onclick="openRegulationVersion('${escapeHtml(version.id)}')">
                            <div class="ranking-name">Version ${Number(version.version) || 1}${index === 0 ? '（現行）' : ''}</div>
                            <div class="ranking-team">施行日 ${escapeHtml(version.effectiveDate || '未設定')} ・ ${escapeHtml(version.reason || '改正理由なし')}</div>
                        </div>
                    </div>
                </div>`).join('');
        }

        function createDraftFromCurrent() {
            const regulations = ensureRegulationState();
            regulations.draft = {
                chapters: cloneRegulationData(regulations.current.chapters),
                effectiveDate: regulationDateToday(),
                reason: ''
            };
            return regulations.draft;
        }

        function collectRegulationDraftFromForm() {
            const container = document.getElementById('rules-draft-editor');
            if (!container) return ensureRegulationState().draft;
            const chapters = Array.from(container.querySelectorAll('[data-rule-chapter]')).map(chapterEl => ({
                chapter: chapterEl.querySelector('[data-rule-chapter-title]')?.value.trim() || '',
                articles: Array.from(chapterEl.querySelectorAll('[data-rule-article]')).map(articleEl => ({
                    title: articleEl.querySelector('[data-rule-article-title]')?.value.trim() || '',
                    text: ruleEditorTextToHtml(articleEl.querySelector('[data-rule-article-text]')?.value || '')
                }))
            }));
            const draft = ensureRegulationState().draft || {};
            draft.chapters = chapters;
            draft.effectiveDate = document.getElementById('regulation-effective-date')?.value || regulationDateToday();
            draft.reason = document.getElementById('regulation-reason')?.value.trim() || '';
            ensureRegulationState().draft = draft;
            return draft;
        }

        function renderRegulationManager() {
            const wrap = document.getElementById('rules-management-container');
            if (!wrap) return;
            const regulations = ensureRegulationState();
            const draft = regulations.draft;
            if (!draft) {
                wrap.innerHTML = `
                    <div class="market-note" style="margin-bottom:0.7rem;">現行規約から編集用の下書きを作成します。下書きは公開するまで現行規約へ反映されません。</div>
                    <button class="btn-primary" onclick="startRegulationDraft()">現行規約から下書きを作成</button>`;
                return;
            }
            const chaptersHtml = (draft.chapters || []).map((chapter, chapterIndex) => `
                <div class="rule-editor-card" data-rule-chapter="${chapterIndex}">
                    <div class="rule-editor-heading">
                        <input class="form-input" data-rule-chapter-title maxlength="80" value="${escapeHtml(chapter.chapter)}" aria-label="章の見出し">
                        <div class="rule-editor-actions">
                            <button class="btn-secondary" onclick="moveRegulationChapter(${chapterIndex},-1)" ${chapterIndex === 0 ? 'disabled' : ''}>↑</button>
                            <button class="btn-secondary" onclick="moveRegulationChapter(${chapterIndex},1)" ${chapterIndex === draft.chapters.length - 1 ? 'disabled' : ''}>↓</button>
                            <button class="btn-danger" onclick="deleteRegulationChapter(${chapterIndex})">削除</button>
                        </div>
                    </div>
                    ${(chapter.articles || []).map((article, articleIndex) => `
                        <div class="rule-editor-article" data-rule-article="${articleIndex}">
                            <div class="form-group"><label class="form-label">条文見出し</label><input class="form-input" data-rule-article-title maxlength="100" value="${escapeHtml(article.title)}"></div>
                            <div class="form-group"><label class="form-label">本文</label><textarea class="form-textarea" data-rule-article-text rows="5">${escapeHtml(ruleHtmlToEditorText(article.text))}</textarea></div>
                            <div class="rule-editor-actions">
                                <button class="btn-secondary" onclick="moveRegulationArticle(${chapterIndex},${articleIndex},-1)" ${articleIndex === 0 ? 'disabled' : ''}>上へ</button>
                                <button class="btn-secondary" onclick="moveRegulationArticle(${chapterIndex},${articleIndex},1)" ${articleIndex === chapter.articles.length - 1 ? 'disabled' : ''}>下へ</button>
                                <button class="btn-danger" onclick="deleteRegulationArticle(${chapterIndex},${articleIndex})">条文を削除</button>
                            </div>
                        </div>`).join('')}
                    <button class="btn-secondary" style="width:100%;margin-top:0.55rem;" onclick="addRegulationArticle(${chapterIndex})">＋ 条文を追加</button>
                </div>`).join('');
            wrap.innerHTML = `
                <div class="market-note" style="margin-bottom:0.7rem;">編集中の内容は「下書きを保存」で全端末に保存できます。「改正を公開」を押すまで現行規約は変わりません。</div>
                <div class="form-group"><label class="form-label">施行日</label><input id="regulation-effective-date" class="form-input" type="date" value="${escapeHtml(draft.effectiveDate || regulationDateToday())}"></div>
                <div class="form-group"><label class="form-label">改正理由</label><input id="regulation-reason" class="form-input" maxlength="160" value="${escapeHtml(draft.reason || '')}" placeholder="例：移籍市場の運用変更"></div>
                <div id="rules-draft-editor">${chaptersHtml}</div>
                <button class="btn-secondary" style="width:100%;margin-bottom:0.6rem;" onclick="addRegulationChapter()">＋ 章を追加</button>
                <button class="btn-secondary" style="width:100%;margin-bottom:0.6rem;" onclick="saveRegulationDraft()">下書きを保存</button>
                <button class="btn-primary" onclick="publishRegulationDraft()">改正を公開</button>
                <button class="btn-danger" onclick="discardRegulationDraft()">下書きを破棄</button>`;
        }

        window.startRegulationDraft = function() {
            createDraftFromCurrent();
            renderRegulationManager();
            persistAppState();
        };

        window.saveRegulationDraft = function(showMessage = true) {
            const draft = collectRegulationDraftFromForm();
            if (!draft?.chapters?.length) return alert('少なくとも1つの章が必要です。');
            persistAppState();
            if (showMessage) alert('下書きを保存しました。現行規約はまだ変更されていません。');
            return true;
        };

        window.addRegulationChapter = function() {
            const draft = collectRegulationDraftFromForm() || createDraftFromCurrent();
            draft.chapters.push({ chapter: '新しい章', articles: [{ title: '新しい条文', text: '' }] });
            renderRegulationManager();
        };

        window.deleteRegulationChapter = function(chapterIndex) {
            const draft = collectRegulationDraftFromForm();
            if (!draft || draft.chapters.length <= 1) return alert('すべての章を削除することはできません。');
            if (!confirm('この章と含まれる条文を削除しますか？')) return;
            draft.chapters.splice(chapterIndex, 1);
            renderRegulationManager();
        };

        window.moveRegulationChapter = function(chapterIndex, direction) {
            const draft = collectRegulationDraftFromForm();
            const target = chapterIndex + direction;
            if (!draft || target < 0 || target >= draft.chapters.length) return;
            [draft.chapters[chapterIndex], draft.chapters[target]] = [draft.chapters[target], draft.chapters[chapterIndex]];
            renderRegulationManager();
        };

        window.addRegulationArticle = function(chapterIndex) {
            const draft = collectRegulationDraftFromForm();
            if (!draft?.chapters[chapterIndex]) return;
            draft.chapters[chapterIndex].articles.push({ title: '新しい条文', text: '' });
            renderRegulationManager();
        };

        window.deleteRegulationArticle = function(chapterIndex, articleIndex) {
            const draft = collectRegulationDraftFromForm();
            const articles = draft?.chapters[chapterIndex]?.articles;
            if (!articles) return;
            if (!confirm('この条文を削除しますか？')) return;
            articles.splice(articleIndex, 1);
            renderRegulationManager();
        };

        window.moveRegulationArticle = function(chapterIndex, articleIndex, direction) {
            const draft = collectRegulationDraftFromForm();
            const articles = draft?.chapters[chapterIndex]?.articles;
            const target = articleIndex + direction;
            if (!articles || target < 0 || target >= articles.length) return;
            [articles[articleIndex], articles[target]] = [articles[target], articles[articleIndex]];
            renderRegulationManager();
        };

        window.discardRegulationDraft = function() {
            if (!confirm('保存中の下書きを破棄しますか？')) return;
            ensureRegulationState().draft = null;
            renderRegulationManager();
            persistAppState();
        };

        window.publishRegulationDraft = function() {
            const regulations = ensureRegulationState();
            const draft = collectRegulationDraftFromForm();
            if (!draft?.chapters?.length) return alert('公開する規約がありません。');
            if (draft.chapters.some(chapter => !chapter.chapter || !chapter.articles?.length || chapter.articles.some(article => !article.title || !article.text))) {
                return alert('章の見出し、条文見出し、本文をすべて入力してください。');
            }
            if (!draft.effectiveDate || !draft.reason) return alert('施行日と改正理由を入力してください。');
            const articleCount = draft.chapters.reduce((total, chapter) => total + chapter.articles.length, 0);
            document.getElementById('sheet-body').innerHTML = `
                <div style="text-align:center;margin-bottom:0.8rem;"><div class="hero-subtitle">公開前の最終確認</div><h3>Version ${Number(regulations.current.version) + 1}</h3></div>
                <div class="market-note" style="margin-bottom:0.7rem;"><b>施行日：</b>${escapeHtml(draft.effectiveDate)}<br><b>改正理由：</b>${escapeHtml(draft.reason)}<br><b>内容：</b>${draft.chapters.length}章・${articleCount}条文</div>
                ${(draft.chapters || []).map(chapter => `<div class="rule-chapter"><div class="rule-chapter-header" style="cursor:default;"><span>${escapeHtml(chapter.chapter)}</span></div><div class="rule-chapter-content active">${(chapter.articles || []).map(article => `<div class="rule-article-title">${escapeHtml(article.title)}</div><div>${article.text}</div>`).join('')}</div></div>`).join('')}
                <button class="btn-primary" style="margin-top:0.8rem;" onclick="confirmPublishRegulationDraft()">この内容で改正を公開</button>`;
            document.getElementById('sheet-overlay').classList.add('active');
        };

        window.confirmPublishRegulationDraft = function() {
            const regulations = ensureRegulationState();
            const draft = regulations.draft;
            if (!draft) return;
            if (!confirm(`Version ${Number(regulations.current.version) + 1} として規約改正を公開しますか？`)) return;
            regulations.history.unshift(cloneRegulationData(regulations.current));
            regulations.current = {
                id: `regulation-${Date.now()}`,
                version: Number(regulations.current.version) + 1,
                effectiveDate: draft.effectiveDate,
                reason: draft.reason,
                publishedAt: new Date().toISOString(),
                chapters: cloneRegulationData(draft.chapters)
            };
            regulations.draft = null;
            addActivity('規約改正を公開', `Version ${regulations.current.version} ・ ${regulations.current.reason}`);
            document.getElementById('sheet-overlay').classList.remove('active');
            renderRules();
            persistAppState();
            const currentTab = document.querySelector('[data-rules-tab="current"]');
            switchRulesView('current', currentTab);
        };

        window.openRegulationVersion = function(id) {
            const regulations = ensureRegulationState();
            const version = [regulations.current, ...regulations.history].find(item => item.id === id);
            if (!version) return;
            document.getElementById('sheet-body').innerHTML = `
                <div style="text-align:center;margin-bottom:0.8rem;"><div class="hero-subtitle">Version ${Number(version.version) || 1}</div><h3>施行日 ${escapeHtml(version.effectiveDate || '未設定')}</h3><div class="rule-version-meta">${escapeHtml(version.reason || '')}</div></div>
                ${(version.chapters || []).map(chapter => `<div class="rule-chapter"><div class="rule-chapter-header" style="cursor:default;"><span>${escapeHtml(chapter.chapter)}</span></div><div class="rule-chapter-content active">${(chapter.articles || []).map(article => `<div class="rule-article-title">${escapeHtml(article.title)}</div><div>${article.text}</div>`).join('')}</div></div>`).join('')}`;
            document.getElementById('sheet-overlay').classList.add('active');
        };

        window.toggleRuleChapter = function(idx, headerEl) {
            const content = document.getElementById(`rule-chapter-${idx}`);
            if (content) {
                const isActive = content.classList.contains('active');
                document.querySelectorAll('[id^="rule-chapter-"]').forEach(item => item.classList.remove('active'));
                document.querySelectorAll('.rule-chapter-header.open').forEach(item => item.classList.remove('open'));
                content.classList.toggle('active', !isActive);
                headerEl?.classList.toggle('open', !isActive);
            }
        };

        window.openStandingsTeamSheet = function(name) {
            const team = calculateStandings().find(item => item.name === name);
            if (!team) return;
            document.getElementById('sheet-body').innerHTML = `
                <div style="text-align:center;">
                    <img src="${team.logo}" class="team-logo-lg" style="width:64px;height:64px;" alt="${escapeHtml(team.name)}">
                    <h3 style="font-family:'Teko';font-size:1.8rem;line-height:1;margin-top:0.2rem;">${escapeHtml(team.name)}</h3>
                </div>
                <div class="dashboard-grid">
                    <div class="metric-card"><div class="metric-label">順位</div><div class="metric-value">${team.rank}位</div></div>
                    <div class="metric-card"><div class="metric-label">勝点</div><div class="metric-value">${team.pts}</div></div>
                    <div class="metric-card"><div class="metric-label">試合数</div><div class="metric-value">${team.p}</div></div>
                </div>
                <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:0.45rem;margin-bottom:0.55rem;">
                    <div class="metric-card"><div class="metric-label">勝</div><div class="metric-value" style="color:var(--accent-green);">${team.w}</div></div>
                    <div class="metric-card"><div class="metric-label">分</div><div class="metric-value">${team.d}</div></div>
                    <div class="metric-card"><div class="metric-label">負</div><div class="metric-value" style="color:var(--accent-red);">${team.l}</div></div>
                </div>
                <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:0.45rem;">
                    <div class="metric-card"><div class="metric-label">総得点</div><div class="metric-value">${team.gf}</div></div>
                    <div class="metric-card"><div class="metric-label">総失点</div><div class="metric-value">${team.ga}</div></div>
                    <div class="metric-card"><div class="metric-label">得失点差</div><div class="metric-value">${team.gd > 0 ? '+' + team.gd : team.gd}</div></div>
                </div>`;
            document.getElementById('sheet-overlay').classList.add('active');
        };

        window.openTeamSheet = function(name, statView = 'goals') {
            const raw = RAW_TEAMS.find(item => item.name === name);
            if (!raw) return;

            const teamPlayers = activeRosterPlayers(raw.id).map(player => {
                const recorded = calculatePlayerStats().find(stat => stat.team === name && stat.name === player.name) || {};
                return { name: player.name, goals: recorded.goals || 0, assists: recorded.assists || 0, appearances: recorded.appearances || 0 };
            });
            const statViews = {
                goals: { label: '得点', sort: (a, b) => b.goals - a.goals || b.assists - a.assists || b.appearances - a.appearances },
                assists: { label: 'アシスト', sort: (a, b) => b.assists - a.assists || b.goals - a.goals || b.appearances - a.appearances },
                appearances: { label: '出場', sort: (a, b) => b.appearances - a.appearances || b.goals - a.goals || b.assists - a.assists }
            };
            const activeStatView = statViews[statView] ? statView : 'goals';
            const playerRows = [...teamPlayers].sort(statViews[activeStatView].sort).slice(0, 3).map((player, index) => `<div class="ranking-row"><div class="ranking-position">${index + 1}</div><div class="ranking-main"><div class="ranking-name">${escapeHtml(player.name)}</div><div class="ranking-team">出場 ${player.appearances}試合 ・ 得点 ${player.goals} ・ アシスト ${player.assists}</div></div><div class="ranking-number">${activeStatView === 'goals' ? `${player.goals} 得点` : activeStatView === 'assists' ? `${player.assists} AS` : `${player.appearances} 試合`}</div></div>`).join('') || `<div class="empty-state">登録選手がいません</div>`;
            const recentMatches = state.schedule.filter(match => (match.h === name || match.a === name) && match.hs !== null && match.as !== null).sort((a, b) => b.mw - a.mw).slice(0, 3);
            const matchRows = recentMatches.map(match => {
                const isHome = match.h === name;
                const own = isHome ? match.hs : match.as;
                const other = isHome ? match.as : match.hs;
                const opponent = isHome ? match.a : match.h;
                const result = own > other ? 'WIN' : own < other ? 'LOSE' : 'DRAW';
                return `<div class="team-result-timeline"><div class="team-result-marker ${result.toLowerCase()}">${result}</div><div class="ranking-main"><div class="ranking-name">MATCHWEEK ${match.mw} vs ${escapeHtml(opponent)}</div><div class="ranking-team">${isHome ? 'ホーム' : 'アウェイ'}</div></div><div class="team-result-score">${own}-${other}</div></div>`;
            }).join('') || `<div class="empty-state">確定した試合結果はまだありません</div>`;
            const body = document.getElementById('sheet-body');
            body.innerHTML = `
                <div class="team-sheet-hero">
                    <img src="${raw.logo}" class="team-logo-lg" alt="${escapeHtml(raw.name)}">
                    <h3 style="font-family:'Teko'; line-height:1; margin-top:0.2rem;">${escapeHtml(raw.name)}</h3>
                </div>
                <div class="section-header" style="margin-top:0.7rem;"><div class="section-title">選手成績</div></div>
                <div class="market-note" style="margin-bottom:0.55rem;">各選手の出場試合数・得点・アシストを表示しています。</div>
                <div class="tab-bar" style="margin-bottom:0.55rem;"><button class="tab-button ${activeStatView === 'goals' ? 'active' : ''}" onclick="openTeamSheet('${name}', 'goals')">得点</button><button class="tab-button ${activeStatView === 'assists' ? 'active' : ''}" onclick="openTeamSheet('${name}', 'assists')">アシスト</button><button class="tab-button ${activeStatView === 'appearances' ? 'active' : ''}" onclick="openTeamSheet('${name}', 'appearances')">出場</button></div>
                <div class="card">${playerRows}</div>
                <div class="section-header" style="margin-top:1rem;"><div class="section-title">直近の試合結果</div></div>
                <div class="card">${matchRows}</div>
            `;
            document.getElementById('sheet-overlay').classList.add('active');
        };

        window.closeSheet = function(e) {
            if (e.target.id === 'sheet-overlay') document.getElementById('sheet-overlay').classList.remove('active');
        };

        window.dismissSheet = function() {
            document.getElementById('sheet-overlay').classList.remove('active');
        };

        // 即時UI初期化
        function initAppUI() {
            // 対応ブラウザでは縦向きを要求し、未対応環境ではCSSの案内画面で横向きを止める。
            screen.orientation?.lock?.('portrait').catch(() => {});
            document.querySelectorAll('main.container .page[id]').forEach(page => {
                page.hidden = !page.classList.contains('active');
            });
            window.lucide?.createIcons({ attrs: { 'stroke-width': 1.8 } });
            const filterBar = document.getElementById('matches-filter-bar');
            const latestResultMw = getLatestResultMatchweek();
            if (filterBar) {
                let html = '';
                for (let i = 1; i <= 18; i++) {
                    html += `<button class="chip ${i === latestResultMw ? 'active' : ''}" data-mw="${i}" onclick="filterMatches(${i}, this)">MW${i}</button>`;
                }
                filterBar.innerHTML = html;
            }
            state.currentFilterMw = latestResultMw;

            window.filterMatches = function(mwNum, el) {
                if (el && el.parentElement) {
                    el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                    el.classList.add('active');
                }
                renderMatches(mwNum);
                focusMatchweekChip(mwNum);
            };
            focusMatchweekChip(latestResultMw, 'auto');

            refreshAllViews();
            renderNews();
        }


        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initAppUI);
        } else {
            initAppUI();
        }
    </script>
<script src="./firebase-config.js"></script>
<script type="module" src="./firebase-sync.js?v=8"></script>
<script>
    if ('serviceWorker' in navigator) {
        let refreshingForUpdate = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (refreshingForUpdate) return;
            refreshingForUpdate = true;
            window.location.reload();
        });
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./service-worker.js?v=85', { updateViaCache: 'none' })
                .then(registration => registration.update())
                .catch(error => console.warn('Service Worker could not be updated', error));
        });
    }
</script>
</html>
