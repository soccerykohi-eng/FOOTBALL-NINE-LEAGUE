        };

        window.confirmPublishRegulationDraft = function() {
            const regulations = ensureRegulationState();
            const draft = regulations.draft;
            if (!draft) return;
            if (!confirm(`Version ${Number(regulations.current.version) + 1} として規約改正を公開しますか？`)) return;
            regulations.history.unshift(cloneRegulationData(regulations.current));
            regulations.current = {
                id: `regulation-${Date.now()}`,
                version: Number(regulations.current.version) + 1,
                effectiveDate: draft.effectiveDate,
                reason: draft.reason,
                publishedAt: new Date().toISOString(),
                chapters: cloneRegulationData(draft.chapters)
            };
            regulations.draft = null;
            addActivity('規約改正を公開', `Version ${regulations.current.version} ・ ${regulations.current.reason}`);
            document.getElementById('sheet-overlay').classList.remove('active');
            renderRules();
            persistAppState();
            const currentTab = document.querySelector('[data-rules-tab="current"]');
            switchRulesView('current', currentTab);
        };

        window.openRegulationVersion = function(id) {
            const regulations = ensureRegulationState();
            const version = [regulations.current, ...regulations.history].find(item => item.id === id);
            if (!version) return;
            document.getElementById('sheet-body').innerHTML = `
                <div style="text-align:center;margin-bottom:0.8rem;"><div class="hero-subtitle">Version ${Number(version.version) || 1}</div><h3>施行日 ${escapeHtml(version.effectiveDate || '未設定')}</h3><div class="rule-version-meta">${escapeHtml(version.reason || '')}</div></div>
                ${(version.chapters || []).map(chapter => `<div class="rule-chapter"><div class="rule-chapter-header" style="cursor:default;"><span>${escapeHtml(chapter.chapter)}</span></div><div class="rule-chapter-content active">${(chapter.articles || []).map(article => `<div class="rule-article-title">${escapeHtml(article.title)}</div><div>${article.text}</div>`).join('')}</div></div>`).join('')}`;
            document.getElementById('sheet-overlay').classList.add('active');
        };

        window.restoreRegulationVersion = function(id) {
            const regulations = ensureRegulationState();
            const version = regulations.history.find(item => item.id === id);
            if (!version || !confirm(`Version ${version.version} の内容を新しい下書きとして復元しますか？`)) return;
            regulations.draft = {
                chapters: cloneRegulationData(version.chapters),
                effectiveDate: regulationDateToday(),
                reason: `Version ${version.version} の内容を復元`
            };
            document.getElementById('sheet-overlay').classList.remove('active');
            renderRegulationManager();
            persistAppState();
            const manageTab = document.querySelector('[data-rules-tab="manage"]');
            switchRulesView('manage', manageTab);
        };

        window.toggleRuleChapter = function(idx, headerEl) {
            const content = document.getElementById(`rule-chapter-${idx}`);
            if (content) {
                const isActive = content.classList.contains('active');
                document.querySelectorAll('[id^="rule-chapter-"]').forEach(item => item.classList.remove('active'));
                document.querySelectorAll('.rule-chapter-header.open').forEach(item => item.classList.remove('open'));
                content.classList.toggle('active', !isActive);
                headerEl?.classList.toggle('open', !isActive);
            }
        };

        window.openStandingsTeamSheet = function(name) {
            const team = calculateStandings().find(item => item.name === name);
            if (!team) return;
            document.getElementById('sheet-body').innerHTML = `
                <div style="text-align:center;">
                    <img src="${team.logo}" class="team-logo-lg" style="width:64px;height:64px;" alt="${escapeHtml(team.name)}">
                    <h3 style="font-family:'Teko';font-size:1.8rem;line-height:1;margin-top:0.2rem;">${escapeHtml(team.name)}</h3>
                </div>
                <div class="dashboard-grid">
                    <div class="metric-card"><div class="metric-label">順位</div><div class="metric-value">${team.rank}位</div></div>
                    <div class="metric-card"><div class="metric-label">勝点</div><div class="metric-value">${team.pts}</div></div>
                    <div class="metric-card"><div class="metric-label">試合数</div><div class="metric-value">${team.p}</div></div>
                </div>
                <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:0.45rem;margin-bottom:0.55rem;">
                    <div class="metric-card"><div class="metric-label">勝</div><div class="metric-value" style="color:var(--accent-green);">${team.w}</div></div>
                    <div class="metric-card"><div class="metric-label">分</div><div class="metric-value">${team.d}</div></div>
                    <div class="metric-card"><div class="metric-label">負</div><div class="metric-value" style="color:var(--accent-red);">${team.l}</div></div>
                </div>
                <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:0.45rem;">
                    <div class="metric-card"><div class="metric-label">総得点</div><div class="metric-value">${team.gf}</div></div>
                    <div class="metric-card"><div class="metric-label">総失点</div><div class="metric-value">${team.ga}</div></div>
                    <div class="metric-card"><div class="metric-label">得失点差</div><div class="metric-value">${team.gd > 0 ? '+' + team.gd : team.gd}</div></div>
                </div>`;
            document.getElementById('sheet-overlay').classList.add('active');
        };

        window.openTeamSheet = function(name, statView = 'goals') {
            const raw = RAW_TEAMS.find(item => item.name === name);
            if (!raw) return;

            const teamPlayers = activeRosterPlayers(raw.id).map(player => {
                const recorded = calculatePlayerStats().find(stat => stat.team === name && stat.name === player.name) || {};
                return { name: player.name, goals: recorded.goals || 0, assists: recorded.assists || 0, appearances: recorded.appearances || 0 };
            });
            const statViews = {
                goals: { label: '得点', sort: (a, b) => b.goals - a.goals || b.assists - a.assists || b.appearances - a.appearances },
                assists: { label: 'アシスト', sort: (a, b) => b.assists - a.assists || b.goals - a.goals || b.appearances - a.appearances },
                appearances: { label: '出場', sort: (a, b) => b.appearances - a.appearances || b.goals - a.goals || b.assists - a.assists }
            };
            const activeStatView = statViews[statView] ? statView : 'goals';
            const playerRows = [...teamPlayers].sort(statViews[activeStatView].sort).slice(0, 3).map((player, index) => `<div class="ranking-row"><div class="ranking-position">${index + 1}</div><div class="ranking-main"><div class="ranking-name">${escapeHtml(player.name)}</div><div class="ranking-team">出場 ${player.appearances}試合 ・ 得点 ${player.goals} ・ アシスト ${player.assists}</div></div><div class="ranking-number">${activeStatView === 'goals' ? `${player.goals} 得点` : activeStatView === 'assists' ? `${player.assists} AS` : `${player.appearances} 試合`}</div></div>`).join('') || `<div class="empty-state">登録選手がいません</div>`;
            const recentMatches = state.schedule.filter(match => (match.h === name || match.a === name) && match.hs !== null && match.as !== null).sort((a, b) => b.mw - a.mw).slice(0, 3);
            const matchRows = recentMatches.map(match => {
                const isHome = match.h === name;
                const own = isHome ? match.hs : match.as;
                const other = isHome ? match.as : match.hs;
                const opponent = isHome ? match.a : match.h;
                const result = own > other ? 'WIN' : own < other ? 'LOSE' : 'DRAW';
                return `<div class="team-result-timeline"><div class="team-result-marker ${result.toLowerCase()}">${result}</div><div class="ranking-main"><div class="ranking-name">MATCHWEEK ${match.mw} vs ${escapeHtml(opponent)}</div><div class="ranking-team">${isHome ? 'ホーム' : 'アウェイ'}</div></div><div class="team-result-score">${own}-${other}</div></div>`;
            }).join('') || `<div class="empty-state">確定した試合結果はまだありません</div>`;
            const body = document.getElementById('sheet-body');
            body.innerHTML = `
                <div class="team-sheet-hero">
                    <img src="${raw.logo}" class="team-logo-lg" alt="${escapeHtml(raw.name)}">
                    <h3 style="font-family:'Teko'; line-height:1; margin-top:0.2rem;">${escapeHtml(raw.name)}</h3>
                </div>
                <div class="section-header" style="margin-top:0.7rem;"><div class="section-title">選手成績</div></div>
                <div class="market-note" style="margin-bottom:0.55rem;">各選手の出場試合数・得点・アシストを表示しています。</div>
                <div class="tab-bar" style="margin-bottom:0.55rem;"><button class="tab-button ${activeStatView === 'goals' ? 'active' : ''}" onclick="openTeamSheet('${name}', 'goals')">得点</button><button class="tab-button ${activeStatView === 'assists' ? 'active' : ''}" onclick="openTeamSheet('${name}', 'assists')">アシスト</button><button class="tab-button ${activeStatView === 'appearances' ? 'active' : ''}" onclick="openTeamSheet('${name}', 'appearances')">出場</button></div>
                <div class="card">${playerRows}</div>
                <div class="section-header" style="margin-top:1rem;"><div class="section-title">直近の試合結果</div></div>
                <div class="card">${matchRows}</div>
            `;
            document.getElementById('sheet-overlay').classList.add('active');
        };

        window.closeSheet = function(e) {
            if (e.target.id === 'sheet-overlay') document.getElementById('sheet-overlay').classList.remove('active');
        };

        window.dismissSheet = function() {
            document.getElementById('sheet-overlay').classList.remove('active');
        };

        // 即時UI初期化
        function initAppUI() {
            // 対応ブラウザでは縦向きを要求し、未対応環境ではCSSの案内画面で横向きを止める。
            screen.orientation?.lock?.('portrait').catch(() => {});
            document.querySelectorAll('main.container .page[id]').forEach(page => {
                page.hidden = !page.classList.contains('active');
            });
            window.lucide?.createIcons({ attrs: { 'stroke-width': 1.8 } });
            const filterBar = document.getElementById('matches-filter-bar');
            const latestResultMw = getLatestResultMatchweek();
            if (filterBar) {
                let html = '';
                for (let i = 1; i <= 18; i++) {
                    html += `<button class="chip ${i === latestResultMw ? 'active' : ''}" data-mw="${i}" onclick="filterMatches(${i}, this)">MW${i}</button>`;
                }
                filterBar.innerHTML = html;
            }
            state.currentFilterMw = latestResultMw;

            window.filterMatches = function(mwNum, el) {
                if (el && el.parentElement) {
                    el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                    el.classList.add('active');
                }
                renderMatches(mwNum);
                focusMatchweekChip(mwNum);
            };
            focusMatchweekChip(latestResultMw, 'auto');

            applyEditMode();
            refreshAllViews();
            renderNews();
        }


        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initAppUI);
        } else {
            initAppUI();
        }
    </script>
<script src="./firebase-config.js"></script>
<script type="module" src="./firebase-sync.js?v=7"></script>
<script>
    if ('serviceWorker' in navigator) {
        let refreshingForUpdate = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (refreshingForUpdate) return;
            refreshingForUpdate = true;
            window.location.reload();
        });
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./service-worker.js?v=2', { updateViaCache: 'none' })
                .then(registration => registration.update())
                .catch(error => console.warn('Service Worker could not be updated', error));
        });
    }
</script>
</html>
