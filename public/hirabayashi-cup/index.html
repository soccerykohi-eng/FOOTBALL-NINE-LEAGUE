                        <div class="form-group news-composer-field"><label class="form-label">タイトル</label><input type="text" id="post-title" class="form-input" placeholder="例：MATCHWEEK 3 の試合結果を公開" maxlength="60" autocomplete="off"></div>
                        <div class="form-group news-composer-field"><label class="form-label">本文</label><textarea id="post-content" class="form-textarea" placeholder="ニュースの詳細を入力してください"></textarea></div>
                    </div>
                </div>
                <div class="news-composer-publish-note">公開するとホームとニュース一覧に表示され、通知を受け取る設定の利用者へもお知らせされます。</div>
                <button class="btn-primary news-composer-submit" onclick="submitNewsPostToCloud()">ニュースを公開</button>
            `;
            document.getElementById('sheet-overlay').classList.add('active');
        };

        window.submitNewsPostToCloud = function() {
            const category = document.getElementById('post-category').value;
            const date = document.getElementById('post-date').value.trim();
            const title = document.getElementById('post-title').value.trim();
            const content = document.getElementById('post-content').value.trim();
            const sourceValue = document.getElementById('post-source')?.value || 'official';
            if (!title || !content) return;

            const sourceTeamId = sourceValue.startsWith('team:') ? sourceValue.slice(5) : '';
            const sourceTeam = RAW_TEAMS.find(team => team.id === sourceTeamId);

            const newsId = 'n_' + Date.now();
            state.news.unshift({
                id: newsId, date: date || new Date().toISOString().split('T')[0].replace(/-/g, '.'),
                category, title, content,
                sourceType: sourceTeam ? 'team' : 'official',
                sourceTeamId: sourceTeam?.id || '',
                sourceName: sourceTeam?.name || 'FNL運営'
            });
            currentNewsPage = 1;
            renderNews();
            Promise.resolve(persistAppState())
                .then(() => window.notifyNewsPublished?.(newsId))
                .catch(error => console.error('News publish sync failed', error));
            document.getElementById('sheet-overlay').classList.remove('active');
            navigateTo('news', 'ニュース');
        };

        // --- 試合センター ---
        function ensureMatchDetails(match) {
            if (!match.details || typeof match.details !== 'object') match.details = {};
            if (!Array.isArray(match.details.events)) match.details.events = [];
            return match.details;
        }

        function clearMatchDetails(match) {
            match.details = { events: [], motm: null, appearances: { home: [], away: [] } };
        }

        function getRecordedGoalTotals(match, events = ensureMatchDetails(match).events) {
            return events.reduce((totals, event) => {
                if (event.type !== 'goal') return totals;
                if (event.team === match.h) totals.home += 1;
                if (event.team === match.a) totals.away += 1;
                return totals;
            }, { home: 0, away: 0 });
        }

        function cloneMatch(match) {
            return JSON.parse(JSON.stringify(match));
        }

        function takeMatchSnapshot(match, label) {
            state.lastMatchSnapshot = { matchId: match.id, label, match: cloneMatch(match), createdAt: new Date().toISOString() };
        }

        function addActivity(title, detail, change = {}) {
            if (!Array.isArray(state.activityLog)) state.activityLog = [];
            state.activityLog.unshift({ id: `a_${Date.now()}_${Math.random().toString(16).slice(2)}`, title, detail, actor: 'この端末', before: change.before ?? null, after: change.after ?? null, createdAt: new Date().toISOString() });
            state.activityLog = state.activityLog.slice(0, 100);
        }

        function getRosterNamesByTeamName(teamName) {
            const team = RAW_TEAMS.find(item => item.name === teamName);
            if (!team || !Array.isArray(state.rosters[team.id])) return [];
            return state.rosters[team.id]
                .filter(player => player.status !== 'released' && player.status !== 'transferred' && player.name)
                .map(player => player.name);
        }

        function getAppearancePickerNames(teamName) {
            const appearancesByName = new Map(
                calculatePlayerStats()
                    .filter(player => player.team === teamName)
                    .map(player => [player.name, player.appearances])
            );
            return getRosterNamesByTeamName(teamName).sort((left, right) =>
                (appearancesByName.get(right) || 0) - (appearancesByName.get(left) || 0)
                || left.localeCompare(right, 'ja')
            );
        }

        function renderAppearancePicker(teamName, side, selectedNames = [], changeHandler = '') {
            const players = getAppearancePickerNames(teamName);
            if (!players.length) return `<div class="empty-state">先に「移籍」ページで選手を登録してください</div>`;
            return `<div class="appearance-picker">${players.map(name => `<label class="appearance-option"><input type="checkbox" data-record-input data-appearance="${side}" value="${escapeHtml(name)}" ${selectedNames.includes(name) ? 'checked' : ''} ${changeHandler ? `onchange="${changeHandler}"` : ''}><span>${escapeHtml(name)}</span></label>`).join('')}</div>`;
        }

        function matchEventPlayerOptions(teamName, placeholder = '選手を選択', selectedName = '', allowedNames = null) {
            const players = Array.isArray(allowedNames) ? allowedNames : getRosterNamesByTeamName(teamName);
            if (selectedName && !players.includes(selectedName)) players.unshift(selectedName);
            return `<option value="">${placeholder}</option>${players.map(name => `<option value="${escapeHtml(name)}" ${name === selectedName ? 'selected' : ''}>${escapeHtml(name)}</option>`).join('')}`;
        }

        const OWN_GOAL_VALUE = '__own_goal__';

        function goalScorerOptions(teamName, allowedNames = null, selectedName = '') {
            const players = Array.isArray(allowedNames) ? allowedNames : getRosterNamesByTeamName(teamName);
            if (selectedName && selectedName !== OWN_GOAL_VALUE && !players.includes(selectedName)) players.unshift(selectedName);
            return `<option value="">得点者を選択</option><option value="${OWN_GOAL_VALUE}" ${selectedName === OWN_GOAL_VALUE ? 'selected' : ''}>オウンゴール</option>${players.map(name => `<option value="${escapeHtml(name)}" ${name === selectedName ? 'selected' : ''}>${escapeHtml(name)}</option>`).join('')}`;
        }

        function isOwnGoalEvent(event) {
            return event?.ownGoal === true || event?.player === 'オウンゴール';
        }

        window.updateGoalAssistAvailability = function(playerSelectId, assistSelectId) {
            const playerSelect = document.getElementById(playerSelectId);
            const assistSelect = document.getElementById(assistSelectId);
            if (!playerSelect || !assistSelect) return;
            const ownGoal = playerSelect.value === OWN_GOAL_VALUE;
            if (ownGoal) assistSelect.value = '';
            assistSelect.disabled = ownGoal;
        };

        const leagueMatchDrafts = new Map();

        function createLeagueMatchDraft(match) {
            const details = ensureMatchDetails(match);
            return { hs: match.hs ?? '', as: match.as ?? '', motmTeam: details.motm?.team === match.a ? match.a : match.h, motm: details.motm?.name || '', appearances: { home: [...(details.appearances?.home || [])], away: [...(details.appearances?.away || [])] }, events: JSON.parse(JSON.stringify(details.events || [])), goalTeam: match.h };
        }

        function captureLeagueMatchDraft(match) {
            const existing = leagueMatchDrafts.get(match.id) || createLeagueMatchDraft(match);
            if (!document.getElementById('input-hs')) return existing;
            const selected = side => [...document.querySelectorAll(`[data-appearance="league-${side}"]:checked`)].map(input => input.value);
            const draft = { ...existing, hs: document.getElementById('input-hs')?.value ?? existing.hs, as: document.getElementById('input-as')?.value ?? existing.as, motmTeam: document.getElementById('input-motm-team')?.value || existing.motmTeam, motm: document.getElementById('input-motm')?.value || '', appearances: { home: selected('home'), away: selected('away') }, goalTeam: document.getElementById('league-goal-team')?.value || existing.goalTeam };
            leagueMatchDrafts.set(match.id, draft);
            return draft;
        }

        function allowedMatchPlayers(match, teamName, draft) {
            return teamName === match.h ? draft.appearances.home : draft.appearances.away;
        }

        function renderLeagueMatchCenter(match) {
            const draft = leagueMatchDrafts.get(match.id) || createLeagueMatchDraft(match);
            leagueMatchDrafts.set(match.id, draft);
            const goalEvents = draft.events.filter(event => event.type === 'goal');
            const goalTeam = draft.goalTeam === match.a ? match.a : match.h;
            const goalPlayers = allowedMatchPlayers(match, goalTeam, draft);
            const motmPlayers = allowedMatchPlayers(match, draft.motmTeam, draft);
            const viewing = !isEditMode();
            document.getElementById('sheet-body').innerHTML = `
                <div class="match-center-header"><div class="match-center-kicker">MATCHWEEK ${match.mw}</div><h3 class="match-center-title">マッチセンター</h3><div class="match-center-subtitle">公式試合記録</div></div>
                ${viewing ? '<div class="view-mode-note">現在は閲覧モードです。記録を変更する場合は画面上部の「編集」を押してください。</div>' : ''}
                <section class="match-step" data-step="1"><div class="match-step-title">スコア</div><div class="match-center-scoreboard"><div class="match-center-team"><img src="${getTeamLogo(match.h)}" alt=""><div class="match-center-team-name">${escapeHtml(match.h)}</div><input data-record-input type="number" id="input-hs" aria-label="${escapeHtml(match.h)}の得点" class="form-input match-center-score-input" inputmode="numeric" min="0" max="20" value="${draft.hs}" placeholder="0"></div><div class="match-center-versus">VS</div><div class="match-center-team"><img src="${getTeamLogo(match.a)}" alt=""><div class="match-center-team-name">${escapeHtml(match.a)}</div><input data-record-input type="number" id="input-as" aria-label="${escapeHtml(match.a)}の得点" class="form-input match-center-score-input" inputmode="numeric" min="0" max="20" value="${draft.as}" placeholder="0"></div></div></section>
                <section class="match-step" data-step="2"><div class="match-step-title">出場選手・MOM</div><div class="match-center-lineup-grid"><div class="match-center-lineup"><div class="match-center-lineup-name"><img src="${getTeamLogo(match.h)}" alt="">${escapeHtml(match.h)}</div>${renderAppearancePicker(match.h, 'league-home', draft.appearances.home, `refreshLeagueParticipantOptions('${match.id}')`)}</div><div class="match-center-lineup"><div class="match-center-lineup-name"><img src="${getTeamLogo(match.a)}" alt="">${escapeHtml(match.a)}</div>${renderAppearancePicker(match.a, 'league-away', draft.appearances.away, `refreshLeagueParticipantOptions('${match.id}')`)}</div></div><span class="match-center-core-label" style="margin-top:.8rem">MOM</span><div class="match-center-mom"><select data-record-input id="input-motm-team" class="form-select" onchange="refreshLeagueParticipantOptions('${match.id}')"><option value="${escapeHtml(match.h)}" ${draft.motmTeam === match.h ? 'selected' : ''}>${escapeHtml(match.h)}</option><option value="${escapeHtml(match.a)}" ${draft.motmTeam === match.a ? 'selected' : ''}>${escapeHtml(match.a)}</option></select><select data-record-input id="input-motm" class="form-select">${matchEventPlayerOptions(draft.motmTeam, 'MOMを選択', draft.motm, motmPlayers)}</select></div></section>
                <section class="match-step" data-step="3"><div class="match-step-title">得点記録</div><div class="event-entry-card edit-only"><div class="form-group"><label class="form-label">得点したチーム</label><select data-record-input id="league-goal-team" class="form-select" onchange="updateLeagueGoalOptions('${match.id}')"><option value="${escapeHtml(match.h)}" ${goalTeam === match.h ? 'selected' : ''}>${escapeHtml(match.h)}</option><option value="${escapeHtml(match.a)}" ${goalTeam === match.a ? 'selected' : ''}>${escapeHtml(match.a)}</option></select></div><div class="form-group"><label class="form-label">得点者</label><select data-record-input id="league-goal-player" class="form-select" onchange="updateGoalAssistAvailability('league-goal-player','league-goal-assist')">${goalScorerOptions(goalTeam, goalPlayers)}</select></div><div class="form-group"><label class="form-label">アシスト</label><select data-record-input id="league-goal-assist" class="form-select">${matchEventPlayerOptions(goalTeam, 'アシストなし', '', goalPlayers)}</select></div></div><button class="btn-secondary edit-only" style="width:100%;" onclick="addLeagueGoal('${match.id}')">得点を追加</button><div class="match-center-events">${goalEvents.length ? goalEvents.map(event => `<div class="event-row"><div class="ranking-main"><div class="match-event-type">${isOwnGoalEvent(event) ? 'OWN GOAL' : 'GOAL'}</div><div class="ranking-name">${escapeHtml(event.player)}</div><div class="ranking-team">${escapeHtml(event.team)}${event.assist ? ` ・ AS ${escapeHtml(event.assist)}` : ''}</div></div><button class="btn-secondary edit-only" onclick="deleteMatchEvent('${match.id}','${event.id}')">削除</button></div>`).join('') : '<div class="empty-state">得点記録はありません</div>'}</div></section>
                <div class="match-center-save-bar edit-only"><button class="btn-primary match-center-save" onclick="saveScoreToCloud('${match.id}')">内容を確認</button></div>

        function resolvePlayerTeam(match, playerName, fallback = '') {
            if (!playerName) return fallback;
            if (getRosterNamesByTeamName(match.h).includes(playerName)) return match.h;
            if (getRosterNamesByTeamName(match.a).includes(playerName)) return match.a;
            return fallback;
        }

        function calculatePlayerStats() {
            const map = new Map();
            const get = (name, team = '') => {
                const safeName = String(name || '').trim();
                if (!safeName) return null;
                const key = `${team}|${safeName}`;
                if (!map.has(key)) map.set(key, { name: safeName, team, appearances: 0, goals: 0, assists: 0, motm: 0, yellow: 0, red: 0 });
                return map.get(key);
            };
            state.schedule.forEach(match => {
                if (match.hs === null || match.as === null) return;
                const details = ensureMatchDetails(match);
                (details.appearances?.home || []).forEach(name => { const stat = get(name, match.h); if (stat) stat.appearances += 1; });
                (details.appearances?.away || []).forEach(name => { const stat = get(name, match.a); if (stat) stat.appearances += 1; });
                details.events.forEach(event => {
                    if (event.type === 'goal' && isOwnGoalEvent(event)) return;
                    const stat = get(event.player, event.team || '');
                    if (!stat) return;
                    if (event.type === 'goal') stat.goals += 1;
                    if (event.type === 'yellow') stat.yellow += 1;
                    if (event.type === 'red') stat.red += 1;
                    if (event.type === 'goal' && event.assist) {
                        const assist = get(event.assist, event.team || '');
                        if (assist) assist.assists += 1;
                    }
                });
                if (details.motm?.name) {
                    const team = details.motm.team || resolvePlayerTeam(match, details.motm.name);
                    const motm = get(details.motm.name, team);
                    if (motm) motm.motm += 1;
                }
            });
            return [...map.values()];
        }

        function renderRankingRows(players, valueRenderer, limit = 5) {
            if (!players.length) return `<div class="empty-state">試合センターで選手記録を入力すると表示されます</div>`;
            return players.slice(0, limit).map((player, index) => `
                <div class="ranking-row">
                    <div class="ranking-position">${index + 1}</div>
                    <div class="ranking-main"><div class="ranking-name">${escapeHtml(player.name)}</div><div class="ranking-team">${escapeHtml(player.team || '所属未設定')} ・ 出場 ${player.appearances}</div></div>
                    <div class="ranking-number">${valueRenderer(player)}</div>
                </div>`).join('');
        }

        function getPlayerRanking(type) {
            const stats = calculatePlayerStats();
            const rankings = {
                goals: {
                    title: '得点ランキング',
                    players: [...stats].filter(player => player.goals > 0).sort((a,b) => b.goals - a.goals || b.assists - a.assists),
                    valueRenderer: player => `${player.goals}`
                },
                assists: {
                    title: 'アシストランキング',
                    players: [...stats].filter(player => player.assists > 0).sort((a,b) => b.assists - a.assists || b.goals - a.goals),
                    valueRenderer: player => `${player.assists}`
                },
                mom: {
                    title: 'MOMランキング',
                    players: [...stats].filter(player => player.motm > 0).sort((a,b) => b.motm - a.motm || b.appearances - a.appearances),
                    valueRenderer: player => `${player.motm}`
                }
            };
            return rankings[type];
        }

        window.restoreCloudRecoverySnapshot = function(index) {
            if (!requireEditMode('バックアップの復元')) return;
            const snapshot = getRecoverySnapshots()[index];
            if (!snapshot?.payload) return alert('バックアップを読み込めませんでした。');
            const currentCompleted = countCompletedMatches(state), backupCompleted = countCompletedMatches(snapshot.payload);
            if (backupCompleted < currentCompleted) return alert('現在より試合結果が少ないバックアップは、安全のため復元できません。');
            if (!confirm(`${formatAppDate(snapshot.savedAt)} の状態を復元します。\n試合結果 ${backupCompleted}件 / Season ${Number(snapshot.payload.seasonInfo?.number || 1)}\nよろしいですか？`)) return;
            const fields = ['schedule','news','rosters','transferMarket','activityLog','seasonArchive','seasonInfo','regulations','hirabayashiCup','previousSeasonSnapshot','lastMatchSnapshot'];
            const before = Object.fromEntries(fields.map(field => [field, JSON.parse(JSON.stringify(state[field] ?? null))]));
            fields.forEach(field => { if (Object.prototype.hasOwnProperty.call(snapshot.payload, field)) state[field] = JSON.parse(JSON.stringify(snapshot.payload[field])); });
            addActivity('バックアップを復元', `${formatAppDate(snapshot.savedAt)} の状態`, { before: `試合結果 ${currentCompleted}件`, after: `試合結果 ${backupCompleted}件` });
            state.standingsDirty = true;
            refreshAllViews();
            Promise.resolve(persistAppState()).then(() => { alert('バックアップを復元しました。'); renderAppHistory(); }).catch(error => { fields.forEach(field => { state[field] = before[field]; }); state.standingsDirty = true; saveStateToStorage(); refreshAllViews(); alert(error?.message || '復元に失敗したため、元の状態に戻しました。'); });
        };

                : `<div class="empty-state">保存されたシーズン記録はありません</div>`;
            const info = state.seasonInfo || { number: 1, year: 2026 };
            const label = document.getElementById('current-season-label');
            const button = document.getElementById('archive-season-button');
            if (label) label.textContent = `SEASON ${info.number} - ${info.year}`;
            if (button) button.textContent = `Season ${info.number} の記録を保存`;

        // --- 選手名簿・移籍市場 ---
        const cloneTransferData = value => JSON.parse(JSON.stringify(value));

        function getMarket() {
            if (!state.transferMarket || typeof state.transferMarket !== 'object') state.transferMarket = {};
            const market = state.transferMarket;
            if (!market.releasePlans || typeof market.releasePlans !== 'object') market.releasePlans = {};
            if (!market.releasePlayerIds || typeof market.releasePlayerIds !== 'object') market.releasePlayerIds = {};
            if (!market.freeAgents || !Array.isArray(market.freeAgents)) market.freeAgents = [];
            if (!market.draftPreferences || typeof market.draftPreferences !== 'object') market.draftPreferences = {};
            if (!market.draftResults || !Array.isArray(market.draftResults)) market.draftResults = [];
            if (!market.history || !Array.isArray(market.history)) market.history = [];
            if (!market.tradeListings || !Array.isArray(market.tradeListings)) market.tradeListings = [];
            if (!market.tradeOffers || !Array.isArray(market.tradeOffers)) market.tradeOffers = [];
            if (!market.protections || typeof market.protections !== 'object') market.protections = {};
            if (!market.protectionBonus || typeof market.protectionBonus !== 'object') market.protectionBonus = {};
            if (!market.endDraft || typeof market.endDraft !== 'object') market.endDraft = {};
            if (!market.endDraft.phase) market.endDraft.phase = 'protection';
            if (!market.endDraft.roundOnePicks || typeof market.endDraft.roundOnePicks !== 'object') market.endDraft.roundOnePicks = {};
            if (!Array.isArray(market.endDraft.roundOneResults)) market.endDraft.roundOneResults = [];
            if (!Array.isArray(market.endDraft.waiverResults)) market.endDraft.waiverResults = [];
            if (!Number.isFinite(Number(market.endDraft.waiverRound))) market.endDraft.waiverRound = 2;
            if (!Number.isFinite(Number(market.endDraft.waiverTurnIndex))) market.endDraft.waiverTurnIndex = 0;
            if (!market.periodMilestones || typeof market.periodMilestones !== 'object') market.periodMilestones = {};
            if (!market.schemaVersion) market.schemaVersion = 2;
            if (!market.midseason || typeof market.midseason !== 'object') market.midseason = {};
            if (!market.midseason.phase) market.midseason.phase = 'release';
            if (!market.midseason.legacyImported && (Object.keys(market.releasePlans).length || market.draftResults.length)) {
                RAW_TEAMS.forEach(team => {
                    if (Object.prototype.hasOwnProperty.call(market.releasePlans, team.id) && !market.midseason.releaseConfirmed?.[team.id]) {
                        (market.midseason.releaseConfirmed ||= {})[team.id] = { confirmedAt: '', count: Number(market.releasePlans[team.id] || 0), legacy: true };
                    }
                    if ((market.draftPreferences[team.id] || []).length && !market.midseason.submissionConfirmed?.[team.id]) {
                        (market.midseason.submissionConfirmed ||= {})[team.id] = { submittedAt: '', legacy: true };
                    }
                });
                if (market.draftResults.length) { market.midseason.draftConfirmed = true; market.midseason.phase = 'completed'; }
                market.midseason.legacyImported = true;
            }
            if (!market.midseason.releaseConfirmed || typeof market.midseason.releaseConfirmed !== 'object') market.midseason.releaseConfirmed = {};
            if (!market.midseason.submissionConfirmed || typeof market.midseason.submissionConfirmed !== 'object') market.midseason.submissionConfirmed = {};
            if (!Array.isArray(market.midseason.draftOrderSnapshot)) market.midseason.draftOrderSnapshot = [];
            if (typeof market.midseason.tradesClosed !== 'boolean') market.midseason.tradesClosed = false;
            if (typeof market.midseason.draftConfirmed !== 'boolean') market.midseason.draftConfirmed = false;
            if (!market.endDraft.protectionConfirmed || typeof market.endDraft.protectionConfirmed !== 'object') market.endDraft.protectionConfirmed = {};
            if (!Array.isArray(market.endDraft.draftOrderSnapshot)) market.endDraft.draftOrderSnapshot = [];
            if (!Array.isArray(market.auditLog)) market.auditLog = [];
            return market;
        }

        function normalizePlayerIdentity(name = '') {
            return String(name).normalize('NFKC').trim().toLocaleLowerCase('ja-JP').replace(/[\s　._・-]+/g, '');
        }

        function activePlayersFromRoster(roster = []) {
            return roster.filter(player => player && player.status !== 'released' && player.status !== 'transferred');
        }

        function findPlayerOwnership(name, rosters = state.rosters, exceptTeamId = '') {
            const identity = normalizePlayerIdentity(name);
            if (!identity) return null;
            for (const team of RAW_TEAMS) {
                if (team.id === exceptTeamId) continue;
                const player = activePlayersFromRoster(Array.isArray(rosters?.[team.id]) ? rosters[team.id] : [])
                    .find(item => normalizePlayerIdentity(item.name) === identity);
                if (player) return { team, player };
            }
            return null;
        }

        function findOtherPlayerOwnership(name, allowedOwnership = null, rosters = state.rosters) {
            const identity = normalizePlayerIdentity(name);
            if (!identity) return null;
            for (const team of RAW_TEAMS) {
                const players = activePlayersFromRoster(Array.isArray(rosters?.[team.id]) ? rosters[team.id] : []);
                const player = players.find(item => normalizePlayerIdentity(item.name) === identity && !(allowedOwnership && team.id === allowedOwnership.teamId && item.id === allowedOwnership.playerId));
                if (player) return { team, player };
            }
            return null;
        }

        function validateRoster(teamId, proposedRoster, options = {}) {
            const active = activePlayersFromRoster(Array.isArray(proposedRoster) ? proposedRoster : []);
            const counts = {
                total: active.length,
                special: active.filter(player => player.cardType === 'special').length,
                normal: active.filter(player => player.cardType === 'normal').length
            };
            const errors = [];
            if (counts.total > 25) errors.push('登録上限25名を超えています');
            if (counts.special > 18) errors.push('特別カードは18名までです');
            if (!options.allowIncompleteBuild && counts.normal < 7) errors.push('ノーマルカードが7名未満になります');
            const ownSeen = new Set();
            active.forEach(player => {
                const key = normalizePlayerIdentity(player.name);
                if (key && ownSeen.has(key)) errors.push(`${player.name} が同じクラブ内で重複しています`);
                ownSeen.add(key);
            });
            return { valid: errors.length === 0, errors, counts, teamId };
        }

        function inspectRosterIntegrity(rosters = state.rosters) {
            const issues = [];
            const owners = new Map();
            RAW_TEAMS.forEach(team => {
                const roster = Array.isArray(rosters?.[team.id]) ? rosters[team.id] : [];
                const result = validateRoster(team.id, roster);
                result.errors.forEach(message => issues.push({ type: 'roster', teamId: team.id, message: `${team.name}：${message}` }));
                activePlayersFromRoster(roster).forEach(player => {
                    const key = normalizePlayerIdentity(player.name);
                    if (!key) return;
                    if (!owners.has(key)) owners.set(key, []);
                    owners.get(key).push({ team, player });
                });
            });
            owners.forEach(entries => {
                if (entries.length > 1) issues.push({ type: 'duplicate', message: `${entries[0].player.name} が ${entries.map(entry => entry.team.name).join('、')} に重複登録されています` });
            });
            return { valid: issues.length === 0, issues };
        }

        function rosterIntegritySeverity(rosters = state.rosters) {
            let score = 0;
            const owners = new Map();
            RAW_TEAMS.forEach(team => {
                const active = activePlayersFromRoster(Array.isArray(rosters?.[team.id]) ? rosters[team.id] : []);
                const special = active.filter(player => player.cardType === 'special').length;
                const normal = active.filter(player => player.cardType === 'normal').length;
                score += Math.max(0, active.length - 25) + Math.max(0, special - 18) + Math.max(0, 7 - normal);
                active.forEach(player => {
                    const key = normalizePlayerIdentity(player.name);
                    if (key) owners.set(key, (owners.get(key) || 0) + 1);
                });
            });
            owners.forEach(count => { if (count > 1) score += (count - 1) * 10; });
            return score;
        }

        function addTransferAudit(actionType, detail = {}) {
            const market = getMarket();
            market.auditLog.unshift({
                id: `audit_${Date.now()}_${Math.random().toString(16).slice(2)}`,
                timestamp: new Date().toISOString(),
                season: Number(state.seasonInfo?.number || 1),
                marketType: getAutomaticTransferPeriod().key,
                actionType,
                operator: 'shared-user',
                player: '',
                fromTeam: '',
                toTeam: '',
                beforeState: null,
                afterState: null,
                reason: '',
                ...cloneTransferData(detail)
            });
            market.auditLog = market.auditLog.slice(0, 300);
        }

        window.validateFnlPayload = function(payload, changedFields = [], currentPayload = null) {
            const errors = [];
            const integrity = inspectRosterIntegrity(payload?.rosters || state.rosters);
            if (changedFields.includes('rosters') && !integrity.valid) {
                const currentMessages = new Set(inspectRosterIntegrity(currentPayload?.rosters || {}).issues.map(issue => issue.message));
                errors.push(...integrity.issues.map(issue => issue.message).filter(message => !currentMessages.has(message)));
            }
            if (changedFields.includes('schedule') && Array.isArray(currentPayload?.schedule) && Array.isArray(payload?.schedule)) {
                const currentSeason = Number(currentPayload?.seasonInfo?.number || 1);
                const nextSeason = Number(payload?.seasonInfo?.number || 1);
                if (currentSeason === nextSeason) {
                    const nextById = new Map(payload.schedule.map(match => [match?.id, match]));
                    const lostResults = currentPayload.schedule.filter(match => {
                        const next = nextById.get(match?.id);
                        return isMatchCompleted(match) && (!next || !isMatchCompleted(next));
                    });
                    if (payload.schedule.length !== currentPayload.schedule.length) {
                        errors.push('同一シーズンの日程数が変更されたため、保存を中止しました。');
                    }
                    if (lostResults.length > 1) {
                        errors.push(`確定済みの試合結果が${lostResults.length}試合まとめて消える変更を検出したため、保存を中止しました。`);
                    }
                }
            }
            return { valid: errors.length === 0, errors };
        };

        function isMatchCompleted(match) {
            return match.hs !== null && match.as !== null && !isNaN(match.hs) && !isNaN(match.as);
        }

        function getAutomaticTransferPeriod() {
            const market = getMarket();
            const seasonKey = `${state.seasonInfo?.number || 1}-${state.seasonInfo?.year || ''}`;
            if (market.periodMilestones.seasonKey !== seasonKey) {
                market.periodMilestones = { seasonKey };
            }
            const milestones = market.periodMilestones;
            const now = new Date().toISOString();
            const played = state.schedule.filter(isMatchCompleted);
            const firstHalfMatches = state.schedule.filter(match => Number(match.mw) <= 9);
            const firstHalfComplete = firstHalfMatches.length > 0 && firstHalfMatches.every(isMatchCompleted);
            const secondHalfStarted = state.schedule.some(match => Number(match.mw) >= 10 && isMatchCompleted(match));
            const seasonComplete = state.schedule.length > 0 && state.schedule.every(isMatchCompleted);

            if (firstHalfComplete && !milestones.midseasonOpenedAt && !milestones.midseasonClosedAt) milestones.midseasonOpenedAt = now;
            if (secondHalfStarted && !milestones.midseasonClosedAt) milestones.midseasonClosedAt = now;
            if (seasonComplete && !milestones.endseasonOpenedAt) milestones.endseasonOpenedAt = now;

            if (milestones.endseasonOpenedAt) {
                return { key: 'endseason', label: 'シーズン終了移籍市場', description: '全試合が終了しました。プロテクト登録とシーズン終了ドラフトを利用できます。' };
            }
            if (milestones.midseasonClosedAt) {
                return { key: 'second_half', label: 'リーグ後半戦', description: 'MW10が始まったため、中間移籍市場は終了しています。移籍機能は閲覧のみです。' };
            }
            if (milestones.midseasonOpenedAt) {
                return { key: 'midseason', label: 'シーズン中間移籍市場', description: 'MW9までの試合が終了しました。放出・中間ドラフト・トレードを利用できます。' };
            }
            if (!played.length) {
                return { key: 'preseason', label: 'シーズン準備期間', description: 'まだ試合が始まっていません。各チームの選手名簿を登録・修正できます。' };
            }
            return { key: 'first_half', label: 'リーグ前半戦', description: 'MW9終了までは移籍機能を利用できません。選手名簿と移籍情報は閲覧できます。' };
        }

        function requireTransferPeriod(requiredPeriod, actionLabel = 'この操作') {
            const current = getAutomaticTransferPeriod();
            if (current.key === requiredPeriod) return true;
            const requiredLabels = { preseason: 'シーズン準備期間', midseason: 'シーズン中間移籍市場', endseason: 'シーズン終了移籍市場' };
            alert(`${actionLabel}は「${requiredLabels[requiredPeriod] || requiredPeriod}」のみ利用できます。\n現在は「${current.label}」です。`);
            return false;
        }

        function requireOpenTransferWindow(actionLabel = 'この操作') {
            const current = getAutomaticTransferPeriod();
            if (['preseason', 'midseason', 'endseason'].includes(current.key)) return true;
            alert(`${actionLabel}は移籍市場が開いている期間のみ利用できます。\n現在は「${current.label}」です。`);
            return false;
        }

        function getFirstHalfProgress() {
            const matches = state.schedule.filter(match => Number(match.mw) <= 9);
            const completed = matches.filter(isMatchCompleted).length;
            return { total: matches.length, completed, remaining: Math.max(0, matches.length - completed) };
        }

        function getRequiredMidseasonSubmissionTeams() {
            const market = getMarket();
            return RAW_TEAMS.filter(team => Number(market.releasePlans[team.id] || 0) > 0);
        }

        function getPendingTradeCount() {
            const market = getMarket();
            return market.tradeOffers.filter(offer => offer.status === 'pending').length;
        }

        function isMidseasonCompleted() {
            const market = getMarket();
            return market.midseason.phase === 'completed'
                && RAW_TEAMS.every(team => market.midseason.releaseConfirmed[team.id])
                && getRequiredMidseasonSubmissionTeams().every(team => market.midseason.submissionConfirmed[team.id])
                && market.midseason.draftConfirmed
                && market.midseason.tradesClosed
                && getPendingTradeCount() === 0
                && inspectRosterIntegrity().valid;
        }

        function areAllProtectionsConfirmed() {
            return RAW_TEAMS.every(team => getMarket().endDraft.protectionConfirmed[team.id]);
        }

        function renderTransferChecklist() {
            const market = getMarket();
            const progress = getFirstHalfProgress();
            const integrity = inspectRosterIntegrity();
            const period = getAutomaticTransferPeriod();
            const endMarket = period.key === 'endseason' || market.endDraft.phase === 'completed';
            const items = endMarket ? [
                [state.schedule.length > 0 && state.schedule.every(isMatchCompleted), 'リーグ全試合終了'],
                [RAW_TEAMS.every(team => Object.prototype.hasOwnProperty.call(market.protectionBonus, team.id)), '平林杯ボーナス設定'],
                [areAllProtectionsConfirmed(), `全クラブのプロテクト (${RAW_TEAMS.filter(team => market.endDraft.protectionConfirmed[team.id]).length}/9)`],
                [RAW_TEAMS.every(team => Object.prototype.hasOwnProperty.call(market.endDraft.roundOnePicks, team.id)), '1巡目提出'],
                [market.endDraft.roundOneResults.length > 0, '1巡目抽選・確定'],
                [market.endDraft.phase === 'completed', 'ウェーバー終了'],
                [integrity.valid, '名簿整合性チェック'],
                [market.endDraft.phase === 'completed' && integrity.valid, '次シーズン開始可能']
            ] : [
                [progress.remaining === 0, `MW1〜9全試合終了（残り${progress.remaining}試合）`],
                [period.key === 'midseason' || ['second_half', 'endseason'].includes(period.key), '中間市場開始'],
                [RAW_TEAMS.every(team => market.midseason.releaseConfirmed[team.id]), `9クラブ放出確定 (${RAW_TEAMS.filter(team => market.midseason.releaseConfirmed[team.id]).length}/9)`],
                [market.midseason.tradesClosed && getPendingTradeCount() === 0, `トレード終了（確認待ち${getPendingTradeCount()}件）`],
                [getRequiredMidseasonSubmissionTeams().every(team => market.midseason.submissionConfirmed[team.id]), '必要クラブの希望提出'],
                [market.midseason.draftConfirmed, 'ドラフト確定'],
                [integrity.valid, '名簿整合性チェック'],
                [isMidseasonCompleted(), 'MW10開始可能']
            ];
            return `<details class="market-step transfer-checklist"><summary><span>移籍市場チェックリスト<span class="market-step-copy">${items.filter(item => item[0]).length}/${items.length} 完了</span></span></summary><div class="market-step-body">${items.map(([done, label]) => `<div class="transfer-club-card"><div class="transfer-count" style="color:${done ? 'var(--accent-gold-light)' : 'var(--text-muted)'}">${done ? '✓' : '○'}</div><div style="font-size:.76rem;font-weight:700">${escapeHtml(label)}</div></div>`).join('')}${integrity.valid ? '' : `<button class="btn-secondary" style="width:100%;margin-top:.5rem" onclick="openRosterIntegritySheet()">名簿の問題を確認</button>`}</div></details>`;
        }

        window.openRosterIntegritySheet = function() {
            const integrity = inspectRosterIntegrity();
            const affectedIds = [...new Set(integrity.issues.flatMap(issue => issue.teamId ? [issue.teamId] : RAW_TEAMS.filter(team => issue.message.includes(team.name)).map(team => team.id)))];
            document.getElementById('sheet-body').innerHTML = `<div style="text-align:center;margin-bottom:1rem"><h3>名簿整合性チェック</h3></div>${integrity.valid ? '<div class="market-note">重複登録・人数超過・カード規定違反はありません。</div>' : `${integrity.issues.map(issue => `<div class="card" style="padding:.7rem;margin-bottom:.45rem;color:var(--accent-red)">${escapeHtml(issue.message)}</div>`).join('')}<div class="market-note">既存データは自動削除しません。下のボタンから、問題を減らす修正だけを理由付きで実行できます。</div>${affectedIds.map(teamId => `<button class="btn-secondary" style="width:100%;margin-top:.45rem" onclick="openRosterSheet('${teamId}',true)">${escapeHtml(RAW_TEAMS.find(team => team.id === teamId)?.name || teamId)}を修正</button>`).join('')}`}<button class="btn-secondary event-entry-back" onclick="document.getElementById('sheet-overlay').classList.remove('active')">閉じる</button>`;
            document.getElementById('sheet-overlay').classList.add('active');
        };

        function setTransferControlState(id, enabled, lockedMessage) {
            const element = document.getElementById(id);
            if (!element) return;
            element.disabled = !enabled;
            element.title = enabled ? '' : lockedMessage;
        }

        function getRoster(teamId) {
            if (!Array.isArray(state.rosters[teamId])) state.rosters[teamId] = [];
            return state.rosters[teamId];
        }

        function getRosterCounts(teamId) {
            const roster = getRoster(teamId).filter(player => player.status !== 'released' && player.status !== 'transferred');
            return { total: roster.length, special: roster.filter(player => player.cardType === 'special').length, normal: roster.filter(player => player.cardType === 'normal').length };
        }

        function getAvailablePlayers() {
            const market = getMarket();
            const released = RAW_TEAMS.flatMap(team => getRoster(team.id)
                .filter(player => player.status === 'released')
                .map(player => ({ id: `r_${team.id}_${player.id}`, source: 'released', sourceTeamId: team.id, sourcePlayerId: player.id, name: player.name, position: player.position, cardType: player.cardType })));
            const freeAgents = market.freeAgents.filter(player => player.status !== 'signed').map(player => ({ ...player, source: 'free' }));
            return [...released, ...freeAgents];
        }

        function takeTransferSnapshot(label) {
            const market = getMarket();
            const copy = cloneTransferData(market);
            delete copy.lastSnapshot;
            market.lastSnapshot = { label, createdAt: new Date().toISOString(), rosters: cloneTransferData(state.rosters), transferMarket: copy };
        }

        function addTransferHistory(title, detail) {
            getMarket().history.unshift({ id: `h_${Date.now()}_${Math.random().toString(16).slice(2)}`, title, detail, createdAt: new Date().toISOString() });
        }

        function commitTransferChange() {
            const market = getMarket();
            market.revision = Number(market.revision || 0) + 1;
            const rollback = getMarket().lastSnapshot ? cloneTransferData(getMarket().lastSnapshot) : null;
            if (!isEditMode()) {
                if (rollback) {
                    state.rosters = cloneTransferData(rollback.rosters);
                    state.transferMarket = cloneTransferData(rollback.transferMarket);
                    getMarket().lastSnapshot = null;
                }
                saveStateToStorage();
                refreshAllViews();
                alert('移籍操作は編集モードで行えます。画面上部の「編集」を押してください。');
                return Promise.resolve(false);
            }
            const saving = persistAppState().catch(error => {
                if (rollback) {
                    state.rosters = cloneTransferData(rollback.rosters);
                    state.transferMarket = cloneTransferData(rollback.transferMarket);
                    getMarket().lastSnapshot = null;
                    saveStateToStorage();
                    refreshAllViews();
                }
                alert(error?.message || 'クラウドへの保存に失敗したため、変更を取り消しました。');
                throw error;
            });
            renderTransferCenter();
            return saving;
        }

        function renderTransferCenter() {

            const auditList = document.getElementById('transfer-audit-list');

            const tradeOfferList = document.getElementById('trade-offer-list');
            const protectionList = document.getElementById('protection-list');

            const endDraftList = document.getElementById('end-draft-list');

            const quickGuide = document.getElementById('transfer-quick-guide');
            if (quickGuide) {
                const nextAction = isMidseason ? '放出選手を確定し、希望する選手を提出してください。' : isEndseason ? 'プロテクト選手を登録し、ドラフト指名へ進んでください。' : '各クラブの選手名簿を確認・登録してください。';

            let nextAction = { view:'rosters', title:'選手名簿を確認', copy:'登録選手とポジション構成を確認できます。', button:'名簿を開く' };
            if (isPreseason) nextAction = { view:'rosters', title:'選手名簿を準備', copy:'開幕前に登録人数と選手情報を確認してください。', button:'名簿を開く' };
            if (isMidseason && !releaseDone) nextAction = { view:'midseason', title:'放出選手を決める', copy:`${selectedTeam.name}の放出人数と対象選手を確定します。`, button:'中間市場を開く' };
            else if (isMidseason && releaseCount > 0 && !draftDone) nextAction = { view:'midseason', title:'獲得希望を提出', copy:`放出${releaseCount}名分の獲得希望を提出してください。`, button:'希望を提出する' };
            else if (isMidseason) nextAction = { view:'trades', title:'トレードを確認', copy:'公開中の選手と届いた提案を確認できます。', button:'トレードを開く' };
            if (isEndseason && !protectionDone) nextAction = { view:'endseason', title:'プロテクト選手を決める', copy:`${selectedTeam.name}のドラフト対象外選手を確定します。`, button:'終了時市場を開く' };

                <button class="transfer-menu-card" onclick="switchTransferView('midseason')"><span class="transfer-menu-icon">02</span><b>中間移籍市場</b><span>放出・ドラフト・獲得結果</span></button>
                <button class="transfer-menu-card" onclick="switchTransferView('trades')"><span class="transfer-menu-icon">03</span><b>トレード</b><span>公開選手と届いた提案</span></button>

            setTransferControlState('trade-close-button', isMidseason && !market.midseason.tradesClosed, 'トレード受付は終了しています');

            setTransferControlState('end-draft-pick-button', isEndseason, '終了時ドラフトはシーズン終了移籍市場のみ利用できます');
            setTransferControlState('undo-transfer-button', isPreseason || isMidseason || isEndseason, '移籍操作の取り消しは移籍市場が開いている期間のみ利用できます');
            const allPlayers = RAW_TEAMS.flatMap(team => getRoster(team.id));
            const registered = allPlayers.filter(player => player.status !== 'released' && player.status !== 'transferred');

            summary.innerHTML = `

            }).join('')}</div>`;
            const standings = calculateStandings();
            marketList.innerHTML = standings.slice().reverse().map((standing, index) => ({ standing, index })).filter(({ standing }) => RAW_TEAMS.find(item => item.name === standing.name)?.id === selectedTeamId).map(({ standing, index }) => {
                const team = RAW_TEAMS.find(item => item.name === standing.name);
                const releaseCount = Number(market.releasePlans[team.id] || 0);

            resultList.innerHTML = market.draftResults.length ? market.draftResults.slice(0, 20).map((result, index) => `<div class="card" style="margin-bottom:0.45rem;padding:0.65rem;"><span style="color:var(--accent-gold);font-family:'Teko';font-size:1.1rem;">${index + 1}</span> <b>${escapeHtml(result.playerName)}</b><div style="font-size:0.68rem;color:var(--text-muted);">→ ${escapeHtml(result.teamName)} ・ ${escapeHtml(result.method)}</div></div>`).join('') : `<div class="card" style="text-align:center;color:var(--text-muted);font-size:0.78rem;">まだドラフトは確定していません</div>`;
            renderTradeMarket(tradeListingList, tradeOfferList);
            renderEndSeasonMarket(protectionList, endMarketStatus, endDraftList, endDraftActions, selectedTeamId);
            historyList.innerHTML = market.history.length ? market.history.slice(0, 5).map(item => `<div class="card" style="margin-bottom:0.45rem;padding:0.65rem;"><b>${escapeHtml(item.title)}</b><div style="font-size:0.68rem;color:var(--text-muted);">${escapeHtml(item.detail || '')}</div></div>`).join('') : `<div class="card" style="text-align:center;color:var(--text-muted);font-size:0.78rem;">移籍履歴はまだありません</div>`;
            if (auditList) auditList.innerHTML = market.auditLog.length ? market.auditLog.slice(0, 20).map(item => {
                const date = item.timestamp ? new Date(item.timestamp).toLocaleString('ja-JP') : '';
                const detail = [item.player, item.fromTeam && `移籍元 ${RAW_TEAMS.find(team => team.id === item.fromTeam)?.name || item.fromTeam}`, item.toTeam && `移籍先 ${RAW_TEAMS.find(team => team.id === item.toTeam)?.name || item.toTeam}`, item.reason].filter(Boolean).join(' ・ ');
                return `<div class="card" style="margin-bottom:.45rem;padding:.65rem"><b>${escapeHtml(item.actionType || 'TRANSFER_ACTION')}</b><div style="font-size:.68rem;color:var(--text-muted)">${escapeHtml(detail || '詳細なし')}<br>${escapeHtml(date)} ・ Season ${Number(item.season || 1)}</div></div>`;
            }).join('') : '<div class="card" style="text-align:center;color:var(--text-muted);font-size:.78rem">監査ログはまだありません</div>';

        window.openRosterSheet = function(teamId, repairMode = false) {
            const team = RAW_TEAMS.find(item => item.id === teamId);
            if (!team) return;
            const counts = getRosterCounts(teamId);

            const positions = ['FW', 'MF', 'DF', 'GK'];
            const positionCounts = Object.fromEntries(positions.map(position => [position, players.filter(player => player.position === position).length]));
            const groupedPlayers = positions.map(position => ({ position, players: players.filter(player => player.position === position) })).filter(group => group.players.length)
                .concat(players.some(player => !positions.includes(player.position)) ? [{ position: '未登録', players: players.filter(player => !positions.includes(player.position)) }] : []);
            const playerRows = players.length ? groupedPlayers.map(group => `
                <section class="roster-position-section">
                    <div class="roster-position-header">${group.position}<span>${group.players.length}名</span></div>
                    <div class="roster-player-list">${group.players.map((player, index) => `<div class="roster-player-card"><div class="roster-player-index">${String(index + 1).padStart(2, '0')}</div><div class="roster-player-info"><div class="roster-player-name">${escapeHtml(player.name)}</div><div class="roster-player-tags"><span class="position">${escapeHtml(player.position || '未登録')}</span><span>${player.cardType === 'special' ? '特別カード' : 'ノーマルカード'}</span></div></div><button class="btn-secondary" onclick="removePlayer('${teamId}','${player.id}')">削除</button></div>`).join('')}</div>
                </section>`).join('') : `<div class="roster-empty">登録選手はまだいません</div>`;
            document.getElementById('sheet-body').innerHTML = `
                <div class="roster-sheet-hero"><img src="${team.logo}" class="team-logo-lg" alt=""><div class="roster-sheet-title">${escapeHtml(team.name)}</div><div class="roster-sheet-subtitle">SQUAD LIST · ${counts.total} PLAYERS</div><div class="roster-composition-grid">${positions.map(position => `<div class="roster-composition-item"><div class="roster-composition-position">${position}</div><div class="roster-composition-count">${positionCounts[position]}</div></div>`).join('')}</div><div class="roster-sheet-summary"><span>登録 ${counts.total}/25</span><span>特別 ${counts.special}/18</span><span>ノーマル ${counts.normal}</span></div></div>
                <div class="roster-list-heading"><strong>選手一覧</strong><span>ポジション別</span></div>${playerRows}
                <button class="btn-primary roster-add-button" onclick="openAddPlayerSheet('${teamId}')">このチームに選手を追加</button>`;
            document.getElementById('sheet-overlay').classList.add('active');
        };

        window.openAddPlayerSheet = function(defaultTeamId = '', repairMode = false) {
            if (!requireEditMode('選手登録')) return;
            const teamOptions = RAW_TEAMS.map(team => `<option value="${team.id}" ${team.id === defaultTeamId ? 'selected' : ''}>${escapeHtml(team.name)}</option>`).join('');
            document.getElementById('sheet-body').innerHTML = `<div style="text-align:center;margin-bottom:1rem;"><h3>${repairMode ? '名簿整合性を修正' : '選手を登録'}</h3><p style="font-size:0.72rem;color:var(--text-muted);">${repairMode ? '現在の問題を減らす変更だけ保存できます' : 'チームの選手名簿を全員で更新できます'}</p></div><input id="roster-repair-mode" type="hidden" value="${repairMode ? '1' : '0'}"><div class="form-group"><label class="form-label">所属チーム</label><select id="player-team" class="form-select">${teamOptions}</select></div><div class="form-group"><label class="form-label">選手名</label><input id="player-name" class="form-input" maxlength="40" placeholder="例：L. Messi"></div><div class="form-group"><label class="form-label">ポジション</label><select id="player-position" class="form-select"><option>FW</option><option>MF</option><option>DF</option><option>GK</option><option value="">未登録</option></select></div><div class="form-group"><label class="form-label">カード種別</label><select id="player-card-type" class="form-select"><option value="normal">ノーマルカード</option><option value="special">特別カード</option></select></div>${repairMode ? '<div class="form-group"><label class="form-label">修正理由</label><input id="roster-repair-reason" class="form-input" maxlength="80" placeholder="例：既存名簿のノーマルカード不足を修正"></div>' : ''}<button class="btn-primary" onclick="savePlayerToRoster()">登録して全員に同期</button>`;
            document.getElementById('sheet-overlay').classList.add('active');
        };

        window.savePlayerToRoster = function() {
            if (!requireEditMode('選手登録')) return;
            const repairMode = document.getElementById('roster-repair-mode')?.value === '1';
            const teamId = document.getElementById('player-team').value;
            const name = document.getElementById('player-name').value.trim();
            const position = document.getElementById('player-position').value;
            const cardType = document.getElementById('player-card-type').value;
            const repairReason = document.getElementById('roster-repair-reason')?.value.trim() || '';
            if (!name) return alert('選手名を入力してください。');
            if (repairMode && !repairReason) return alert('整合性を修正する理由を入力してください。');
            const owner = findPlayerOwnership(name);
            if (owner) return alert(`この選手は現在${owner.team.name}に登録されています。`);
            const proposed = [...getRoster(teamId), { id: 'preview', name, position, cardType, status: 'active' }];
            const currentValidation = validateRoster(teamId, getRoster(teamId));
            const isImprovingIncompleteRoster = !currentValidation.valid && cardType === 'normal';
            const validation = validateRoster(teamId, proposed, { allowIncompleteBuild: activeRosterPlayers(teamId).length < 7 || isImprovingIncompleteRoster });
            if (!validation.valid) return alert(validation.errors.join('\n'));
            if (repairMode) {
                const proposedRosters = cloneTransferData(state.rosters);
                proposedRosters[teamId] = proposed;
                if (rosterIntegritySeverity(proposedRosters) >= rosterIntegritySeverity()) return alert('この変更では名簿の問題が改善しないため保存できません。');
            }
            const beforeState = getRosterCounts(teamId);
            takeTransferSnapshot('選手登録');
            getRoster(teamId).push({ id: `p_${Date.now()}`, name, position, cardType, status: 'active', appearances: 0 });
            addTransferHistory('選手登録', `${name} を ${RAW_TEAMS.find(team => team.id === teamId).name} に登録`);
            addTransferAudit(repairMode ? 'ADMIN_ROSTER_REPAIR' : 'PLAYER_REGISTERED', { player: name, fromTeam: '', toTeam: teamId, beforeState, afterState: getRosterCounts(teamId), reason: repairMode ? repairReason : '初期名簿登録' });
            commitTransferChange();
            document.getElementById('sheet-overlay').classList.remove('active');
        };

        window.removePlayer = function(teamId, playerId, repairMode = false) {
            if (!confirm('この選手を名簿から削除しますか？')) return;
            const player = getRoster(teamId).find(item => item.id === playerId);
            const proposed = getRoster(teamId).filter(item => item.id !== playerId);
            const validation = validateRoster(teamId, proposed);
            if (!repairMode && !validation.valid) return alert(validation.errors.join('\n'));
            const repairReason = repairMode ? prompt('この整合性修正の理由を入力してください。')?.trim() : '';
            if (repairMode) {
                if (!repairReason) return alert('修正理由が必要です。');
                const proposedRosters = cloneTransferData(state.rosters);
                proposedRosters[teamId] = proposed;
                if (rosterIntegritySeverity(proposedRosters) >= rosterIntegritySeverity()) return alert('この変更では名簿の問題が改善しないため保存できません。');
            }
            const beforeState = getRosterCounts(teamId);
            takeTransferSnapshot('選手削除');
            state.rosters[teamId] = proposed;
            addTransferHistory('選手削除', `${player?.name || '選手'} を名簿から削除`);
            addTransferAudit(repairMode ? 'ADMIN_ROSTER_REPAIR' : 'PLAYER_REMOVED', { player: player?.name || '', fromTeam: teamId, toTeam: '', beforeState, afterState: getRosterCounts(teamId), reason: repairMode ? repairReason : '名簿から削除' });
            commitTransferChange();
            openRosterSheet(teamId);
        };

        window.openReleasePlanSheet = function(teamId) {
            if (!requireTransferPeriod('midseason', '放出選手の登録')) return;
            const team = RAW_TEAMS.find(item => item.id === teamId);
            if (!team) return;
            const market = getMarket();
            if (market.midseason.releaseConfirmed[teamId]) {
                const count = Number(market.releasePlans[teamId] || 0);
                document.getElementById('sheet-body').innerHTML = `<div style="text-align:center;margin-bottom:1rem"><h3>放出選手は確定済みです</h3></div><div class="market-note">${escapeHtml(team.name)}は${count}名放出、${count}名獲得可能として確定しています。</div><button class="btn-danger" style="width:100%;margin-top:.8rem" onclick="unlockReleasePlan('${teamId}')">放出確定を解除</button>`;
                document.getElementById('sheet-overlay').classList.add('active');
                return;
            }
            const selectedIds = market.releasePlayerIds[teamId] || [];
            const players = getRoster(teamId).filter(player => player.status !== 'transferred' && (player.status !== 'released' || selectedIds.includes(player.id)));
            const playerRows = players.length ? players.map(player => `<label style="display:flex;gap:0.55rem;align-items:center;padding:0.55rem 0;border-bottom:1px solid var(--border-color);"><input type="checkbox" data-release-player value="${player.id}" ${selectedIds.includes(player.id) ? 'checked' : ''}><span><b>${escapeHtml(player.name)}</b><br><small style="color:var(--text-muted);">${escapeHtml(player.position || 'ポジション未登録')} ・ ${player.cardType === 'special' ? '特別' : 'ノーマル'}</small></span></label>`).join('') : `<div style="text-align:center;color:var(--text-muted);padding:0.8rem;">登録選手がいません</div>`;
            document.getElementById('sheet-body').innerHTML = `<div style="text-align:center;margin-bottom:1rem;"><img src="${team.logo}" class="team-logo-lg" style="width:52px;height:52px;"><h3>${escapeHtml(team.name)}</h3></div><div class="market-note" style="margin-bottom:0.8rem;">放出する選手を0〜3名選択してください。確定後は解除するまで変更できません。</div>${playerRows}<button class="btn-primary" style="margin-top:0.9rem;" onclick="saveReleasePlan('${teamId}')">放出選手を確定</button>`;
            document.getElementById('sheet-overlay').classList.add('active');
        };

        window.saveReleasePlan = function(teamId) {
            if (!requireTransferPeriod('midseason', '放出選手の登録')) return;
            const ids = [...document.querySelectorAll('[data-release-player]:checked')].map(element => element.value);
            if (ids.length > 3) return alert('放出できるのは3名までです。');
            const market = getMarket();
            if (market.midseason.releaseConfirmed[teamId]) return alert('放出選手は確定済みです。変更する場合は先に確定を解除してください。');
            const proposed = cloneTransferData(getRoster(teamId));
            proposed.forEach(player => { if (ids.includes(player.id)) player.status = 'released'; });
            const validation = validateRoster(teamId, proposed);
            if (!validation.valid) return alert(validation.errors.join('\n'));
            takeTransferSnapshot('放出リスト更新');
            const previous = new Set(market.releasePlayerIds[teamId] || []);
            getRoster(teamId).forEach(player => {
                if (ids.includes(player.id)) player.status = 'released';
                else if (previous.has(player.id) && player.status === 'released') player.status = 'active';
            });
            market.releasePlayerIds[teamId] = ids;
            market.releasePlans[teamId] = ids.length;
            market.midseason.releaseConfirmed[teamId] = { confirmedAt: new Date().toISOString(), count: ids.length };
            if (RAW_TEAMS.every(team => market.midseason.releaseConfirmed[team.id])) market.midseason.phase = 'submission';
            market.draftPreferences[teamId] = (market.draftPreferences[teamId] || []).slice(0, ids.length);
            addTransferHistory('放出リスト更新', `${RAW_TEAMS.find(team => team.id === teamId).name}：${ids.length}名放出`);
            addTransferAudit('RELEASE_PLAN_SAVED', { fromTeam: teamId, player: ids.map(id => getRoster(teamId).find(player => player.id === id)?.name).filter(Boolean).join('、'), reason: '中間市場放出予定' });
            commitTransferChange();
            document.getElementById('sheet-overlay').classList.remove('active');
        };

        window.unlockReleasePlan = function(teamId) {
            if (!requireTransferPeriod('midseason', '放出確定の解除')) return;
            const market = getMarket();
            if (market.midseason.submissionConfirmed[teamId] || market.midseason.draftConfirmed) return alert('希望提出後またはドラフト確定後は放出確定を解除できません。');
            if (!confirm('放出確定を解除しますか？この操作は履歴に残ります。')) return;
            takeTransferSnapshot('放出確定解除');
            delete market.midseason.releaseConfirmed[teamId];
            addTransferHistory('放出確定を解除', RAW_TEAMS.find(team => team.id === teamId)?.name || '');
            addTransferAudit('RELEASE_UNLOCKED', { fromTeam: teamId, reason: '放出確定を手動解除' });
            commitTransferChange();
            openReleasePlanSheet(teamId);
        };

        window.openMarketPlayerSheet = function() {

            document.getElementById('sheet-body').innerHTML = `<div style="text-align:center;margin-bottom:1rem;"><h3>移籍希望選手を登録</h3><p style="font-size:0.72rem;color:var(--text-muted);">加入希望の選手を市場へ登録します</p></div><div class="form-group"><label class="form-label">選手名</label><input id="market-player-name" class="form-input" maxlength="40" placeholder="例：L. Messi"></div><div class="form-group"><label class="form-label">ポジション</label><select id="market-player-position" class="form-select"><option>FW</option><option>MF</option><option>DF</option><option>GK</option><option value="">未登録</option></select></div><div class="form-group"><label class="form-label">カード種別</label><select id="market-player-card-type" class="form-select"><option value="normal">ノーマルカード</option><option value="special">特別カード</option></select></div><button class="btn-primary" onclick="saveMarketPlayer()">市場に登録して全員に同期</button>`;
            document.getElementById('sheet-overlay').classList.add('active');

        window.saveMarketPlayer = function() {
            if (!requireTransferPeriod('midseason', '移籍希望選手の登録')) return;
            const name = document.getElementById('market-player-name').value.trim();
            if (!name) return alert('選手名を入力してください。');
