            addTransferAudit('MARKET_PLAYER_REGISTERED', { player: name, fromTeam: '', toTeam: '', reason: '中間市場への登録' });
            commitTransferChange();
            document.getElementById('sheet-overlay').classList.remove('active');
        };

        window.openDraftBoardSheet = function(defaultTeamId = '') {
            if (!requireTransferPeriod('midseason', '中間ドラフトの希望提出')) return;
            const market = getMarket();
            if (!RAW_TEAMS.every(team => market.midseason.releaseConfirmed[team.id])) return alert('全9クラブの放出確定後に希望を提出できます。');
            const teamId = defaultTeamId || RAW_TEAMS[0].id;
            const team = RAW_TEAMS.find(item => item.id === teamId);
            if (!market.midseason.releaseConfirmed[teamId]) return alert('先に放出選手を確定してください。');
            if (market.midseason.submissionConfirmed[teamId]) {
                document.getElementById('sheet-body').innerHTML = `<div style="text-align:center"><h3>希望は提出済みです</h3><div class="market-note">再編集する場合は提出を取り消してください。</div><button class="btn-secondary" style="width:100%;margin-top:.8rem" onclick="withdrawDraftPreferences('${teamId}')">提出を取り消す</button></div>`;
                document.getElementById('sheet-overlay').classList.add('active');
                return;
            }
            const slots = Number(market.releasePlans[teamId] || 0);
            const preferences = market.draftPreferences[teamId] || [];
            const candidates = getAvailablePlayers().filter(player => player.sourceTeamId !== teamId);
            const options = RAW_TEAMS.map(item => `<option value="${item.id}" ${item.id === teamId ? 'selected' : ''}>${escapeHtml(item.name)}</option>`).join('');
            const candidateRows = candidates.length ? candidates.map(player => {
                const selectedRank = preferences.indexOf(player.id) + 1;
                return `<div style="display:flex;gap:0.55rem;align-items:center;padding:0.55rem 0;border-bottom:1px solid var(--border-color);"><select class="form-select" data-draft-choice data-player-id="${player.id}" style="width:78px;padding:0.35rem;"><option value="">希望外</option>${Array.from({ length: slots }, (_, index) => `<option value="${index + 1}" ${selectedRank === index + 1 ? 'selected' : ''}>第${index + 1}希望</option>`).join('')}</select><div><b>${escapeHtml(player.name)}</b><div style="font-size:0.68rem;color:var(--text-muted);">${escapeHtml(player.position || 'ポジション未登録')} ・ ${player.cardType === 'special' ? '特別' : 'ノーマル'}</div></div></div>`;
            }).join('') : `<div style="text-align:center;padding:0.8rem;color:var(--text-muted);">移籍市場に選手がいません</div>`;
            document.getElementById('sheet-body').innerHTML = `<div style="text-align:center;margin-bottom:0.8rem;"><h3>ドラフト希望提出</h3><p style="font-size:0.72rem;color:var(--text-muted);">放出人数と同じ ${slots} 名まで、希望順位を選びます</p></div><div class="form-group"><label class="form-label">チーム</label><select id="draft-team" class="form-select" onchange="openDraftBoardSheet(this.value)">${options}</select></div>${slots ? candidateRows : `<div class="market-note">先に「シーズン中間市場」で放出選手を選択してください。放出人数が指名枠になります。</div>`}${slots ? `<button class="btn-primary" style="margin-top:0.9rem;" onclick="saveDraftPreferences('${teamId}')">希望を保存して全員に同期</button>` : ''}`;
            document.getElementById('sheet-overlay').classList.add('active');
        };

        window.saveDraftPreferences = function(teamId) {
            if (!requireTransferPeriod('midseason', '中間ドラフトの希望提出')) return;
            if (!RAW_TEAMS.every(team => getMarket().midseason.releaseConfirmed[team.id])) return alert('全9クラブの放出確定後に希望を提出できます。');
            const entries = [...document.querySelectorAll('[data-draft-choice]')].map(element => ({ id: element.dataset.playerId, rank: Number(element.value) })).filter(entry => entry.rank);
            const slots = Number(getMarket().releasePlans[teamId] || 0);
            if (entries.length > slots) return alert(`希望は${slots}名までです。`);
            if (new Set(entries.map(entry => entry.rank)).size !== entries.length) return alert('同じ希望順位は1つだけ選んでください。');
            const candidateById = new Map(getAvailablePlayers().map(player => [player.id, player]));
            const ownChoice = entries.map(entry => candidateById.get(entry.id)).find(player => player?.sourceTeamId === teamId);
            if (ownChoice) return alert('自クラブが放出した選手は指名できません。');
            const selectedCandidates = entries.map(entry => candidateById.get(entry.id)).filter(Boolean);
            const proposed = [...activeRosterPlayers(teamId), ...selectedCandidates.map((candidate, index) => ({ ...candidate, id: `preview_${index}`, status: 'active' }))];
            const validation = validateRoster(teamId, proposed);
            if (!validation.valid) return alert(`希望した選手を獲得すると名簿規定に違反します。\n${validation.errors.join('\n')}`);
            takeTransferSnapshot('ドラフト希望提出');
            getMarket().draftPreferences[teamId] = entries.sort((a, b) => a.rank - b.rank).map(entry => entry.id);
            getMarket().midseason.submissionConfirmed[teamId] = { submittedAt: new Date().toISOString() };
            getMarket().midseason.phase = 'confirmation';
            addTransferHistory('ドラフト希望提出', `${RAW_TEAMS.find(team => team.id === teamId).name} が${entries.length}名を提出`);
            addTransferAudit('DRAFT_SUBMISSION_CONFIRMED', { fromTeam: teamId, player: selectedCandidates.map(player => player.name).join('、'), reason: '中間ドラフト希望提出' });
            commitTransferChange();
            document.getElementById('sheet-overlay').classList.remove('active');
        };

        window.withdrawDraftPreferences = function(teamId) {
            if (!requireTransferPeriod('midseason', '希望提出の取消')) return;
            const market = getMarket();
            if (market.midseason.draftConfirmed) return alert('ドラフト確定後は提出を取り消せません。');
            takeTransferSnapshot('ドラフト希望提出取消');
            delete market.midseason.submissionConfirmed[teamId];
            addTransferHistory('ドラフト希望提出を取消', RAW_TEAMS.find(team => team.id === teamId)?.name || '');
            addTransferAudit('DRAFT_SUBMISSION_WITHDRAWN', { fromTeam: teamId, reason: '希望提出を取消' });
            commitTransferChange();
            openDraftBoardSheet(teamId);
        };

        function buildMidseasonDraftPreview() {
            const market = getMarket();
            const candidates = getAvailablePlayers();
            const activeTeams = RAW_TEAMS.filter(team => Number(market.releasePlans[team.id] || 0) > 0);
            const errors = [];
            if (!RAW_TEAMS.every(team => market.midseason.releaseConfirmed[team.id])) errors.push('全9クラブの放出確定が必要です');
            if (!activeTeams.every(team => market.midseason.submissionConfirmed[team.id])) errors.push('指名枠がある全クラブの希望提出が必要です');
            if (getPendingTradeCount()) errors.push('確認待ちのトレード提案があります');
            if (!market.midseason.tradesClosed) errors.push('トレード受付が終了していません');
            const orderIds = market.midseason.draftOrderSnapshot.length
                ? market.midseason.draftOrderSnapshot
                : calculateStandings().slice().reverse().map(standing => RAW_TEAMS.find(team => team.name === standing.name)?.id).filter(Boolean);
            const order = orderIds.map(id => RAW_TEAMS.find(team => team.id === id)).filter(Boolean);
            const proposedRosters = cloneTransferData(state.rosters);
            const assigned = new Set();
            const results = [];
            order.forEach(team => {
                const slots = Number(market.releasePlans[team.id] || 0);
                const preferences = market.draftPreferences[team.id] || [];
                for (const choiceId of preferences) {
                    if (results.filter(result => result.teamId === team.id).length >= slots) break;
                    const choice = candidates.find(player => player.id === choiceId);
                    if (!choice || assigned.has(choice.id) || choice.sourceTeamId === team.id) continue;
                    const activeTarget = activePlayersFromRoster(proposedRosters[team.id] || []);
                    const proposedTarget = [...activeTarget, { ...choice, id: `draft_preview_${results.length}`, status: 'active' }];
                    if (!validateRoster(team.id, proposedTarget).valid || findOtherPlayerOwnership(choice.name, choice.source === 'released' ? { teamId: choice.sourceTeamId, playerId: choice.sourcePlayerId } : null, proposedRosters)) continue;
                    assigned.add(choice.id);
                    if (choice.source === 'released') {
                        const source = (proposedRosters[choice.sourceTeamId] || []).find(player => player.id === choice.sourcePlayerId);
                        if (source) source.status = 'transferred';
                    }
                    proposedRosters[team.id] ||= [];
                    proposedRosters[team.id].push({ id: `p_${Date.now()}_${results.length}`, name: choice.name, position: choice.position || '', cardType: choice.cardType || 'normal', status: 'active', appearances: 0 });
                    results.push({ id: `d_${Date.now()}_${results.length}`, playerName: choice.name, teamId: team.id, teamName: team.name, source: choice.source, sourceId: choice.id, sourceTeamId: choice.sourceTeamId || '', method: '下位順位から指名枠を一括確定' });
                }
            });
            const integrity = inspectRosterIntegrity(proposedRosters);
            errors.push(...integrity.issues.map(issue => issue.message));
            return { valid: errors.length === 0, errors, results, rosters: proposedRosters, orderIds, activeTeams };
        }

        window.openMidseasonDraftPreview = function() {
            if (!requireTransferPeriod('midseason', 'ドラフト確定前チェック')) return;
            const preview = buildMidseasonDraftPreview();
            const byTeam = RAW_TEAMS.map(team => {
                const players = preview.results.filter(result => result.teamId === team.id);
                const counts = validateRoster(team.id, preview.rosters[team.id] || [], { allowIncompleteBuild: true }).counts;
                return `<div class="transfer-club-card"><img src="${team.logo}" alt=""><div style="flex:1"><b>${escapeHtml(team.name)}</b><div style="font-size:.68rem;color:var(--text-muted)">${players.length ? escapeHtml(players.map(player => player.playerName).join('、')) : '獲得予定なし'}<br>獲得後 ${counts.total}名・特別${counts.special}名・ノーマル${counts.normal}名</div></div></div>`;
            }).join('');
            document.getElementById('sheet-body').innerHTML = `<div style="text-align:center;margin-bottom:.8rem"><h3>ドラフト確定前チェック</h3></div>${preview.errors.length ? `<div class="market-note" style="color:var(--accent-red);margin-bottom:.7rem">${preview.errors.map(escapeHtml).join('<br>')}</div>` : '<div class="market-note" style="margin-bottom:.7rem">名簿規定・重複所属に問題はありません。確定できます。</div>'}${byTeam}`;
            document.getElementById('sheet-overlay').classList.add('active');
        };

        window.runAutomaticDraft = function() {
            if (!requireTransferPeriod('midseason', '中間ドラフトの確定')) return;
            const market = getMarket();
            const preview = buildMidseasonDraftPreview();
            if (!preview.valid) return alert(`ドラフトを確定できません。\n${preview.errors.join('\n')}`);
            if (!preview.activeTeams.length) {
                if (!confirm('全クラブが放出0名です。獲得なしで中間市場を完了しますか？')) return;
                takeTransferSnapshot('中間市場完了');
                market.midseason.draftConfirmed = true;
                market.midseason.phase = 'completed';
                addTransferHistory('中間市場完了', '全クラブ放出0名・獲得なし');
                addTransferAudit('MIDSEASON_COMPLETED', { reason: '全クラブ放出0名' });
                commitTransferChange();
                return;
            }
            if (!preview.results.length) return alert('条件に合う希望がありません。希望順位・登録上限を確認してください。');
            if (!confirm('確定前チェックの内容で中間ドラフトを確定しますか？')) return;
            takeTransferSnapshot('ドラフト自動確定');
            market.midseason.draftOrderSnapshot = preview.orderIds;
            state.rosters = preview.rosters;
            preview.results.filter(result => result.source === 'free').forEach(result => {
                const freeAgent = market.freeAgents.find(player => player.id === result.sourceId);
                if (freeAgent) freeAgent.status = 'signed';
            });
            const results = preview.results;
            market.draftResults = [...results, ...market.draftResults];
            market.midseason.draftConfirmed = true;
            market.midseason.phase = 'completed';
            results.forEach(result => addTransferHistory('移籍確定', `${result.playerName} → ${result.teamName}`));
            results.forEach(result => addTransferAudit('MIDSEASON_DRAFT_ACQUIRED', { player: result.playerName, toTeam: result.teamId, reason: '中間ドラフト' }));
            commitTransferChange();
            alert(`${results.length}件の移籍を確定しました。`);
        };

        function activeRosterPlayers(teamId) {
            return getRoster(teamId).filter(player => player.status !== 'released' && player.status !== 'transferred');
        }

        function previewRosterMoves(moves = [], baseRosters = state.rosters) {
            const proposed = cloneTransferData(baseRosters || {});
            RAW_TEAMS.forEach(team => { if (!Array.isArray(proposed[team.id])) proposed[team.id] = []; });
            const movedPlayers = [];
            for (const move of moves) {
                if (!move?.sourceTeamId || !move?.targetTeamId || move.sourceTeamId === move.targetTeamId) {
                    return { valid: false, errors: ['移籍元または移籍先が正しくありません'] };
                }
                const source = proposed[move.sourceTeamId];
                const index = source.findIndex(player => player.id === move.playerId && player.status !== 'released' && player.status !== 'transferred');
                if (index < 0) return { valid: false, errors: ['対象選手の所属が変更されています'] };
                const [player] = source.splice(index, 1);
                player.status = 'active';
                if (move.endDraftMarker) player.endDraftAcquired = move.endDraftMarker;
                proposed[move.targetTeamId].push(player);
                movedPlayers.push(player);
            }
            const affected = new Set(moves.flatMap(move => [move.sourceTeamId, move.targetTeamId]));
            const errors = [];
            affected.forEach(teamId => errors.push(...validateRoster(teamId, proposed[teamId]).errors.map(message => `${RAW_TEAMS.find(team => team.id === teamId)?.name || teamId}：${message}`)));
            errors.push(...inspectRosterIntegrity(proposed).issues.filter(issue => issue.type === 'duplicate').map(issue => issue.message));
            return { valid: errors.length === 0, errors, rosters: proposed, movedPlayers };
        }

        function moveRosterPlayer(sourceTeamId, playerId, targetTeamId, endDraftMarker = '') {
            const preview = previewRosterMoves([{ sourceTeamId, playerId, targetTeamId, endDraftMarker }]);
            if (!preview.valid) return { ok: false, errors: preview.errors };
            state.rosters = preview.rosters;
            return { ok: true, player: preview.movedPlayers[0] };
        }

        function renderTradeMarket(listingWrap, offerWrap) {
            if (!listingWrap || !offerWrap) return;
            const market = getMarket();
            const canTrade = getAutomaticTransferPeriod().key === 'midseason';
            const openListings = market.tradeListings.filter(listing => listing.status === 'open');
            listingWrap.innerHTML = openListings.length ? openListings.map(listing => {
                const team = RAW_TEAMS.find(item => item.id === listing.teamId);
                const player = getRoster(listing.teamId).find(item => item.id === listing.playerId);
                if (!team || !player) return '';
                return `<div class="card" style="margin-bottom:0.45rem;padding:0.7rem;"><div style="display:flex;align-items:center;gap:0.55rem;"><img src="${team.logo}" style="width:34px;height:34px;object-fit:contain;"><div style="flex:1;"><b>${escapeHtml(player.name)}</b><div style="font-size:0.68rem;color:var(--text-muted);">${escapeHtml(team.name)} ・ ${escapeHtml(player.position || '未登録')}</div></div><button class="btn-secondary" onclick="openTradeOfferSheet('${listing.id}')" ${canTrade ? '' : 'disabled'}>提案</button><button class="btn-secondary" onclick="cancelTradeListing('${listing.id}')" ${canTrade ? '' : 'disabled'}>取消</button></div></div>`;
            }).join('') : `<div class="card" style="text-align:center;color:var(--text-muted);font-size:0.78rem;">トレード可能選手はまだ公表されていません</div>`;
            const offers = market.tradeOffers.filter(offer => offer.status === 'pending');
            offerWrap.innerHTML = offers.length ? offers.map(offer => {
                const listing = market.tradeListings.find(item => item.id === offer.listingId);
                const owner = RAW_TEAMS.find(item => item.id === listing?.teamId);
                const requester = RAW_TEAMS.find(item => item.id === offer.fromTeamId);
                const target = listing ? getRoster(listing.teamId).find(item => item.id === listing.playerId) : null;
                const offeredNames = offer.offeredPlayerIds.map(id => getRoster(offer.fromTeamId).find(player => player.id === id)?.name).filter(Boolean);
                return `<div class="card" style="margin-bottom:0.45rem;padding:0.7rem;"><b>${escapeHtml(requester?.name || '')} → ${escapeHtml(owner?.name || '')}</b><div style="font-size:0.7rem;margin:0.25rem 0;color:var(--text-muted);">${escapeHtml(offeredNames.join('、'))} ⇄ ${escapeHtml(target?.name || '対象選手')}</div><div style="display:flex;gap:0.4rem;"><button class="btn-primary" onclick="acceptTradeOffer('${offer.id}')" ${canTrade ? '' : 'disabled'}>承認して成立</button><button class="btn-secondary" onclick="rejectTradeOffer('${offer.id}')" ${canTrade ? '' : 'disabled'}>見送り</button></div></div>`;
            }).join('') : `<div class="card" style="text-align:center;color:var(--text-muted);font-size:0.78rem;">確認待ちのトレード提案はありません</div>`;
        }

        window.openTradeListingSheet = function(defaultTeamId = '') {
            if (!requireTransferPeriod('midseason', 'トレード可能選手の公表')) return;
            const teamId = defaultTeamId || RAW_TEAMS[0].id;
            const options = RAW_TEAMS.map(team => `<option value="${team.id}" ${team.id === teamId ? 'selected' : ''}>${escapeHtml(team.name)}</option>`).join('');
            const listedIds = new Set(getMarket().tradeListings.filter(item => item.status === 'open').map(item => item.playerId));
            const players = activeRosterPlayers(teamId).filter(player => !listedIds.has(player.id));
            const playerOptions = players.map(player => `<option value="${player.id}">${escapeHtml(player.name)} / ${escapeHtml(player.position || '未登録')}</option>`).join('');
            document.getElementById('sheet-body').innerHTML = `<div style="text-align:center;margin-bottom:1rem;"><h3>トレード可能選手を公表</h3></div><div class="form-group"><label class="form-label">チーム</label><select class="form-select" onchange="openTradeListingSheet(this.value)">${options}</select></div><div class="form-group"><label class="form-label">選手</label><select id="trade-listing-player" class="form-select"><option value="">選手を選択</option>${playerOptions}</select></div><button class="btn-primary" onclick="saveTradeListing('${teamId}')" ${players.length ? '' : 'disabled'}>公表して全員に同期</button>`;
            document.getElementById('sheet-overlay').classList.add('active');
        };

        window.saveTradeListing = function(teamId) {
            if (!requireTransferPeriod('midseason', 'トレード可能選手の公表')) return;
            if (getMarket().midseason.tradesClosed) return alert('トレード受付は終了しています。');
            const playerId = document.getElementById('trade-listing-player')?.value;
            const player = activeRosterPlayers(teamId).find(item => item.id === playerId);
            if (!player) return alert('選手を選択してください。');

            getMarket().tradeListings.unshift({ id: `tl_${Date.now()}`, teamId, playerId, status: 'open', createdAt: new Date().toISOString() });
            addTransferHistory('トレード可能選手を公表', `${RAW_TEAMS.find(team => team.id === teamId).name}：${player.name}`);
            addTransferAudit('TRADE_LISTING_CREATED', { player: player.name, fromTeam: teamId, reason: 'トレード可能選手として公表' });
            commitTransferChange();
            document.getElementById('sheet-overlay').classList.remove('active');
        };

        window.cancelTradeListing = function(listingId) {
            if (!requireTransferPeriod('midseason', 'トレード公表の取消')) return;
            const listing = getMarket().tradeListings.find(item => item.id === listingId);
            if (!listing || !confirm('このトレード公表を取り消しますか？')) return;
            takeTransferSnapshot('トレード公表の取消');
            listing.status = 'cancelled';
            getMarket().tradeOffers.filter(offer => offer.listingId === listingId && offer.status === 'pending').forEach(offer => offer.status = 'cancelled');
            addTransferHistory('トレード公表を取消', RAW_TEAMS.find(team => team.id === listing.teamId)?.name || '');
            addTransferAudit('TRADE_LISTING_CANCELLED', { fromTeam: listing.teamId, reason: 'トレード公表を取消' });
            commitTransferChange();
        };

        window.openTradeOfferSheet = function(listingId, defaultTeamId = '') {
            if (!requireTransferPeriod('midseason', 'トレード提案')) return;
            const listing = getMarket().tradeListings.find(item => item.id === listingId && item.status === 'open');
            if (!listing) return;
            const availableTeams = RAW_TEAMS.filter(team => team.id !== listing.teamId);
            const teamId = defaultTeamId && defaultTeamId !== listing.teamId ? defaultTeamId : availableTeams[0]?.id;
            const options = availableTeams.map(team => `<option value="${team.id}" ${team.id === teamId ? 'selected' : ''}>${escapeHtml(team.name)}</option>`).join('');
            const rows = activeRosterPlayers(teamId).map(player => `<label class="appearance-option"><input type="checkbox" data-trade-offer-player value="${player.id}"><span>${escapeHtml(player.name)} / ${escapeHtml(player.position || '未登録')}</span></label>`).join('');
            document.getElementById('sheet-body').innerHTML = `<div style="text-align:center;margin-bottom:1rem;"><h3>トレードを提案</h3></div><div class="form-group"><label class="form-label">提案するチーム</label><select class="form-select" onchange="openTradeOfferSheet('${listingId}',this.value)">${options}</select></div><div class="form-group"><label class="form-label">交換に出す選手（複数選択可）</label><div class="appearance-picker">${rows || '<div class="empty-state">登録選手がいません</div>'}</div></div><button class="btn-primary" onclick="saveTradeOffer('${listingId}','${teamId}')">提案して全員に同期</button>`;
            document.getElementById('sheet-overlay').classList.add('active');

        window.saveTradeOffer = function(listingId, fromTeamId) {
            if (!requireTransferPeriod('midseason', 'トレード提案')) return;
            if (getMarket().midseason.tradesClosed) return alert('トレード受付は終了しています。');
            const ids = [...document.querySelectorAll('[data-trade-offer-player]:checked')].map(input => input.value);
            if (!ids.length) return alert('交換に出す選手を選択してください。');
            takeTransferSnapshot('トレード提案');
            getMarket().tradeOffers.unshift({ id: `to_${Date.now()}`, listingId, fromTeamId, offeredPlayerIds: ids, status: 'pending', createdAt: new Date().toISOString() });
            addTransferHistory('トレードを提案', `${RAW_TEAMS.find(team => team.id === fromTeamId)?.name || ''}：${ids.length}名を提示`);
            addTransferAudit('TRADE_OFFER_SUBMITTED', { player: ids.map(id => getRoster(fromTeamId).find(player => player.id === id)?.name).filter(Boolean).join('、'), fromTeam: fromTeamId, toTeam: getMarket().tradeListings.find(item => item.id === listingId)?.teamId || '', reason: 'トレード提案' });
            commitTransferChange();
            document.getElementById('sheet-overlay').classList.remove('active');
        };

        window.acceptTradeOffer = function(offerId) {
            if (!requireTransferPeriod('midseason', 'トレード成立')) return;
            const market = getMarket();
            if (market.midseason.tradesClosed) return alert('トレード受付は終了しています。');
            const offer = market.tradeOffers.find(item => item.id === offerId && item.status === 'pending');
            const listing = market.tradeListings.find(item => item.id === offer?.listingId && item.status === 'open');
            if (!offer || !listing || !confirm('両チーム合意としてトレードを成立させますか？')) return;
            const target = activeRosterPlayers(listing.teamId).find(player => player.id === listing.playerId);
            const offered = offer.offeredPlayerIds.map(id => activeRosterPlayers(offer.fromTeamId).find(player => player.id === id)).filter(Boolean);
            if (!target || offered.length !== offer.offeredPlayerIds.length) return alert('対象選手の所属が変わっています。提案を確認してください。');
            const moves = [
                { sourceTeamId: listing.teamId, playerId: listing.playerId, targetTeamId: offer.fromTeamId },
                ...offered.map(player => ({ sourceTeamId: offer.fromTeamId, playerId: player.id, targetTeamId: listing.teamId }))
            ];
            const preview = previewRosterMoves(moves);
            if (!preview.valid) return alert(`トレード後の名簿が規定を満たしません。\n${preview.errors.join('\n')}`);
            takeTransferSnapshot('トレード成立');
            const targetName = target.name;
            state.rosters = preview.rosters;
            offer.status = 'accepted';
            listing.status = 'completed';
            market.tradeOffers.filter(item => item.listingId === listing.id && item.id !== offer.id && item.status === 'pending').forEach(item => item.status = 'rejected');
            addTransferHistory('トレード成立', `${targetName} ⇄ ${offered.map(player => player.name).join('、')}`);
            addTransferAudit('TRADE_COMPLETED', { player: [targetName, ...offered.map(player => player.name)].join('、'), fromTeam: listing.teamId, toTeam: offer.fromTeamId, reason: '両クラブ承認' });
            commitTransferChange();
        };

        window.closeMidseasonTrades = function() {
            if (!requireTransferPeriod('midseason', 'トレード受付終了')) return;
            const market = getMarket();
            if (getPendingTradeCount()) return alert('確認待ちのトレード提案をすべて承認または見送りにしてください。');
            if (!confirm('中間市場のトレード受付を終了しますか？')) return;
            takeTransferSnapshot('トレード受付終了');
            market.midseason.tradesClosed = true;
            market.tradeListings.filter(item => item.status === 'open').forEach(item => item.status = 'closed');
            addTransferHistory('トレード受付終了', '確認待ち提案0件');
            addTransferAudit('TRADES_CLOSED', { reason: '中間市場ドラフト確定準備' });
            commitTransferChange();
        };

        window.rejectTradeOffer = function(offerId) {
            if (!requireTransferPeriod('midseason', 'トレード提案の見送り')) return;
            const offer = getMarket().tradeOffers.find(item => item.id === offerId);
            if (!offer) return;
            takeTransferSnapshot('トレード提案の見送り');
            offer.status = 'rejected';
            addTransferHistory('トレード提案を見送り', RAW_TEAMS.find(team => team.id === offer.fromTeamId)?.name || '');
            addTransferAudit('TRADE_OFFER_REJECTED', { fromTeam: offer.fromTeamId, reason: 'トレード提案を見送り' });
            commitTransferChange();
        };

        function endCandidateId(teamId, playerId) { return `${teamId}|${playerId}`; }

        function getPlayerSeasonAppearances(teamId, player, stats = calculatePlayerStats()) {
            const teamName = RAW_TEAMS.find(team => team.id === teamId)?.name || '';
            return stats.find(stat => stat.team === teamName && stat.name === player?.name)?.appearances || 0;
        }

        function getValidProtectionIds(teamId, ids = getMarket().protections[teamId] || [], stats = calculatePlayerStats()) {
            const activePlayers = activeRosterPlayers(teamId);
            return ids.filter(id => {
                const player = activePlayers.find(item => item.id === id);
                return player && getPlayerSeasonAppearances(teamId, player, stats) >= 10;
            });
        }

        function getProtectionBonusInfo(teamId) {
            const finalMatch = ensureHirabayashiCupState().knockoutMatches.find(match => match.id === 'hc_final');
            const winner = cupWinner(finalMatch);
            const runnerUp = cupLoser(finalMatch);
            const teamName = RAW_TEAMS.find(team => team.id === teamId)?.name || '';
            if (winner && runnerUp) return { automatic: true, value: teamName === winner ? 2 : teamName === runnerUp ? 1 : 0, winner, runnerUp };
            return { automatic: false, value: Number(getMarket().protectionBonus[teamId] || 0) };
        }

        function getEndDraftCandidates() {
            const market = getMarket();
            const marker = `season-${state.seasonInfo?.number || 1}`;
            return RAW_TEAMS.flatMap(team => {
                const protectedIds = new Set(getValidProtectionIds(team.id));
                return activeRosterPlayers(team.id).filter(player => !protectedIds.has(player.id) && player.endDraftAcquired !== marker).map(player => ({ ...player, candidateId: endCandidateId(team.id, player.id), sourceTeamId: team.id }));
            });
        }

        function getEndDraftOrder(round = 2) {
            const snapshot = getMarket().endDraft.draftOrderSnapshot;
            const base = snapshot.length
                ? snapshot.map(id => RAW_TEAMS.find(team => team.id === id)).filter(Boolean)
                : calculateStandings().slice().reverse().map(standing => RAW_TEAMS.find(team => team.name === standing.name)).filter(Boolean);
            return Number(round) % 2 === 0 ? base : base.slice().reverse();
        }

        function currentWaiverTeam() {
            const draft = getMarket().endDraft;
            return getEndDraftOrder(draft.waiverRound)[draft.waiverTurnIndex] || null;
        }

        function advanceWaiverTurn() {
            const draft = getMarket().endDraft;
            const order = getEndDraftOrder(draft.waiverRound);
            draft.waiverTurnIndex += 1;
            if (draft.waiverTurnIndex >= order.length) {
                draft.waiverRound += 1;
                draft.waiverTurnIndex = 0;
            }
        }

        function renderEndSeasonMarket(protectionWrap, statusWrap, draftWrap, actionWrap, selectedTeamId = '') {
            if (!protectionWrap || !statusWrap || !draftWrap || !actionWrap) return;
            const market = getMarket();
            const draft = market.endDraft;
            const canUseEndMarket = getAutomaticTransferPeriod().key === 'endseason';
            const phaseInfo = {
                protection: { label: 'プロテクト登録中', description: '各チームがプロテクトする選手を登録する段階です。' },
                round1: { label: '1巡目・非公開提出中', description: '各チームが1巡目の希望選手を非公開で提出する段階です。' },
                waiver: { label: `${draft.waiverRound}巡目・順番指名中`, description: '画面に表示されたチームが順番に選手を指名する段階です。' },
                completed: { label: '終了時ドラフト完了', description: 'シーズン終了移籍市場の手続きが完了した状態です。' }
            };
            const currentPhase = phaseInfo[draft.phase] || phaseInfo.protection;
            statusWrap.innerHTML = canUseEndMarket
                ? `<div class="card" style="padding:0.7rem;margin-bottom:0.7rem;"><div style="font-size:0.6rem;color:var(--text-muted);">シーズン終了市場の進行状況</div><b style="display:block;color:var(--accent-gold-light);margin-top:0.12rem;">${currentPhase.label}</b><div style="font-size:0.65rem;color:var(--text-muted);margin-top:0.2rem;line-height:1.45;">${currentPhase.description}</div></div>`
                : `<div class="card" style="padding:0.7rem;margin-bottom:0.7rem;"><div style="font-size:0.6rem;color:var(--text-muted);">シーズン終了市場</div><b style="display:block;color:var(--text-muted);margin-top:0.12rem;">開始前</b><div style="font-size:0.65rem;color:var(--text-muted);margin-top:0.2rem;line-height:1.45;">全マッチウィークの試合結果が登録されると自動的に開始します。</div></div>`;
            const visibleTeams = selectedTeamId ? RAW_TEAMS.filter(team => team.id === selectedTeamId) : RAW_TEAMS;
            protectionWrap.innerHTML = visibleTeams.map(team => {
                const ids = getValidProtectionIds(team.id);
                const names = ids.map(id => getRoster(team.id).find(player => player.id === id)?.name).filter(Boolean);
                const bonus = getProtectionBonusInfo(team.id).value;
                const confirmed = !!draft.protectionConfirmed[team.id];
                return `<div class="transfer-club-card" onclick="openProtectionSheet('${team.id}')"><img src="${team.logo}"><div style="flex:1;"><b>${escapeHtml(team.name)}</b><div style="font-size:0.68rem;color:var(--text-muted);">${names.length ? escapeHtml(names.join('、')) : '未登録'} (${names.length}/${6 + bonus}) ・ ${confirmed ? '確定済み' : '未確定'}</div></div><div class="transfer-count">›</div></div>`;
            }).join('');
            const submitted = RAW_TEAMS.filter(team => Object.prototype.hasOwnProperty.call(draft.roundOnePicks, team.id)).length;
            const roundOneStatus = visibleTeams.map(team => `<div class="transfer-club-card" onclick="openRoundOnePickSheet('${team.id}')"><img src="${team.logo}"><div style="flex:1;"><b>${escapeHtml(team.name)}</b><div style="font-size:0.68rem;color:var(--text-muted);">${Object.prototype.hasOwnProperty.call(draft.roundOnePicks, team.id) ? '提出済み（非公開）' : '未提出'}</div></div><div class="transfer-count">›</div></div>`).join('');
            const revealedResults = draft.roundOneResults.map(result => `<div class="card" style="padding:0.65rem;margin-bottom:0.4rem;"><b>${escapeHtml(result.teamName)}</b><div style="font-size:0.68rem;color:var(--text-muted);">${escapeHtml(result.playerName || '指名なし')} ・ ${result.won ? '獲得' : '抽選外れ'}</div></div>`).join('');
            const waiverResults = draft.waiverResults.map(result => `<div class="card" style="padding:0.65rem;margin-bottom:0.4rem;"><b>${result.round}巡目 ${escapeHtml(result.teamName)}</b><div style="font-size:0.68rem;color:var(--text-muted);">${escapeHtml(result.playerName || 'パス')}</div></div>`).join('');
            draftWrap.innerHTML = draft.phase === 'protection' || draft.phase === 'round1' ? roundOneStatus : `${revealedResults}${waiverResults}`;
            if (draft.phase === 'protection' || draft.phase === 'round1') {
                actionWrap.innerHTML = `<button class="btn-primary" onclick="revealAndResolveRoundOne()" ${canUseEndMarket && submitted === RAW_TEAMS.length ? '' : 'disabled'}>1巡目を一斉開示して抽選 (${submitted}/${RAW_TEAMS.length})</button>`;
            } else if (draft.phase === 'waiver') {
                const current = currentWaiverTeam();
                actionWrap.innerHTML = `<div class="card" style="padding:0.7rem;margin-bottom:0.5rem;"><b>${draft.waiverRound}巡目：${escapeHtml(current?.name || '')} の指名</b><div style="font-size:0.68rem;color:var(--text-muted);">獲得済み選手は候補に表示されません</div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;"><button class="btn-primary" onclick="openWaiverPickSheet()" ${canUseEndMarket ? '' : 'disabled'}>選手を指名</button><button class="btn-secondary" onclick="passWaiverPick()" ${canUseEndMarket ? '' : 'disabled'}>パス</button></div><button class="btn-secondary" style="width:100%;margin-top:0.5rem;" onclick="completeEndDraft()" ${canUseEndMarket ? '' : 'disabled'}>終了時ドラフトを完了</button>`;
            } else {
                actionWrap.innerHTML = `<div class="card" style="text-align:center;color:var(--text-muted);">終了時ドラフトは完了しています</div>`;
            }
        }

        window.openProtectionSheet = function(defaultTeamId = '') {
            if (!requireTransferPeriod('endseason', 'プロテクト登録')) return;
            const market = getMarket();
            const teamId = defaultTeamId || RAW_TEAMS[0].id;
            if (market.endDraft.protectionConfirmed[teamId]) {
                document.getElementById('sheet-body').innerHTML = `<div style="text-align:center"><h3>プロテクトは確定済みです</h3><div class="market-note">確定後は終了時ドラフトの安全性を保つため変更できません。</div></div>`;
                document.getElementById('sheet-overlay').classList.add('active');
                return;
            }
            const selected = getValidProtectionIds(teamId);
            const bonusInfo = getProtectionBonusInfo(teamId);
            const bonus = bonusInfo.value;
            const stats = calculatePlayerStats();
            const options = RAW_TEAMS.map(item => `<option value="${item.id}" ${item.id === teamId ? 'selected' : ''}>${escapeHtml(item.name)}</option>`).join('');
            const rows = activeRosterPlayers(teamId).map(player => {
                const appearances = getPlayerSeasonAppearances(teamId, player, stats);
                const eligible = appearances >= 10;
                return `<label class="appearance-option" style="opacity:${eligible ? 1 : 0.45};"><input type="checkbox" data-protection-player value="${player.id}" ${eligible && selected.includes(player.id) ? 'checked' : ''} ${eligible ? '' : 'disabled'}><span>${escapeHtml(player.name)} / 出場 ${appearances}試合${eligible ? '' : '（対象外：10試合未満）'}</span></label>`;
            }).join('');
            document.getElementById('sheet-body').innerHTML = `<div style="text-align:center;margin-bottom:1rem;"><h3>プロテクト選手を確定</h3></div><div class="market-note" style="margin-bottom:0.8rem;">リーグ戦10試合以上出場した選手から${6 + bonus}名を選択します。</div><div class="form-group"><label class="form-label">チーム</label><select class="form-select" onchange="openProtectionSheet(this.value)">${options}</select></div><div class="form-group"><label class="form-label">平林杯の追加枠</label>${bonusInfo.automatic ? `<div class="form-input">自動判定：+${bonus}</div><input id="protection-bonus" type="hidden" value="${bonus}">` : `<select id="protection-bonus" class="form-select"><option value="0" ${bonus === 0 ? 'selected' : ''}>追加なし</option><option value="1" ${bonus === 1 ? 'selected' : ''}>+1</option><option value="2" ${bonus === 2 ? 'selected' : ''}>+2</option></select><small style="color:var(--text-muted)">平林杯の決勝結果を自動判定できないため手動設定です。</small>`}</div><div class="appearance-picker">${rows || '<div class="empty-state">登録選手がいません</div>'}</div><button class="btn-primary" style="margin-top:0.8rem;" onclick="saveProtections('${teamId}')">プロテクトを確定</button>`;
            document.getElementById('sheet-overlay').classList.add('active');
        };

        window.saveProtections = function(teamId) {
            if (!requireTransferPeriod('endseason', 'プロテクト登録')) return;
            const ids = [...document.querySelectorAll('[data-protection-player]:checked')].map(input => input.value);
            const bonus = Number(document.getElementById('protection-bonus')?.value || 0);
            if (ids.length !== 6 + bonus) return alert(`プロテクト選手を${6 + bonus}名選択してください。`);
            const stats = calculatePlayerStats();
            const ineligible = ids.map(id => activeRosterPlayers(teamId).find(player => player.id === id)).filter(Boolean).filter(player => {
                const appearances = getPlayerSeasonAppearances(teamId, player, stats);
                return appearances < 10;
            });
            if (ineligible.length) return alert(`10試合未満の選手はプロテクトできません：${ineligible.map(player => player.name).join('、')}`);
            takeTransferSnapshot('プロテクト登録');
            const market = getMarket();
            market.protections[teamId] = ids;
            market.protectionBonus[teamId] = bonus;
            market.endDraft.protectionConfirmed[teamId] = { confirmedAt: new Date().toISOString() };
            if (areAllProtectionsConfirmed() && !market.endDraft.draftOrderSnapshot.length) market.endDraft.draftOrderSnapshot = calculateStandings().slice().reverse().map(standing => RAW_TEAMS.find(team => team.name === standing.name)?.id).filter(Boolean);
            addTransferHistory('プロテクトを公表', `${RAW_TEAMS.find(team => team.id === teamId)?.name || ''}：${ids.length}名`);
            addTransferAudit('PROTECTION_CONFIRMED', { fromTeam: teamId, player: ids.map(id => getRoster(teamId).find(player => player.id === id)?.name).filter(Boolean).join('、'), reason: `基本6名・追加${bonus}名` });
            commitTransferChange();
            document.getElementById('sheet-overlay').classList.remove('active');
        };

        window.openRoundOnePickSheet = function(defaultTeamId = '') {
            if (!requireTransferPeriod('endseason', '終了時ドラフト1巡目')) return;
            if (!areAllProtectionsConfirmed()) return alert('全9クラブのプロテクト確定後に1巡目を開始できます。');
            const market = getMarket();
            const draft = market.endDraft;
            const teamId = defaultTeamId || RAW_TEAMS[0].id;
            if (Object.prototype.hasOwnProperty.call(draft.roundOnePicks, teamId)) {
                document.getElementById('sheet-body').innerHTML = `<div style="text-align:center;"><h3>1巡目指名</h3><div class="market-note">このチームは提出済みです。指名内容は一斉開示まで非公開です。</div><button class="btn-secondary" style="width:100%;margin-top:0.8rem;" onclick="withdrawRoundOnePick('${teamId}')">提出を取り消す</button></div>`;
                document.getElementById('sheet-overlay').classList.add('active');
                return;
            }
            const options = RAW_TEAMS.map(team => `<option value="${team.id}" ${team.id === teamId ? 'selected' : ''}>${escapeHtml(team.name)}</option>`).join('');
            const candidates = getEndDraftCandidates().filter(player => player.sourceTeamId !== teamId);
            const candidateOptions = candidates.map(player => `<option value="${player.candidateId}">${escapeHtml(player.name)} / ${escapeHtml(RAW_TEAMS.find(team => team.id === player.sourceTeamId)?.name || '')}</option>`).join('');
            document.getElementById('sheet-body').innerHTML = `<div style="text-align:center;margin-bottom:1rem;"><h3>1巡目・非公開指名</h3></div><div class="form-group"><label class="form-label">チーム</label><select class="form-select" onchange="openRoundOnePickSheet(this.value)">${options}</select></div><div class="form-group"><label class="form-label">希望選手</label><select id="round-one-candidate" class="form-select"><option value="">指名なし</option>${candidateOptions}</select></div><button class="btn-primary" onclick="saveRoundOnePick('${teamId}')">非公開で提出</button>`;
            document.getElementById('sheet-overlay').classList.add('active');
        };

        window.saveRoundOnePick = function(teamId) {
            if (!requireTransferPeriod('endseason', '終了時ドラフト1巡目')) return;
            if (!areAllProtectionsConfirmed()) return alert('全9クラブのプロテクト確定後に1巡目を開始できます。');
            takeTransferSnapshot('1巡目指名提出');
            const market = getMarket();
            market.endDraft.phase = 'round1';
            market.endDraft.roundOnePicks[teamId] = { candidateId: document.getElementById('round-one-candidate')?.value || '', submittedAt: new Date().toISOString() };
            addTransferHistory('1巡目指名を提出', `${RAW_TEAMS.find(team => team.id === teamId)?.name || ''}（非公開）`);
            addTransferAudit('END_DRAFT_ROUND_ONE_SUBMITTED', { fromTeam: teamId, reason: '1巡目を非公開提出' });
            commitTransferChange();
            document.getElementById('sheet-overlay').classList.remove('active');
        };

        window.withdrawRoundOnePick = function(teamId) {
            if (!requireTransferPeriod('endseason', '終了時ドラフト1巡目の取消')) return;
            takeTransferSnapshot('1巡目指名の取消');
            delete getMarket().endDraft.roundOnePicks[teamId];
            addTransferHistory('1巡目指名を取消', RAW_TEAMS.find(team => team.id === teamId)?.name || '');
            addTransferAudit('END_DRAFT_ROUND_ONE_WITHDRAWN', { fromTeam: teamId, reason: '1巡目提出を取消' });
            commitTransferChange();
            document.getElementById('sheet-overlay').classList.remove('active');
        };

        window.revealAndResolveRoundOne = function() {
            if (!requireTransferPeriod('endseason', '終了時ドラフト1巡目の確定')) return;
            const market = getMarket();
            const draft = market.endDraft;
            if (RAW_TEAMS.some(team => !Object.prototype.hasOwnProperty.call(draft.roundOnePicks, team.id))) return alert('全チームの提出が必要です。');
            if (!areAllProtectionsConfirmed()) return alert('全9クラブのプロテクト確定が必要です。');
            if (!confirm('1巡目を一斉開示し、重複指名を抽選しますか？')) return;
            takeTransferSnapshot('終了時ドラフト1巡目確定');
            const candidates = getEndDraftCandidates();
            const groups = {};
            const plannedResults = [];
            const plannedMoves = [];
            RAW_TEAMS.forEach(team => {
                const candidateId = draft.roundOnePicks[team.id]?.candidateId || '';
                if (candidateId) (groups[candidateId] ||= []).push(team);
                else plannedResults.push({ teamId: team.id, teamName: team.name, playerName: '', won: false });
            });
            Object.entries(groups).forEach(([candidateId, teams]) => {
                const candidate = candidates.find(player => player.candidateId === candidateId);
                if (!candidate) return;
                const winner = teams[Math.floor(Math.random() * teams.length)];
                teams.forEach(team => plannedResults.push({ teamId: team.id, teamName: team.name, playerName: candidate.name, won: team.id === winner.id, lottery: teams.length > 1 }));
                plannedMoves.push({ sourceTeamId: candidate.sourceTeamId, playerId: candidate.id, targetTeamId: winner.id, endDraftMarker: `season-${state.seasonInfo?.number || 1}`, candidate, winner, lottery: teams.length > 1 });
            });
            const preview = previewRosterMoves(plannedMoves);
            if (!preview.valid) return alert(`1巡目を確定できません。\n${preview.errors.join('\n')}`);
            state.rosters = preview.rosters;
            draft.roundOneResults.push(...plannedResults);
            plannedMoves.forEach(move => {
                addTransferHistory('終了時ドラフト1巡目', `${move.candidate.name} → ${move.winner.name}${move.lottery ? '（抽選）' : ''}`);
                addTransferAudit('END_DRAFT_ROUND_ONE_ACQUIRED', { player: move.candidate.name, fromTeam: move.sourceTeamId, toTeam: move.winner.id, reason: move.lottery ? '重複指名抽選' : '単独指名' });
            });
            draft.phase = 'waiver';
            draft.waiverRound = 2;
            draft.waiverTurnIndex = 0;
            addTransferAudit('END_DRAFT_ROUND_ONE_REVEALED', { reason: '全クラブ一斉開示・抽選完了' });
            commitTransferChange();
        };

        window.openWaiverPickSheet = function() {
            if (!requireTransferPeriod('endseason', '終了時ドラフトの指名')) return;
            const team = currentWaiverTeam();
            if (!team) return;
            const candidates = getEndDraftCandidates().filter(player => player.sourceTeamId !== team.id);
            const options = candidates.map(player => `<option value="${player.candidateId}">${escapeHtml(player.name)} / ${escapeHtml(RAW_TEAMS.find(item => item.id === player.sourceTeamId)?.name || '')}</option>`).join('');
            document.getElementById('sheet-body').innerHTML = `<div style="text-align:center;margin-bottom:1rem;"><h3>${getMarket().endDraft.waiverRound}巡目 ${escapeHtml(team.name)}</h3></div><div class="form-group"><label class="form-label">指名選手</label><select id="waiver-candidate" class="form-select"><option value="">選手を選択</option>${options}</select></div><button class="btn-primary" onclick="saveWaiverPick()" ${candidates.length ? '' : 'disabled'}>指名を確定</button>`;
            document.getElementById('sheet-overlay').classList.add('active');
        };

        window.saveWaiverPick = function() {
            if (!requireTransferPeriod('endseason', '終了時ドラフトの指名')) return;
            const market = getMarket();
            const draft = market.endDraft;
            const team = currentWaiverTeam();
            const candidateId = document.getElementById('waiver-candidate')?.value;
            const candidate = getEndDraftCandidates().find(player => player.candidateId === candidateId);
            if (!team || !candidate || candidate.sourceTeamId === team.id) return alert('指名できる選手を選択してください。');
            takeTransferSnapshot(`${draft.waiverRound}巡目指名`);
            const moved = moveRosterPlayer(candidate.sourceTeamId, candidate.id, team.id, `season-${state.seasonInfo?.number || 1}`);
            if (!moved.ok) return alert(`${candidate.name}を獲得できません。\n${moved.errors.join('\n')}`);
            draft.waiverResults.push({ round: draft.waiverRound, teamId: team.id, teamName: team.name, playerName: candidate.name, candidateId });
            addTransferHistory(`${draft.waiverRound}巡目指名`, `${candidate.name} → ${team.name}`);
            addTransferAudit('END_DRAFT_WAIVER_ACQUIRED', { player: candidate.name, fromTeam: candidate.sourceTeamId, toTeam: team.id, reason: `${draft.waiverRound}巡目` });
            advanceWaiverTurn();
            commitTransferChange();
            document.getElementById('sheet-overlay').classList.remove('active');
        };

        window.passWaiverPick = function() {
            if (!requireTransferPeriod('endseason', '終了時ドラフトのパス')) return;
            const market = getMarket();
            const draft = market.endDraft;
            const team = currentWaiverTeam();
            if (!team || !confirm(`${team.name} はこの巡をパスしますか？`)) return;
            takeTransferSnapshot(`${draft.waiverRound}巡目パス`);
            draft.waiverResults.push({ round: draft.waiverRound, teamId: team.id, teamName: team.name, playerName: '' });
            addTransferHistory(`${draft.waiverRound}巡目パス`, team.name);
            addTransferAudit('END_DRAFT_WAIVER_PASSED', { fromTeam: team.id, reason: `${draft.waiverRound}巡目パス` });
            advanceWaiverTurn();
            commitTransferChange();
        };

        window.completeEndDraft = function() {
            if (!requireTransferPeriod('endseason', '終了時ドラフトの完了')) return;
            if (!confirm('シーズン終了ドラフトを完了しますか？')) return;
            if (!areAllProtectionsConfirmed()) return alert('全クラブのプロテクトが確定していません。');
            if (!getMarket().endDraft.roundOneResults.length) return alert('1巡目が完了していません。');
            const integrity = inspectRosterIntegrity();
            if (!integrity.valid) return alert(`名簿整合性チェックに問題があります。\n${integrity.issues.map(issue => issue.message).join('\n')}`);
            takeTransferSnapshot('終了時ドラフト完了');
            getMarket().endDraft.phase = 'completed';
            addTransferHistory('終了時ドラフト完了', `Season ${state.seasonInfo?.number || 1}`);
            addTransferAudit('END_DRAFT_COMPLETED', { reason: '終了時移籍市場を完了' });
            commitTransferChange();
        };

        window.undoLastTransferChange = function() {
            if (!requireOpenTransferWindow('移籍操作の取り消し')) return;
            const snapshot = getMarket().lastSnapshot;
            if (!snapshot) return alert('戻せる直前の変更はありません。');
            if (!confirm(`「${snapshot.label}」の前に戻しますか？`)) return;
            state.rosters = cloneTransferData(snapshot.rosters);
            state.transferMarket = cloneTransferData(snapshot.transferMarket);
            getMarket().lastSnapshot = null;
            addTransferHistory('変更を取り消し', `${snapshot.label} を元に戻しました`);
            commitTransferChange();
        };

        function cloneRegulationData(value) {
            return JSON.parse(JSON.stringify(value));
        }

        function regulationDateToday() {
            const now = new Date();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${now.getFullYear()}-${month}-${day}`;
        }

        function ruleHtmlToEditorText(html) {
            const holder = document.createElement('div');
            holder.innerHTML = html || '';
            holder.querySelectorAll('br').forEach(node => node.replaceWith('\n'));
            holder.querySelectorAll('li').forEach(node => {
                node.prepend('・');
                node.append('\n');
            });
            holder.querySelectorAll('.rule-article-title').forEach(node => {
                node.prepend('\n');
                node.append('\n');
            });
            return (holder.textContent || '').replace(/\n{3,}/g, '\n\n').trim();
        }

        function ruleEditorTextToHtml(text) {
            return escapeHtml((text || '').trim()).replace(/\n/g, '<br>');
        }

        function getRuleChapterCategory(chapterName = '') {
            if (/選手登録|移籍/.test(chapterName)) return 'transfer';
            if (/試合|リーグ戦|カップ戦/.test(chapterName)) return 'matches';
            if (/表彰|メディア|運営|懲戒|改正/.test(chapterName)) return 'operation';
            return 'basic';
        }

        function getCupAllMatches() {
            const cup = ensureHirabayashiCupState();
            return [...cup.groupMatches, ...cup.repechageMatches, ...cup.knockoutMatches];
        }

        function getCupMatch(matchId) { return getCupAllMatches().find(match => match.id === matchId); }

        function ensureCupDetails(match) {
            if (!match.details || typeof match.details !== 'object') match.details = {};
            if (!Array.isArray(match.details.events)) match.details.events = [];
            if (!match.details.motm) match.details.motm = null;
            if (!match.details.appearances || typeof match.details.appearances !== 'object') match.details.appearances = { home: [], away: [] };
            if (!Array.isArray(match.details.appearances.home)) match.details.appearances.home = [];
            if (!Array.isArray(match.details.appearances.away)) match.details.appearances.away = [];
            return match.details;
        }

        function calculateCupTable(teams, matches) {
            const rows = Object.fromEntries(teams.map(name => [name, { name, p: 0, w: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 }]));
            matches.forEach(match => {
                if (match.hs === null || match.as === null || !rows[match.h] || !rows[match.a]) return;
                const home = rows[match.h], away = rows[match.a], hs = Number(match.hs), as = Number(match.as);
                home.p++; away.p++; home.gf += hs; home.ga += as; away.gf += as; away.ga += hs;
                if (hs > as) { home.w++; home.pts += 3; away.l++; }
                else if (as > hs) { away.w++; away.pts += 3; home.l++; }
                else if (match.pkWinner === match.h) { home.w++; home.pts += 2; away.l++; away.pts += 1; }
                else if (match.pkWinner === match.a) { away.w++; away.pts += 2; home.l++; home.pts += 1; }
                home.gd = home.gf - home.ga; away.gd = away.gf - away.ga;
            });
            return Object.values(rows).sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf || a.name.localeCompare(b.name, 'ja')).map((row, index) => ({ ...row, rank: index + 1 }));
        }

        function cupMatchScore(match) {
            if (!match || match.hs === null || match.as === null) return 'VS';
            return `${match.hs} - ${match.as}${match.pkWinner ? ' PK' : ''}`;
        }

        function cupWinner(match) {
            if (!match || match.hs === null || match.as === null) return '';
            if (Number(match.hs) > Number(match.as)) return match.h;
            if (Number(match.as) > Number(match.hs)) return match.a;
            return match.pkWinner || '';
        }

        function cupLoser(match) {
            const winner = cupWinner(match);
            return winner === match?.h ? match.a : winner === match?.a ? match.h : '';
        }

        function getCupQualifiers() {
            const cup = ensureHirabayashiCupState();
            const groups = ['A', 'B', 'C'].map(group => calculateCupTable(cup.groups[group], cup.groupMatches.filter(match => match.group === group)));
            return { groups, direct: groups.flatMap(rows => rows.slice(0, 2).map(row => row.name)), thirds: groups.map(rows => rows[2]?.name).filter(Boolean) };
        }

        function getCupKnockoutSeeds() {
            const cup = ensureHirabayashiCupState();
            const qualifiers = getCupQualifiers();
            const repechage = calculateCupTable(qualifiers.thirds, cup.repechageMatches);
            if (qualifiers.groups.some(rows => rows.length < 2) || repechage.length < 2) return null;
            return {
                a1: qualifiers.groups[0][0]?.name || '',
                a2: qualifiers.groups[0][1]?.name || '',
                b1: qualifiers.groups[1][0]?.name || '',
                b2: qualifiers.groups[1][1]?.name || '',
                c1: qualifiers.groups[2][0]?.name || '',
                c2: qualifiers.groups[2][1]?.name || '',
                r1: repechage[0]?.name || '',
                r2: repechage[1]?.name || ''
            };
        }

        function createCupKnockoutMatches() {
            const seeds = getCupKnockoutSeeds();
            if (!seeds || Object.values(seeds).some(value => !value)) return false;
            const make = (id, label, h = '未確定', a = '未確定') => ({ id, stage: 'knockout', label, h, a, hs: null, as: null, pkWinner: '', details: { events: [], motm: null, appearances: { home: [], away: [] } } });
            ensureHirabayashiCupState().knockoutMatches = [
                make('hc_qf1', '準々決勝 1', seeds.a1, seeds.r2),
                make('hc_qf2', '準々決勝 2', seeds.b2, seeds.c2),
                make('hc_qf3', '準々決勝 3', seeds.a2, seeds.c1),
                make('hc_qf4', '準々決勝 4', seeds.r1, seeds.b1),
                make('hc_sf1', '準決勝 1'),
                make('hc_sf2', '準決勝 2'),
                make('hc_3rd', '3位決定戦'),
                make('hc_final', '決勝')
            ];
            return true;
        }

        function syncCupKnockout() {
            const cup = ensureHirabayashiCupState();
            const allRepechageFinished = cup.repechageMatches.length === 3 && cup.repechageMatches.every(match => match.hs !== null && match.as !== null && (match.hs !== match.as || match.pkWinner));
            if (allRepechageFinished && !cup.knockoutMatches.length) createCupKnockoutMatches();
            const byId = Object.fromEntries(cup.knockoutMatches.map(match => [match.id, match]));
            const qf = ['hc_qf1', 'hc_qf2', 'hc_qf3', 'hc_qf4'].map(id => byId[id]).filter(Boolean);
            const setTeams = (id, h, a, label) => {
                const match = byId[id];
                if (!match) return;
                if (match.h !== h || match.a !== a) { match.h = h || '未確定'; match.a = a || '未確定'; match.hs = null; match.as = null; match.pkWinner = ''; match.details = { events: [], motm: null, appearances: { home: [], away: [] } }; }
                match.label = label;
            };
            const seeds = allRepechageFinished ? getCupKnockoutSeeds() : null;
            if (seeds && qf.length === 4) {
                setTeams('hc_qf1', seeds.a1, seeds.r2, '準々決勝 1');
                setTeams('hc_qf2', seeds.b2, seeds.c2, '準々決勝 2');
                setTeams('hc_qf3', seeds.a2, seeds.c1, '準々決勝 3');
                setTeams('hc_qf4', seeds.r1, seeds.b1, '準々決勝 4');
            }
            setTeams('hc_sf1', cupWinner(qf[0]), cupWinner(qf[1]), '準決勝 1');
            setTeams('hc_sf2', cupWinner(qf[2]), cupWinner(qf[3]), '準決勝 2');
            const sf1 = byId.hc_sf1, sf2 = byId.hc_sf2;
            setTeams('hc_3rd', cupLoser(sf1), cupLoser(sf2), '3位決定戦');
            setTeams('hc_final', cupWinner(sf1), cupWinner(sf2), '決勝');
        }

        function createCupMatchCard(match) {
            const ready = match.h && match.a && match.h !== '未確定' && match.a !== '未確定';
            return `<div class="cup-match-card">
                <div class="cup-match-meta"><span>${escapeHtml(match.label || 'HIRABAYASHI CUP')}</span><span>${match.hs !== null ? 'FINAL' : 'SCHEDULED'}</span></div>
                <div class="cup-match-line">
                    <div class="cup-match-team"><img src="${getTeamLogo(match.h)}" alt=""><span>${escapeHtml(match.h)}</span></div>
                    <div class="cup-match-score">${cupMatchScore(match)}</div>
                    <div class="cup-match-team away"><span>${escapeHtml(match.a)}</span><img src="${getTeamLogo(match.a)}" alt=""></div>
                </div>
                ${ready ? `<button class="cup-match-action" onclick="openCupMatchSheet('${match.id}')">試合結果・記録を入力</button>` : ''}
            </div>`;
        }

        function calculateCupPlayerStats() {
            const stats = new Map();
            getCupAllMatches().forEach(match => ensureCupDetails(match).events.forEach(event => {
                if (event.type === 'goal' && isOwnGoalEvent(event)) return;
                if (!event.player) return;
                const key = `${event.team}__${event.player}`;
                if (!stats.has(key)) stats.set(key, { name: event.player, team: event.team, goals: 0, assists: 0 });
                const row = stats.get(key);
                if (event.type === 'goal') row.goals++;
                if (event.assist) {
                    const assistKey = `${event.team}__${event.assist}`;
                    if (!stats.has(assistKey)) stats.set(assistKey, { name: event.assist, team: event.team, goals: 0, assists: 0 });
                    stats.get(assistKey).assists++;
                }
            }));
            getCupAllMatches().forEach(match => {
                const details = ensureCupDetails(match);
                [['home', match.h], ['away', match.a]].forEach(([side, team]) => (details.appearances?.[side] || []).forEach(name => {
                    const key = `${team}__${name}`;
                    if (!stats.has(key)) stats.set(key, { name, team, goals: 0, assists: 0, appearances: 0 });
                    stats.get(key).appearances = (stats.get(key).appearances || 0) + 1;
                }));
            });
            return [...stats.values()];
        }

        function renderHirabayashiCup() {
            const wrap = document.getElementById('hirabayashi-cup-content');
            if (!wrap) return;
            const cup = ensureHirabayashiCupState();
            syncCupKnockout();
            const qualifiers = getCupQualifiers();
            const activeGroup = cup.activeGroup;
            const groupRows = calculateCupTable(cup.groups[activeGroup], cup.groupMatches.filter(match => match.group === activeGroup));
            const playerStats = calculateCupPlayerStats();
            const topGoals = [...playerStats].filter(row => row.goals).sort((a,b) => b.goals - a.goals)[0];
            const topAssists = [...playerStats].filter(row => row.assists).sort((a,b) => b.assists - a.assists)[0];
            const bracketColumns = [
                ['準々決勝', cup.knockoutMatches.filter(match => match.id.startsWith('hc_qf'))],
                ['準決勝', cup.knockoutMatches.filter(match => match.id.startsWith('hc_sf'))],
                ['決勝', cup.knockoutMatches.filter(match => ['hc_3rd', 'hc_final'].includes(match.id))]
            ];
            const groupMatches = cup.groupMatches.filter(match => match.group === activeGroup).map(createCupMatchCard).join('');
            const repechage = cup.repechageMatches.length ? cup.repechageMatches.map(createCupMatchCard).join('') : `<div class="cup-qualifier-note">グループステージの全試合結果を登録すると、各組3位のクラブによる敗者復活戦を作成できます。</div>`;
            const allGroupsFinished = cup.groupMatches.length === 9 && cup.groupMatches.every(match => match.hs !== null && match.as !== null && (match.hs !== match.as || match.pkWinner));
            const allRepechageFinished = cup.repechageMatches.length && cup.repechageMatches.every(match => match.hs !== null && match.as !== null && (match.hs !== match.as || match.pkWinner));

                <div class="cup-hub-tabs">
                    ${[['groups','グループ'],['repechage','敗者復活'],['bracket','決勝T'],['records','記録'],['guide','大会要項']].map(([key,label]) => `<button class="cup-hub-tab ${cup.activeTab === key ? 'active' : ''}" onclick="switchCupTab('${key}')">${label}</button>`).join('')}
                </div>
                <section class="cup-panel ${cup.activeTab === 'groups' ? 'active' : ''}">
                    <div class="cup-group-switcher">${['A','B','C'].map(group => `<button class="${activeGroup === group ? 'active' : ''}" onclick="switchCupGroup('${group}')">GROUP ${group}</button>`).join('')}</div>
                    ${groupDrawLocked
                        ? `<div class="market-note" style="margin-bottom:.7rem;">組み合わせ確定済み${cup.groupDraw?.method === 'ranked-pots' ? ' ・ リーグ最終順位による3ポット抽選' : ' ・ 今大会の固定組み合わせ'}</div>`
                        : `<div class="market-note" style="margin-bottom:.7rem;">${leagueFinished ? 'リーグ最終順位が確定しました。ポット1（1〜3位）、ポット2（4〜6位）、ポット3（7〜9位）から各グループへ1クラブずつ抽選します。' : 'リーグ全日程が終了すると、グループ抽選会を実行できます。'}</div><button class="btn-primary" style="width:100%;margin-bottom:.7rem;" onclick="openCupDrawCeremony()" ${leagueFinished ? '' : 'disabled'}>グループ抽選会を始める</button>`}
                    <div class="cup-rule-list">${groupRows.map(row => `<div class="cup-standing-row"><span class="cup-standing-rank">${row.rank}</span><span class="cup-standing-team"><img src="${getTeamLogo(row.name)}" alt=""><span>${escapeHtml(row.name)}</span></span><span>${row.p}試</span><span>${row.gd > 0 ? '+' : ''}${row.gd}</span><b>${row.pts}点</b></div>`).join('')}</div>
                    <div class="cup-section"><h3 class="cup-section-title">GROUP ${activeGroup} 試合</h3><div class="cup-match-list">${groupMatches}</div></div>
                </section>
                <section class="cup-panel ${cup.activeTab === 'repechage' ? 'active' : ''}">
                    <div class="cup-qualifier-note">各組3位：${qualifiers.thirds.map(escapeHtml).join(' ・ ')}<br>勝点は 勝利3 / PK勝利2 / PK敗戦1 / 敗戦0 です。</div>
                    <div class="cup-section"><div class="cup-match-list">${repechage}</div>${allGroupsFinished && !cup.repechageMatches.length ? `<button class="btn-primary" style="margin-top:.75rem;width:100%;" onclick="createCupRepechage()">敗者復活戦を作成</button>` : ''}</div>
                </section>
                <section class="cup-panel ${cup.activeTab === 'bracket' ? 'active' : ''}">
                    ${cup.knockoutMatches.length ? `<div class="cup-bracket">${bracketColumns.map(([title,matches]) => `<div class="cup-bracket-column"><div class="cup-bracket-heading">${title}</div>${matches.map(match => `<div class="cup-bracket-match"><div class="cup-bracket-heading">${escapeHtml(match.label)}</div><div class="cup-bracket-team"><span>${escapeHtml(match.h)}</span><b>${match.hs ?? '-'}</b></div><div class="cup-bracket-team"><span>${escapeHtml(match.a)}</span><b>${match.as ?? '-'}</b></div>${match.h !== '未確定' && match.a !== '未確定' ? `<button class="cup-match-action" onclick="openCupMatchSheet('${match.id}')">記録</button>` : ''}</div>`).join('')}</div>`).join('')}</div>` : `<div class="cup-qualifier-note">敗者復活戦を含む全試合結果が登録されたら、8クラブの決勝トーナメントを作成できます。</div>`}
                    ${allRepechageFinished && !cup.knockoutMatches.length ? `<button class="btn-primary" style="margin-top:.75rem;width:100%;" onclick="createCupKnockout()">決勝トーナメントを作成</button>` : ''}
                </section>
                <section class="cup-panel ${cup.activeTab === 'records' ? 'active' : ''}">
                    <div class="cup-record-grid"><div class="cup-record-card"><b>${escapeHtml(topGoals?.name || '記録なし')}</b><span>得点王 ${topGoals?.goals || 0} GOALS</span></div><div class="cup-record-card"><b>${escapeHtml(topAssists?.name || '記録なし')}</b><span>アシスト王 ${topAssists?.assists || 0} ASSISTS</span></div><div class="cup-record-card"><b>${getCupAllMatches().filter(match => match.hs !== null).length}</b><span>試合結果</span></div></div>
                    <div class="cup-section"><h3 class="cup-section-title">個人記録</h3><div class="cup-rule-list">${playerStats.length ? playerStats.sort((a,b) => b.goals - a.goals || b.assists - a.assists).map((row,index) => `<div class="cup-standing-row"><span class="cup-standing-rank">${index + 1}</span><span>${escapeHtml(row.name)}<small style="display:block;color:var(--text-muted)">${escapeHtml(row.team)}</small></span><span>${row.goals}G</span><span>${row.assists}A</span><span></span></div>`).join('') : '<div class="empty-state">試合記録を入力すると、得点・アシストのランキングが表示されます。</div>'}</div></div>
                </section>
                <section class="cup-panel cup-guide-panel ${cup.activeTab === 'guide' ? 'active' : ''}"><div class="cup-format-card"><div class="cup-stage"><div class="cup-stage-number">01</div><div><b>グループステージ</b><p>3組の総当たり戦。各組上位2クラブが決勝トーナメントへ進出します。</p></div></div><div class="cup-stage"><div class="cup-stage-number">02</div><div><b>敗者復活戦</b><p>各組3位の3クラブによる総当たり戦。上位2クラブが決勝トーナメントへ進出します。</p></div></div><div class="cup-stage"><div class="cup-stage-number">03</div><div><b>決勝トーナメント</b><p>準々決勝① A1位対敗者復活2位、② B2位対C2位、③ A2位対C1位、④ 敗者復活1位対B1位。準決勝は①対②、③対④、決勝は準決勝の勝者同士です。</p></div></div></div></section>`;
        }

        window.switchCupTab = function(tab) { ensureHirabayashiCupState().activeTab = tab; renderHirabayashiCup(); };
        window.switchCupGroup = function(group) { ensureHirabayashiCupState().activeGroup = group; renderHirabayashiCup(); };
        function shuffledCupPot(items) {
            const result = items.slice();
            for (let index = result.length - 1; index > 0; index--) {
                const swapIndex = Math.floor(Math.random() * (index + 1));
                [result[index], result[swapIndex]] = [result[swapIndex], result[index]];
            }
            return result;
        }

        window.openCupDrawCeremony = function() {
            if (!requireEditMode('平林杯グループ抽選')) return;
            const cup = ensureHirabayashiCupState();
            if (cup.groupDraw?.locked) return alert('グループの組み合わせは確定済みです。');
            if (!state.schedule.length || !state.schedule.every(isMatchCompleted)) return alert('リーグ全日程の結果が確定してから抽選できます。');
            const standings = calculateStandings();
            if (standings.length !== 9) return alert('リーグ順位9クラブ分が確定していません。');
            const pots = [standings.slice(0, 3), standings.slice(3, 6), standings.slice(6, 9)];
            document.getElementById('sheet-body').innerHTML = `<div class="news-composer-header"><div class="news-composer-kicker">HIRABAYASHI CUP DRAW</div><h3 class="news-composer-title">グループ抽選会</h3><div class="news-composer-copy">各ポットから1クラブずつ、GROUP A・B・Cへ抽選します。確定後は変更できません。</div></div>${pots.map((pot, index) => `<div class="card" style="padding:.7rem;margin-bottom:.55rem"><b>POT ${index + 1}</b><div style="font-size:.72rem;color:var(--text-muted);margin-top:.3rem">${pot.map(team => `${team.rank}位 ${escapeHtml(team.name)}`).join('<br>')}</div></div>`).join('')}<button class="btn-primary" onclick="runCupGroupDraw()">抽選を実行して確定</button><button class="btn-secondary event-entry-back" onclick="closeCupSheet()">閉じる</button>`;
            document.getElementById('sheet-overlay').classList.add('active');
        };

        window.runCupGroupDraw = function() {
            if (!requireEditMode('平林杯グループ抽選')) return;
            const cup = ensureHirabayashiCupState();
            if (cup.groupDraw?.locked) return alert('グループの組み合わせは確定済みです。');
            if (!state.schedule.length || !state.schedule.every(isMatchCompleted)) return alert('リーグ全日程の結果が確定してから抽選できます。');
            const standings = calculateStandings();
            if (standings.length !== 9) return alert('リーグ順位9クラブ分が確定していません。');
            if (!confirm('3ポット方式で抽選し、この組み合わせを確定しますか？確定後は変更できません。')) return;
            const pots = [standings.slice(0, 3), standings.slice(3, 6), standings.slice(6, 9)].map(pot => shuffledCupPot(pot));
            const groups = { A: [], B: [], C: [] };
            ['A', 'B', 'C'].forEach((group, groupIndex) => { groups[group] = pots.map(pot => pot[groupIndex].name); });
            cup.groups = groups;
            cup.groupMatches = createCupGroupMatches(groups);
            cup.repechageMatches = [];
            cup.knockoutMatches = [];
            cup.groupDraw = {
                locked: true, method: 'ranked-pots', season: Number(state.seasonInfo?.number || 1), confirmedAt: new Date().toISOString(),
                standingsSnapshot: standings.map(team => ({ rank: team.rank, name: team.name })), pots: pots.map(pot => pot.map(team => team.name)), groups: JSON.parse(JSON.stringify(groups))
            };
            addActivity('平林杯グループ抽選を確定', `Season ${state.seasonInfo?.number || 1} ・ 3ポット方式`);
            persistAppState();
            document.getElementById('sheet-overlay').classList.remove('active');
            renderHirabayashiCup();
        };

        window.openCupGroupSetup = function() {
            if (!requireEditMode('平林杯グループ編成')) return;
            const cup = ensureHirabayashiCupState();
            if (cup.groupDraw?.locked) return alert('グループの組み合わせは確定済みのため変更できません。');
            if (cup.groupDraw?.method === 'ranked-pots') return alert('グループ編成はリーグ終了後の抽選会からのみ確定できます。');
            if (getCupAllMatches().some(match => match.hs !== null)) return alert('試合結果を登録した後はグループ編成を変更できません。必要な場合は結果を取り消してから設定してください。');
            const options = selected => RAW_TEAMS.map(team => `<option value="${escapeHtml(team.name)}" ${team.name === selected ? 'selected' : ''}>${escapeHtml(team.name)}</option>`).join('');
            const fields = ['A','B','C'].flatMap(group => cup.groups[group].map((team, index) => `<div class="form-group"><label class="form-label">GROUP ${group} ${index + 1}</label><select class="form-select" data-cup-group="${group}" data-cup-slot="${index}">${options(team)}</select></div>`)).join('');
            document.getElementById('sheet-body').innerHTML = `<div class="news-composer-header"><div class="news-composer-kicker">HIRABAYASHI CUP</div><h3 class="news-composer-title">グループ編成</h3><div class="news-composer-copy">各クラブを1回ずつ選択してください。保存するとグループステージの対戦カードが作り直されます。</div></div><div class="news-composer-panel">${fields}</div><button class="btn-primary news-composer-submit" onclick="saveCupGroupSetup()">グループ編成を保存</button><button class="btn-secondary event-entry-back" onclick="closeCupSheet()">閉じる</button>`;
            document.getElementById('sheet-overlay').classList.add('active');
        };
        window.saveCupGroupSetup = function() {
            if (!requireEditMode('平林杯グループ編成')) return;
            const cup = ensureHirabayashiCupState();
            if (cup.groupDraw?.locked) return alert('グループの組み合わせは確定済みのため変更できません。');
            if (cup.groupDraw?.method === 'ranked-pots') return alert('グループ編成はリーグ終了後の抽選会からのみ確定できます。');
            const values = [...document.querySelectorAll('[data-cup-group]')];

        window.saveCupMatch = function(matchId) { if (!requireEditMode('平林杯の試合結果保存')) return; const match = getCupMatch(matchId), hs = document.getElementById('cup-hs')?.value, as = document.getElementById('cup-as')?.value, pkWinner = document.getElementById('cup-pk')?.value || ''; if (!match || hs === '' || as === '') return alert('両チームの得点を入力してください。'); if (!Number.isInteger(Number(hs)) || !Number.isInteger(Number(as)) || Number(hs) < 0 || Number(as) < 0 || Number(hs) > 20 || Number(as) > 20) return alert('スコアは0〜20の整数で入力してください。'); if (Number(hs) === Number(as) && !pkWinner) return alert('同点の場合はPK勝者を選択してください。'); if (Number(hs) !== Number(as) && pkWinner) return alert('PK勝者は同点の場合だけ選択できます。'); const totals = getRecordedGoalTotals(match); if (totals.home > Number(hs) || totals.away > Number(as)) return alert('得点記録の数がスコアを超えています。'); if (!confirm(`${match.h} ${Number(hs)} - ${Number(as)} ${match.a}\nこの内容で保存しますか？`)) return; const before = `${match.hs ?? '-'}-${match.as ?? '-'}`; match.hs = Number(hs); match.as = Number(as); match.pkWinner = pkWinner; const details = ensureCupDetails(match), motm = document.getElementById('cup-motm')?.value.trim(); details.motm = motm ? { name: motm, team: document.getElementById('cup-motm-team').value } : null; details.appearances = { home: [...document.querySelectorAll('[data-appearance="cup-home"]:checked')].map(input => input.value), away: [...document.querySelectorAll('[data-appearance="cup-away"]:checked')].map(input => input.value) }; addActivity('平林杯の試合結果を更新', `${match.label} ${match.h} ${match.hs}-${match.as} ${match.a}`, { before, after: `${match.hs}-${match.as}` }); syncCupKnockout(); persistAppState(); document.getElementById('sheet-overlay').classList.remove('active'); renderHirabayashiCup(); };

        function renderRules() {

            if (filterBar) {
                const filters = [['basic', '基本'], ['matches', '試合'], ['transfer', '移籍'], ['operation', '運営'], ['all', 'すべて']];

                    html += `
                        <div class="rule-chapter">
                            <div class="rule-chapter-header" onclick="toggleRuleChapter(${idx}, this)">

            renderRegulationManager();

                effectiveDate: regulationDateToday(),
                reason: ''

            if (showMessage) alert('下書きを保存しました。現行規約はまだ変更されていません。');

            renderRegulationManager();
        };

            const draft = collectRegulationDraftFromForm();
            if (!draft || draft.chapters.length <= 1) return alert('すべての章を削除することはできません。');

            draft.chapters.splice(chapterIndex, 1);
            renderRegulationManager();
        };

        window.moveRegulationChapter = function(chapterIndex, direction) {
            const draft = collectRegulationDraftFromForm();
            const target = chapterIndex + direction;
            if (!draft || target < 0 || target >= draft.chapters.length) return;
            [draft.chapters[chapterIndex], draft.chapters[target]] = [draft.chapters[target], draft.chapters[chapterIndex]];
            renderRegulationManager();
        };

        window.addRegulationArticle = function(chapterIndex) {
            const draft = collectRegulationDraftFromForm();
            if (!draft?.chapters[chapterIndex]) return;
            draft.chapters[chapterIndex].articles.push({ title: '新しい条文', text: '' });
            renderRegulationManager();
        };

        window.deleteRegulationArticle = function(chapterIndex, articleIndex) {
            const draft = collectRegulationDraftFromForm();
            const articles = draft?.chapters[chapterIndex]?.articles;
            if (!articles) return;
            if (!confirm('この条文を削除しますか？')) return;
            articles.splice(articleIndex, 1);
            renderRegulationManager();
        };

        window.moveRegulationArticle = function(chapterIndex, articleIndex, direction) {
            const draft = collectRegulationDraftFromForm();
            const articles = draft?.chapters[chapterIndex]?.articles;
            const target = articleIndex + direction;
            if (!articles || target < 0 || target >= articles.length) return;
            [articles[articleIndex], articles[target]] = [articles[target], articles[articleIndex]];
            renderRegulationManager();
        };

            renderRegulationManager();
            persistAppState();
        };

            const draft = collectRegulationDraftFromForm();
            if (!draft?.chapters?.length) return alert('公開する規約がありません。');
            if (draft.chapters.some(chapter => !chapter.chapter || !chapter.articles?.length || chapter.articles.some(article => !article.title || !article.text))) {
                return alert('章の見出し、条文見出し、本文をすべて入力してください。');
            }
            if (!draft.effectiveDate || !draft.reason) return alert('施行日と改正理由を入力してください。');
            const articleCount = draft.chapters.reduce((total, chapter) => total + chapter.articles.length, 0);
            document.getElementById('sheet-body').innerHTML = `
