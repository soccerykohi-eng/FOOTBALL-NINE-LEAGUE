<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#08090c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="平林杯">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/png" href="./hirabayashi-cup.png">
    <link rel="apple-touch-icon" href="./hirabayashi-cup.png">
    <title>平林杯 | HIRABAYASHI CUP</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@700;800;900&family=Teko:wght@600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #0b0f14;
            --bg-card: #151b23;
            --bg-elevated: #1b222c;
            --border-color: rgba(255,255,255,0.08);
            --text-main: #f7f8fa;
            --text-muted: #9199a6;
            --accent-gold: #c6a664;
            --accent-gold-light: #e5cb91;
            --accent-cyan: #38bdf8;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --nav-height: 60px;
            --header-height: 56px;
            --app-width: 480px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        html {
            min-height: 100%;
            background: #05070a;
        }

        body {
            width: 100%;
            max-width: var(--app-width);
            margin: 0 auto;
            position: relative;
            background: var(--bg-body);
            color: var(--text-main);
            font-family: 'Noto Sans JP', sans-serif;
            line-height: 1.4;
            /* iPhoneのノッチ／ステータスバーと固定ヘッダーが重ならないようにする */
            padding-top: calc(var(--header-height) + env(safe-area-inset-top, 0px));
            padding-bottom: calc(var(--nav-height) + env(safe-area-inset-bottom, 0px) + 1.2rem);
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
            min-height: 100dvh;
            overscroll-behavior-y: none;
        }

        /* ヘッダー */
        header {
            background: rgba(11,15,20,0.96);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            padding: 0 0.8rem;
            padding-top: env(safe-area-inset-top, 0px);
            height: calc(var(--header-height) + env(safe-area-inset-top, 0px));
            position: fixed;
            top: 0;
            left: 50%;
            width: min(100%, var(--app-width));
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header::after { display:none; }

        .header-logo-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            min-width: 0;
        }

        .fnl-logo-header {
            width: 30px;
            height: 30px;
            object-fit: contain;
            border-radius: 4px;
        }

        .fnl-brand-text {
            display: flex;
            flex-direction: column;
            line-height: 1;
        }

        .fnl-brand-title {
            font-family: 'Teko', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-main);
        }

        .fnl-brand-sub {
            font-size: 0.55rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        .header-right-status {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 0 0 auto;
        }

        .sync-badge {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.65rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 3px 8px;
            border-radius: 20px;
            color: var(--text-muted);
        }

        .sync-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #f59e0b;
        }

        .sync-dot.online {
            background: var(--accent-green);
            box-shadow: 0 0 6px var(--accent-green);
        }

        .current-page-title {
            font-family: 'M PLUS 1p', 'Noto Sans JP', sans-serif;
            font-size: 0.72rem;
            color: var(--accent-gold);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(198, 166, 100, 0.1);
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid rgba(198, 166, 100, 0.2);
        }

        /* コンテナ */
        .container {
            padding: 1.25rem 1rem;
            width: 100%;
            margin: 0 auto;
            /* 短いページでも画面の高さを保ち、iOSで固定ナビが跳ねないようにする */
            min-height: calc(100dvh - var(--header-height) - var(--nav-height) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 1.2rem);
        }

        .page {
            display: none;
            min-width: 0;
            max-width: 100%;
        }

        .page[hidden] {
            display: none !important;
        }

        .page.active {
            display: block;
        }

        /* セクション */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
        }

        .section-title {
            font-family: 'M PLUS 1p', 'Noto Sans JP', sans-serif;
            font-size: 1.28rem;
            font-weight: 900;
            letter-spacing: 0.04em;
            font-feature-settings: "palt";
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
            line-height: 1.2;
            text-shadow: none;
        }

        .section-title::before {
            content: '';
            width: 3px;
            height: 20px;
            background: var(--accent-gold);
            border: 0;
            transform: none;
            border-radius: 999px;
        }

        /* フィルターチップ */
        .filter-scroll {
            display: flex;
            gap: 0.4rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            margin-bottom: 0.8rem;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .filter-scroll::-webkit-scrollbar { display: none; }

        .chip {
            flex: 0 0 auto;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.35rem 0.8rem;
            font-size: 0.78rem;
            font-weight: 700;
            border-radius: 20px;
            white-space: nowrap;
            cursor: pointer;
        }

        #matches-filter-bar .chip {
            min-width: 56px;
            text-align: center;
        }

        .chip.active {
            background: var(--accent-gold);
            color: #000;
            border-color: var(--accent-gold);
        }

        /* カード */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 1rem;
            margin-bottom: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        /* ヒーローバナー */
        .hero-banner {
            background: linear-gradient(135deg, #1a212c, #111720);
            border: 1px solid rgba(198, 166, 100, 0.28);
            border-radius: 16px;
            padding: 1.5rem 1rem;
            text-align: center;
            margin-bottom: 1rem;
            box-shadow: none;
        }

        .hero-logo-large {
            width: 92px; height: 92px; margin: 0 auto 0.6rem; display: block; object-fit: contain; border-radius: 8px;
        }

        .hero-subtitle {
            color: var(--accent-gold); font-size: 0.7rem; font-weight: bold; letter-spacing: 2px; margin-bottom: 0.2rem;
        }

        .hero-title {
            font-family: 'Teko', sans-serif; font-size: 2.2rem; line-height: 0.95; margin-bottom: 0.4rem; color: #fff;
        }

        /* マッチカード */
        .match-card-mobile {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-left: 0;
            border-radius: 14px;
            padding: 1rem;
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .match-main-row { display: flex; align-items: center; justify-content: space-between; }
        .match-sec-badge { font-size: 0.65rem; color: var(--accent-gold); font-weight: bold; }

        .match-teams-center {
            flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 0 0.2rem;
        }

        .match-team-box { display: flex; align-items: center; gap: 6px; flex: 1; overflow: hidden; }
        .match-team-box.home { justify-content: flex-end; text-align: right; }
        .match-team-box.away { justify-content: flex-start; text-align: left; }

        .match-score-pill {
            background: #0b0f14; border: 1px solid var(--border-color); padding: 0.2rem 0.5rem;
            border-radius: 8px; font-family: 'Teko', sans-serif; font-size: 1.35rem; font-weight: bold;
            color: var(--text-main); min-width: 46px; text-align: center; flex-shrink: 0;
        }

        .match-score-pill.played { color: var(--accent-gold); border-color: var(--accent-gold); }

        .edit-score-btn {
            background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-color); color: var(--text-muted);
            font-size: 0.72rem; padding: 6px 10px; border-radius: 6px; width: 100%; text-align: center;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
        }

        .share-action-btn {
            min-height: 34px; padding: 0 12px; border: 1px solid var(--accent-gold); border-radius: 8px;
            background: linear-gradient(135deg, #252015, #16130e); color: var(--accent-gold-light);
            font-family: inherit; font-size: 0.74rem; font-weight: 800; letter-spacing: 0.04em;
            cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 3px 10px rgba(0,0,0,0.22);
            transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
        }
        .share-action-btn::before {
            content: ''; width: 11px; height: 11px; border: 1.5px solid currentColor; border-radius: 2px;
            box-sizing: border-box; transform: translateY(1px);
        }
        .share-action-btn:hover { background: #352b18; border-color: var(--accent-gold-light); transform: translateY(-1px); }
        .share-action-btn:active { transform: translateY(0); }

        .team-logo-img { width: 24px; height: 24px; border-radius: 50%; object-fit: contain; flex-shrink: 0; }
        .team-logo-lg { width: 56px; height: 56px; border-radius: 50%; object-fit: contain; margin: 0 auto 0.4rem; display: block; }

        /* 順位表テーブル */
        table.mobile-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        table.mobile-table th { color: var(--text-muted); font-size: 0.68rem; padding: 0.4rem 0.2rem; border-bottom: 1px solid var(--border-color); text-align: center; }
        table.mobile-table td { padding: 0.55rem 0.2rem; border-bottom: 1px solid rgba(255,255,255,0.03); text-align: center; }

        .team-col { min-width:0; text-align:left !important; font-weight:700; }
        .standings-team-cell { display:flex; min-width:0; align-items:center; gap:6px; }
        .standings-team-cell > span { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .rank-num { font-family: 'Teko', sans-serif; font-size: 1.1rem; font-weight: bold; width: 18px; color: var(--text-muted); }
        .pts-badge { font-family: 'Teko', sans-serif; font-size: 1.1rem; font-weight: bold; color: var(--accent-gold); }

        /* ニュース */
        .news-feed { padding:.2rem .9rem; border-radius:16px; }
        .news-item { width:100%; padding:1rem .1rem; border:0; border-bottom:1px solid var(--border-color); background:transparent; color:var(--text-main); display:flex; flex-direction:column; gap:.42rem; text-align:left; font:inherit; cursor:pointer; transition:background .18s ease, transform .18s ease; }
        .news-item:last-child { border-bottom:0; }
        .news-item:hover, .news-item:focus-visible { background:rgba(255,255,255,.025); outline:0; }
        .news-item:active { transform:scale(.995); }
        .news-meta { display:flex; align-items:center; gap:.38rem; min-width:0; }
        .news-date { margin-left:auto; color:var(--text-muted); font-size:.62rem; font-weight:700; white-space:nowrap; }
        .news-category { font-size:.58rem; background:rgba(198,166,100,.13); color:var(--accent-gold-light); padding:.18rem .42rem; border-radius:999px; font-weight:900; letter-spacing:.03em; white-space:nowrap; }
        .news-source { min-width:0; overflow:hidden; color:var(--text-muted); font-size:.62rem; font-weight:800; text-overflow:ellipsis; white-space:nowrap; }
        .news-title { padding-right:.6rem; font-size:.9rem; font-weight:800; line-height:1.42; }
        .news-detail-header { margin:-.15rem -.1rem 1.1rem; padding:.15rem .1rem 1rem; border-bottom:1px solid var(--border-color); }
        .news-detail-title { margin:.7rem 0 0; color:var(--text-main); font-size:1.18rem; font-weight:900; line-height:1.45; letter-spacing:.01em; }
        .news-detail-content { margin:.15rem 0 1.2rem; color:#d7dbe2; font-size:.87rem; line-height:1.8; white-space:pre-wrap; }
        .news-detail-delete { margin-top:.2rem; }

        /* 平林杯 */
        .cup-hero { position:relative; overflow:hidden; padding:1.2rem; border:1px solid rgba(198,166,100,.36); border-radius:18px; background:linear-gradient(145deg,rgba(18,89,52,.6),var(--bg-card) 58%); }
        .cup-hero::after { content:''; position:absolute; right:-3rem; bottom:-4rem; width:11rem; height:11rem; border:1px solid rgba(198,166,100,.2); border-radius:50%; box-shadow:inset 0 0 0 16px rgba(18,89,52,.18); pointer-events:none; }
        .cup-eyebrow { color:var(--accent-gold-light); font-size:.62rem; font-weight:900; letter-spacing:.14em; }
        .cup-title { position:relative; z-index:1; margin:.35rem 0 0; font:700 2.75rem/.9 'Teko',sans-serif; letter-spacing:.04em; }
        .cup-title span { display:inline; }
        .cup-subtitle { position:relative; z-index:1; margin-top:.38rem; color:#c5d4c9; font-size:.7rem; font-weight:800; letter-spacing:.07em; }
        .cup-hero-stats { position:relative; z-index:1; display:grid; grid-template-columns:repeat(3,1fr); gap:.4rem; margin-top:1.15rem; }
        .cup-hero-stat { padding:.5rem .25rem; border:1px solid rgba(255,255,255,.1); border-radius:10px; background:rgba(6,14,10,.34); text-align:center; }
        .cup-hero-stat b { display:block; color:var(--accent-gold-light); font:700 1.32rem/1 'Teko',sans-serif; }
        .cup-hero-stat span { display:block; margin-top:.18rem; color:var(--text-muted); font-size:.55rem; font-weight:800; letter-spacing:.05em; }
        .cup-section { margin-top:1.25rem; }
        .cup-section-title { margin:0 0 .6rem; font-size:.9rem; font-weight:900; }
        .cup-format-card { padding:.1rem .85rem; border:1px solid var(--border-color); border-radius:14px; background:var(--bg-card); }
        .cup-stage { display:grid; grid-template-columns:30px 1fr; gap:.65rem; padding:.85rem 0; }
        .cup-stage + .cup-stage { border-top:1px solid var(--border-color); }
        .cup-stage-number { display:grid; place-items:center; align-self:start; width:30px; height:30px; border-radius:9px; background:rgba(198,166,100,.12); color:var(--accent-gold-light); font:700 1rem/1 'Teko',sans-serif; }
        .cup-guide-panel .cup-format-card { position:relative; overflow:hidden; border-color:rgba(198,166,100,.24); background:linear-gradient(145deg,rgba(18,89,52,.13),var(--bg-card) 46%); }
        .cup-guide-panel .cup-format-card::before { content:'TOURNAMENT FORMAT'; display:block; padding:.7rem 0 .2rem; color:var(--accent-gold-light); font:700 .67rem/1 'Teko',sans-serif; letter-spacing:.16em; }
        .cup-guide-panel .cup-stage { grid-template-columns:34px minmax(0,1fr); gap:.75rem; padding:1rem 0; }
        .cup-guide-panel .cup-stage-number { width:34px; height:34px; border:1px solid rgba(198,166,100,.24); border-radius:10px; background:rgba(198,166,100,.09); font-size:1.08rem; letter-spacing:.04em; }
        .cup-guide-panel .cup-stage b { display:block; margin:.05rem 0 .38rem; color:#f5f6f8; font-family:'M PLUS 1p','Noto Sans JP',sans-serif; font-size:.82rem; font-weight:900; line-height:1.4; letter-spacing:.045em; }
        .cup-guide-panel .cup-stage p { margin:0; color:#b9c0ca; font-family:'Noto Sans JP',sans-serif; font-size:.72rem; font-weight:500; line-height:1.72; letter-spacing:.018em; text-wrap:pretty; }
        .cup-rule-list { padding:.05rem .85rem; border:1px solid var(--border-color); border-radius:14px; background:var(--bg-card); }
        .cup-rule { padding:.75rem 0; color:#d7dbe2; font-size:.72rem; line-height:1.5; }
        .cup-rule + .cup-rule { border-top:1px solid var(--border-color); }
        .cup-rule b { color:var(--accent-gold-light); }
        .cup-hero { min-height:220px; padding-left:130px; }
        .cup-hero-image { position:absolute; left:14px; top:50%; width:102px; height:102px; border-radius:18px; object-fit:cover; transform:translateY(-50%); box-shadow:0 12px 28px rgba(0,0,0,.35); }
        .cup-hub-tabs { display:flex; gap:.35rem; margin-top:1rem; overflow-x:auto; scrollbar-width:none; }
        .cup-hub-tab { flex:0 0 auto; padding:.55rem .75rem; border:1px solid var(--border-color); border-radius:9px; background:var(--bg-card); color:var(--text-muted); font:800 .68rem/1 inherit; }
        .cup-hub-tab.active { border-color:rgba(198,166,100,.55); background:rgba(198,166,100,.13); color:var(--accent-gold-light); }
        .cup-panel { display:none; margin-top:1rem; }
        .cup-panel.active { display:block; animation:fadeIn .2s ease; }
        .cup-group-switcher { display:flex; gap:.35rem; margin-bottom:.7rem; }
        .cup-group-switcher button { flex:1; padding:.5rem; border:1px solid var(--border-color); border-radius:9px; background:transparent; color:var(--text-muted); font-weight:800; font-size:.7rem; }
        .cup-group-switcher button.active { background:rgba(18,89,52,.45); border-color:rgba(58,150,92,.62); color:#d8f3df; }
        .cup-standing-row { display:grid; grid-template-columns:24px 1fr 28px 32px 36px; gap:.35rem; align-items:center; padding:.62rem 0; border-bottom:1px solid var(--border-color); font-size:.7rem; }
        .cup-standing-row:last-child { border-bottom:0; }
        .cup-standing-rank { color:var(--accent-gold-light); font-weight:900; }
        .cup-standing-team { display:flex; min-width:0; align-items:center; gap:.42rem; font-weight:800; }
        .cup-standing-team img { width:21px; height:21px; object-fit:contain; }
        .cup-standing-team span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .cup-match-list { display:grid; gap:.55rem; }
        .cup-match-card { padding:.7rem; border:1px solid var(--border-color); border-radius:12px; background:var(--bg-card); }
        .cup-match-meta { display:flex; justify-content:space-between; margin-bottom:.55rem; color:var(--text-muted); font-size:.6rem; font-weight:900; letter-spacing:.06em; }
        .cup-match-line { display:grid; grid-template-columns:1fr auto 1fr; gap:.45rem; align-items:center; }
        .cup-match-team { display:flex; min-width:0; align-items:center; gap:.38rem; font-size:.68rem; font-weight:800; }
        .cup-match-team.away { justify-content:flex-end; text-align:right; }
        .cup-match-team img { width:24px; height:24px; object-fit:contain; }
        .cup-match-score { min-width:50px; padding:.35rem .25rem; border-radius:8px; background:#090e0c; color:var(--accent-gold-light); text-align:center; font:800 .95rem/1 'Teko',sans-serif; }
        .cup-match-action { width:100%; margin-top:.6rem; padding:.46rem; border:1px solid rgba(198,166,100,.42); border-radius:8px; background:transparent; color:var(--accent-gold-light); font-size:.64rem; font-weight:900; }
        .cup-bracket { display:grid; grid-template-columns:repeat(3,minmax(142px,1fr)); gap:.7rem; overflow-x:auto; padding-bottom:.25rem; }
        .cup-bracket-column { min-width:142px; }
        .cup-bracket-heading { margin:0 0 .5rem; color:var(--text-muted); font-size:.58rem; font-weight:900; letter-spacing:.08em; }
        .cup-bracket-match { margin-bottom:.65rem; padding:.55rem; border:1px solid var(--border-color); border-radius:10px; background:var(--bg-card); }
        .cup-bracket-team { display:flex; justify-content:space-between; gap:.3rem; padding:.25rem 0; color:var(--text-main); font-size:.64rem; font-weight:800; }
        .cup-bracket-team + .cup-bracket-team { border-top:1px solid rgba(255,255,255,.06); }
        .cup-qualifier-note { padding:.8rem; border:1px dashed rgba(198,166,100,.4); border-radius:12px; color:var(--text-muted); font-size:.7rem; line-height:1.55; }
        .cup-record-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:.4rem; }
        .cup-record-card { padding:.7rem .35rem; border:1px solid var(--border-color); border-radius:11px; background:var(--bg-card); text-align:center; }
        .cup-record-card b { display:block; overflow:hidden; color:var(--text-main); font-size:.68rem; text-overflow:ellipsis; white-space:nowrap; }
        .cup-record-card span { display:block; margin-top:.23rem; color:var(--accent-gold-light); font-size:.62rem; font-weight:900; }
        @media (max-width:480px) { .cup-title { max-width:100%; font-size:clamp(1.9rem,9vw,2.35rem); line-height:.82; letter-spacing:.025em; } .cup-title span { display:block; } }
        @media (max-width:360px) { .cup-hero { padding-left:108px; } .cup-hero-image { width:82px; height:82px; } .cup-title { font-size:1.9rem; } }

        /* 規約 */
        .rule-chapter { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 0.6rem; overflow: hidden; }

        .roster-player-list { gap:.38rem; margin-top:0; }
        .roster-player-card { min-height:54px; gap:.6rem; padding:.65rem .7rem; border-radius:12px; background:var(--bg-elevated); }
        .roster-player-index { width:24px; color:var(--text-muted); font-size:1rem; }
        .roster-player-name { font-size:.84rem; }
        .roster-player-tags { margin-top:.22rem; }
        .roster-player-tags span { border-radius:999px; padding:.15rem .38rem; font-size:.56rem; }
        .roster-player-tags .position { min-width:30px; text-align:center; }
        .roster-empty { padding:.9rem; border:1px dashed var(--border-color); border-radius:12px; color:var(--text-muted); text-align:center; font-size:.72rem; }

        /* News composer: clear editorial workflow */
        .news-composer-header { padding:1rem; margin:-.15rem -.15rem 1rem; border:1px solid rgba(198,166,100,.24); border-radius:16px; background:linear-gradient(145deg,rgba(198,166,100,.13),var(--bg-card) 62%); }
        .news-composer-kicker { color:var(--accent-gold); font-size:.64rem; font-weight:900; letter-spacing:.12em; }
        .news-composer-title { margin-top:.26rem; font-family:'Teko',sans-serif; font-size:1.9rem; line-height:1; }
        .news-composer-copy { margin-top:.38rem; color:var(--text-muted); font-size:.72rem; line-height:1.5; }
        .news-composer-section { margin-top:1rem; }
        .news-composer-section-heading { display:flex; align-items:center; justify-content:space-between; margin-bottom:.55rem; font-size:.78rem; font-weight:900; }
        .news-composer-section-heading small { color:var(--text-muted); font-size:.61rem; font-weight:700; }
        .news-composer-panel { padding:.8rem; border:1px solid var(--border-color); border-radius:12px; background:var(--bg-card); }
        .news-composer-meta { display:grid; grid-template-columns:1fr 1fr; gap:.55rem; }
        .news-composer-field { margin:0; }
        .news-composer-field.is-wide { grid-column:1 / -1; }
        .news-composer-field .form-label { font-size:.66rem; letter-spacing:.04em; }
        .news-composer-field .form-input, .news-composer-field .form-select, .news-composer-field .form-textarea { min-height:40px; border-radius:10px; background:#0b0f14; font-size:.82rem; }
        .news-composer-field .form-textarea { min-height:160px; resize:vertical; line-height:1.6; }
        .news-composer-publish-note { display:flex; gap:.5rem; align-items:flex-start; margin-top:.75rem; padding:.7rem .75rem; border-radius:10px; background:rgba(255,255,255,.035); color:var(--text-muted); font-size:.66rem; line-height:1.5; }
        .news-composer-publish-note::before { content:''; width:6px; height:6px; margin-top:.28rem; flex:0 0 auto; border-radius:50%; background:var(--accent-gold); }
        .news-composer-submit { min-height:46px; margin-top:.75rem; border-radius:12px; }
        @media (max-width:380px) { .news-composer-meta { grid-template-columns:1fr; } }
        #teams-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:.55rem; }
        .team-directory-card { position:relative; display:flex; min-width:0; min-height:132px; margin:0; padding:.5rem .38rem .65rem; overflow:hidden; flex-direction:column; align-items:center; border:1px solid rgba(255,255,255,.08); border-radius:16px; background:linear-gradient(155deg,rgba(255,255,255,.045),rgba(255,255,255,.012) 58%),var(--bg-card); color:var(--text-main); font:inherit; text-align:center; cursor:pointer; isolation:isolate; }
        .team-directory-card::before { content:''; position:absolute; z-index:-1; top:-44px; left:50%; width:108px; height:108px; border-radius:50%; background:radial-gradient(circle,rgba(198,166,100,.15),transparent 67%); transform:translateX(-50%); }
        .team-directory-card::after { content:''; position:absolute; top:0; left:18%; right:18%; height:2px; border-radius:0 0 999px 999px; background:linear-gradient(90deg,transparent,var(--accent-gold),transparent); opacity:.65; }
        .team-directory-card:active { transform:scale(.975); border-color:rgba(198,166,100,.4); }
        .team-directory-rank { align-self:flex-start; color:var(--text-muted); font:700 .62rem/1 'Teko',sans-serif; letter-spacing:.08em; }
        .team-directory-rank b { margin-left:.16rem; color:var(--accent-gold-light); font-size:.83rem; }
        .team-directory-crest { display:grid; width:55px; height:55px; margin-top:.05rem; overflow:hidden; place-items:center; border:1px solid rgba(255,255,255,.09); border-radius:50%; background:rgba(6,9,13,.55); box-shadow:0 9px 20px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.05); }
        .team-directory-logo { width:43px; height:43px; flex:0 0 auto; border-radius:50%; clip-path:circle(50% at 50% 50%); object-fit:cover; }
        .team-directory-name { display:-webkit-box; min-height:2.35em; margin-top:.42rem; overflow:hidden; color:var(--text-main); font-size:.67rem; font-weight:900; line-height:1.18; letter-spacing:-.01em; -webkit-box-orient:vertical; -webkit-line-clamp:2; }
        .team-directory-meta { display:flex; margin-top:auto; align-items:baseline; gap:.16rem; color:var(--accent-gold-light); font:700 .9rem/1 'Teko',sans-serif; white-space:nowrap; }
        .team-directory-meta small { color:var(--text-muted); font:.55rem/1 'Noto Sans JP',sans-serif; letter-spacing:.06em; }
        @media (max-width:360px) {
            header { padding-left:.6rem; padding-right:.6rem; }
            .fnl-brand-sub, #sync-text-status { display:none; }
            .sync-badge { padding:6px; }
            .current-page-title { max-width:92px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        }
        @media (max-width:340px) {
            #teams-grid { gap:.38rem; }
            .team-directory-card { min-height:122px; padding:.45rem .24rem .55rem; border-radius:13px; }
            .team-directory-crest { width:49px; height:49px; }
            .team-directory-logo { width:38px; height:38px; }
            .team-directory-name { font-size:.6rem; }
            .team-directory-meta { font-size:.8rem; }
        }
        /* FNL MATCHDAY UI -------------------------------------------------
           閲覧時は情報を主役にし、編集操作は同じ画面でも明確に区別する。
           色ではなく余白・文字サイズ・面の高さで情報階層を作る。 */
        :root {
            --bg-body:#090d12;
            --bg-card:#11171f;
            --bg-elevated:#171e27;
            --border-color:rgba(255,255,255,.075);
            --text-main:#f4f6f8;
            --text-muted:#87909d;
            --accent-gold:#c8a861;
            --accent-gold-light:#e0c680;
            --nav-height:68px;
            --header-height:60px;
        }
        html { background:#05070a; }
        body { letter-spacing:.005em; }
        header {
            padding-right:14px;
            padding-left:14px;
            background:rgba(9,13,18,.94);
            border-bottom-color:rgba(255,255,255,.06);
            backdrop-filter:blur(20px) saturate(130%);
        }
        .header-logo-wrap { gap:10px; }
        .fnl-logo-header { width:32px; height:32px; border-radius:8px; }
        .fnl-brand-title { font-size:1.36rem; letter-spacing:.045em; }
        .fnl-brand-sub { margin-top:1px; font-size:.5rem; letter-spacing:.11em; }
        .current-page-title {
            max-width:88px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
            padding:0; border:0; background:transparent; color:var(--text-muted);
            font-size:.61rem; letter-spacing:.09em;
        }
        .sync-badge { padding:5px 8px; border-color:rgba(255,255,255,.06); background:var(--bg-card); }
        .sync-dot.online { box-shadow:none; }
        .container { padding:18px 16px 24px; }
        .page.active { animation:fnlPageIn .2s ease both; }
        @keyframes fnlPageIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }

        .section-header { min-height:32px; margin-bottom:12px; }
        .section-title {
            gap:9px; color:var(--text-main); font-family:'M PLUS 1p','Noto Sans JP',sans-serif;
            font-size:1rem; font-weight:900; letter-spacing:.015em;
        }
        .section-title::before { width:3px; height:18px; border-radius:999px; background:var(--accent-gold); }
        .card,.match-card-mobile,.metric-card,.market-step,.rule-chapter,
        .transfer-status-card,.transfer-summary-card,.roster-team-card,.roster-player-card,
        .cup-match-card,.cup-record-card,.cup-format-card,.cup-rule-list,.event-entry-card,
        .match-center-core,.match-center-lineup,.match-center-events,.history-card,.recovery-card {
            border-color:var(--border-color); border-radius:14px; background:var(--bg-card); box-shadow:none;
        }
        .card { padding:15px; margin-bottom:16px; }
        .btn-primary,.btn-secondary,.edit-score-btn,.share-action-btn {
            min-height:42px; border-radius:11px; box-shadow:none; font-weight:800;
        }
        .btn-primary { border:1px solid var(--accent-gold); background:var(--accent-gold); color:#111318; }
        .btn-secondary,.edit-score-btn,.share-action-btn { border:1px solid var(--border-color); background:var(--bg-elevated); color:var(--text-main); }
        button:focus-visible,.card[onclick]:focus-visible,.news-item:focus-visible,.team-directory-card:focus-visible {
            outline:2px solid var(--accent-gold); outline-offset:2px;
        }
        .form-label { color:#aab1bb; font-size:.72rem; }
        .form-input,select,textarea { min-height:44px!important; border-radius:11px!important; background:#0c1117!important; }

        /* ホーム：スコア、順位、ニュースへ自然に視線が流れる密度 */
        #page-home { gap:14px; }
        #page-home .hero-banner {
            position:relative; padding:16px; border:1px solid var(--border-color); border-radius:16px;
            background:var(--bg-card); overflow:hidden;
        }
        #page-home .hero-banner::after {
            content:''; position:absolute; right:0; top:0; width:3px; height:100%; background:var(--accent-gold); opacity:.7;
        }
        #page-home .hero-logo-large { width:56px; height:56px; border-radius:12px; }
        #page-home .hero-subtitle { color:var(--accent-gold); font-size:.56rem; }
        #page-home .hero-title { font-size:1.72rem; letter-spacing:.035em; }
        .home-hero-description { font-size:.62rem; }
        #page-home .dashboard-grid { gap:8px; }
        #page-home .metric-card { min-height:92px; padding:12px 7px; border-radius:13px; }
        .metric-label { font-size:.58rem; letter-spacing:.025em; }
        .metric-value { color:var(--text-main); font-size:1.3rem; }
        #page-home .home-progress-card .metric-value { color:var(--accent-gold-light); }
        .home-metric-logo { width:28px; height:28px; background:transparent; }
        #page-home .match-card-mobile { padding:14px; border-color:var(--border-color)!important; }
        .match-card-mobile { overflow:hidden; }
        .match-score-pill { border:1px solid rgba(200,168,97,.3); border-radius:10px; background:#090d12; color:var(--text-main); }
        .home-news-heading { margin:0; }
        #page-home .news-feed { padding:2px 12px; border:1px solid var(--border-color); }

        /* 共通の切替。大きなページ切替と小さなランキング切替を別の階層にする */
        .tab-bar { gap:4px; padding:4px; border-radius:13px; background:#0c1117; }
        .tab-button { min-height:40px; border-radius:9px; font-size:.7rem; }
        .tab-button.active { background:var(--bg-elevated); color:var(--text-main); box-shadow:inset 0 -2px 0 var(--accent-gold); }
        .ranking-tab-bar { gap:6px; }
        .ranking-tab-bar .tab-button { min-height:34px; border-radius:9px; background:transparent; }
        .ranking-tab-bar .tab-button.active { border-color:rgba(200,168,97,.45); background:rgba(200,168,97,.08); color:var(--accent-gold-light); box-shadow:none; }

        /* 試合一覧・順位表 */
        .mw-selector { scrollbar-width:none; }
        .mw-chip,.chip { min-height:36px; border-radius:10px!important; }
        .match-card-top { padding-bottom:7px; border-bottom:1px solid var(--border-color); }
        .match-status,.status-badge { border-radius:7px; letter-spacing:.035em; }
        .standings-table { border-collapse:separate; border-spacing:0; }
        .standings-table th { height:32px; color:#747e8b; font-size:.6rem; letter-spacing:.035em; }
        .standings-table td { height:48px; border-bottom-color:rgba(255,255,255,.055); }
        .standings-table tbody tr { position:relative; }
        .standings-table tbody tr td:first-child { border-left:3px solid transparent; }
        .standings-table tbody tr:nth-child(1) td:first-child { border-left-color:var(--accent-gold); }
        .ranking-row { min-height:48px; }

        /* チーム一覧と詳細 */
        .team-directory-card {
            min-height:126px; padding:12px 8px; border-radius:15px;
            background:var(--bg-card); border-color:var(--border-color);
        }
        .team-directory-card::before,.team-directory-card::after { display:none; }
        .team-directory-logo-shell { background:transparent!important; border:0!important; }
        .team-directory-card:active { border-color:rgba(200,168,97,.38); }
        .team-sheet-hero,.roster-sheet-hero,.news-composer-header {
            border-color:var(--border-color); background:var(--bg-card); border-radius:16px;
        }
        .team-sheet-hero .team-logo-lg { width:80px!important; height:80px!important; }
        .roster-position-header { color:var(--text-main); }
        .roster-position-header::before { background:var(--accent-gold); }

        /* ニュース：一般的なニュースアプリ同様、見出しと発信元を優先 */
        #page-news .news-feed { padding:2px 14px; border:1px solid var(--border-color); border-radius:14px; }
        .news-item { min-height:82px; padding:14px 0; }
        .news-title { color:var(--text-main); font-size:.83rem; line-height:1.5; }
        .news-category { border:0!important; background:rgba(200,168,97,.1)!important; color:var(--accent-gold-light)!important; }
        .news-page-button { border-radius:9px; background:transparent; }
        .news-page-button.active { border-color:var(--accent-gold); background:var(--accent-gold); color:#111318; }

        /* マッチセンター：入力順は維持しつつ、一つの業務フォームに見せる */
        .match-center-header { margin-bottom:12px; }
        .match-center-scoreboard { padding:16px 12px; border-color:var(--border-color); background:var(--bg-card); }
        .match-center-core { padding:14px; }
        .match-center-core-label { color:var(--text-muted); letter-spacing:.06em; }
        .match-center-save-bar { padding:12px; border-color:rgba(200,168,97,.3); background:#0d1218; }
        .match-step { border-radius:14px; }
        .match-step::before { background:rgba(200,168,97,.12); }
        .match-review { border-color:rgba(200,168,97,.28); background:var(--bg-card); }

        /* 閲覧と運営の境界 */
        .edit-mode-button { min-height:34px; border-radius:9px; background:var(--bg-card); }
        body.edit-mode header { border-bottom-color:rgba(200,168,97,.38); }
        body.edit-mode .edit-mode-button { background:var(--accent-gold); border-color:var(--accent-gold); color:#111318; }
        .view-mode-note { padding:10px 12px; border-radius:11px; background:#0d1218; }
        .transfer-quick-guide,.market-note { background:#0d1218; border-color:var(--border-color); }

        /* 下部ナビ：主要5機能を親指で迷わず選べる */
        .bottom-nav {
            padding:5px 8px env(safe-area-inset-bottom,0px); background:rgba(9,13,18,.97);
            border-top-color:rgba(255,255,255,.07); backdrop-filter:blur(20px) saturate(130%);
        }
        .nav-item { min-width:0; gap:3px; color:#77818e; font-size:.58rem; }
        .nav-svg-icon { width:21px; height:21px; stroke-width:1.75; }
        .nav-item.active { color:var(--text-main); }
        .nav-item.active .nav-svg-icon { color:var(--accent-gold); }
        .nav-item.active::before { top:0; width:24px; height:2px; background:var(--accent-gold); }
        .more-menu-grid { gap:10px; }
        .more-menu-button { min-height:88px; border-radius:13px; background:var(--bg-card); }

        .sheet-overlay { background:rgba(0,0,0,.7); backdrop-filter:blur(4px); }
        .sheet-content { border-top:1px solid var(--border-color); border-radius:20px 20px 0 0; background:#0e141b; }
        .sheet-close-button { min-height:40px; padding:0 12px; border-radius:10px; background:var(--bg-elevated); }

        /* 勝敗以外で彩度の高い色を増やさない */
        .win,.result-win { color:#58b985!important; }
        .lose,.result-lose { color:#dd6b72!important; }
        .draw,.result-draw { color:var(--text-muted)!important; }
        @media (max-width:360px) {
            .container { padding-right:12px; padding-left:12px; }
            .fnl-brand-sub { display:none; }
            .sync-badge { padding-right:6px; padding-left:6px; }
            #page-home .hero-title { font-size:1.5rem; }
            #page-home .metric-card { min-height:86px; }
            .nav-item { font-size:.54rem; }
        }
        @media (prefers-reduced-motion:reduce) {
            *,*::before,*::after { scroll-behavior:auto!important; animation-duration:.01ms!important; transition-duration:.01ms!important; }
        }

        @media (min-width:481px) {
            body { box-shadow:0 0 48px rgba(0,0,0,.5); }
            header, .bottom-nav { border-left:1px solid rgba(255,255,255,.05); border-right:1px solid rgba(255,255,255,.05); }
        }

        /* Standalone Hirabayashi Cup app: only the tournament is displayed. */
        :root { --bg-body:#0c1410; --bg-card:#142119; --bg-elevated:#1a2a20; --border-color:rgba(191,171,119,.17); --accent-gold:#a89463; --accent-gold-light:#d7c89b; --text-main:#f0f1e9; --text-muted:#a8b1a5; }
        body { background:linear-gradient(180deg,#111a15 0%,#0a100d 100%); }
        header { background:#111b15; border-bottom:1px solid rgba(191,171,119,.18); }
        .bottom-nav, main.container > section:not(#page-cup) { display:none!important; }
        main.container { padding-bottom:1.25rem; }
        #page-cup.active { display:block; }
        #page-cup { min-height:calc(100vh - var(--header-height) - 1.25rem); }
        #page-cup .cup-hero { min-height:0!important; padding:1.1rem!important; border:1px solid rgba(191,171,119,.3); background:linear-gradient(145deg,#1d3425,#122017); box-shadow:0 12px 28px rgba(0,0,0,.2); text-align:center; }
        #page-cup .cup-hero::after { right:-3rem; bottom:-4rem; inset:auto; opacity:.45; }
        #page-cup .cup-hero > * { position:relative; z-index:1; }
        #page-cup .cup-hero-image { position:static!important; display:block; width:86px!important; height:86px!important; margin:0 auto .65rem; transform:none!important; filter:drop-shadow(0 8px 12px rgba(0,0,0,.34)); }
        #page-cup .cup-title { font-size:clamp(2.05rem,9vw,2.7rem)!important; line-height:.9; }
        #page-cup .cup-title span { display:block!important; }
        #page-cup .cup-hero-stats { margin-top:.9rem; }
        #page-cup .cup-hub-tabs { padding:.28rem; border:1px solid rgba(191,171,119,.18); border-radius:12px; background:#101a14; }
        #page-cup .cup-hub-tab.active { background:#a89463; color:#182117; box-shadow:none; }
        #page-cup .cup-match-card, #page-cup .cup-record-card, #page-cup .cup-bracket-match { background:#142119; }
        #page-cup .btn-primary { background:#a89463; color:#182117; box-shadow:none; }
    </style>
</head>
<body>
    <div id="orientation-lock" role="alert"><strong>縦画面でご利用ください</strong><span>このアプリは横画面に対応していません。端末を縦向きにしてください。</span></div>
    <!-- ヘッダー -->
    <header>
        <div class="header-logo-wrap">
            <img class="fnl-logo-header" src="./hirabayashi-cup.png" alt="平林杯ロゴ">
            <div class="fnl-brand-text">
                <span class="fnl-brand-title">平林杯</span>
                <span class="fnl-brand-sub">HIRABAYASHI CUP</span>
            </div>
        </div>

        <div class="header-right-status">
            <div class="sync-badge" id="sync-status-badge" data-state="loading">
                <span class="sync-dot" id="sync-dot-indicator"></span>
                <span><span id="sync-text-status">大会データを読み込み中</span><span class="save-status-time" id="sync-saved-at"></span></span>
            </div>
            <div class="current-page-title" id="page-title-display">平林杯</div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="container">

        <!-- PAGE 1: HOME -->
        <section id="page-home" class="page" hidden aria-hidden="true">
            <div class="hero-banner">
                <img class="hero-logo-large" src="./fnl-logo.png" alt="FNL ロゴ">
                <div class="home-hero-copy"><div class="hero-subtitle" id="current-season-label">SEASON 1 - 2026</div><div class="hero-title">FOOTBALL NINE LEAGUE</div><p class="home-hero-description">9クラブ公式ポータル</p></div>
            </div>
            <div id="home-dashboard" class="dashboard-grid"></div>
            <div class="match-card-mobile" style="background: var(--bg-card); border-color: rgba(198, 166, 100, 0.4);" id="home-featured-match"></div>
            <div class="home-news-heading"><strong>最新ニュース</strong></div>
            <div class="card news-feed" id="home-news-preview"></div>
        </section>

        <!-- PAGE 2: STANDINGS -->
        <section id="page-standings" class="page" hidden>
            <div class="section-header">
                <div class="section-title">順位表・記録</div>
                <button class="share-action-btn" onclick="generateLineStandingsShareText()">順位表を共有</button>
            </div>
            <div class="tab-bar">
                <button class="tab-button active" data-stats-tab="teams" onclick="switchStatsView('teams',this)">チーム順位</button>
                <button class="tab-button" data-stats-tab="players" onclick="switchStatsView('players',this)">選手ランキング</button>
                <button class="tab-button" data-stats-tab="seasons" onclick="switchStatsView('seasons',this)">シーズン記録</button>
            </div>
            <div class="stats-pane active" id="stats-pane-teams"><div class="card" id="standings-card"></div></div>
            <div class="stats-pane" id="stats-pane-players">
                <div class="ranking-switch-label">表示項目</div>

            { chapter: '第2章 クラブ', articles: [{ title: '第2条（参加クラブ）', text: '参加クラブは原則として以下の9クラブとする。<ul class="rule-list"><li>FC Koshi</li><li>MGR United</li><li>BAYASHI JAPAN</li><li>Katsukou FC</li><li>Manchester Cow</li><li>Koganei 3KSC</li><li>YSC YOSHIDA</li><li>Kasuga United</li><li>FC ARG</li></ul><div class="rule-article-title">オーナー</div>クラブオーナー（参加者）は原則変更しない。<div class="rule-article-title">クラブ名称</div>クラブ名を変更する場合は、事前に運営へ申請し承認を得るものとする。<div class="rule-article-title">エンブレム</div>クラブは独自のエンブレムを保有する。<div class="rule-article-title">ユニフォーム</div>各クラブはシーズン開始前までにホーム・アウェイ（必要に応じてサード）ユニフォームを運営へ提出する。<div class="rule-article-title">ホームスタジアム</div>各クラブはホームスタジアムを設定する。<div class="rule-article-title">クラブ解散</div>クラブの解散は原則認めない。' }] },
            { chapter: '第3章 参加者', articles: [{ title: '第3条（参加資格）', text: '運営が認めたクラブのみ参加できる。<div class="rule-article-title">シーズン途中離脱</div>シーズン途中での脱退は禁止する。' }] },
            { chapter: '第4章 試合', articles: [{ title: '第4条（使用ゲーム）', text: 'eFootball' }, { title: '第5条（試合設定）', text: '<ul class="rule-list"><li>試合時間：10分</li><li>コンディション：ランダム</li><li>スマートアシスト：OFF</li></ul><div class="rule-article-title">PK戦・延長戦</div>カップ戦では必要に応じて延長戦・PK戦を実施する。' }, { title: '第6条（回線切断）', text: '<div class="rule-article-title">故意による切断</div>故意に回線を切断した場合、運営が試合状況を確認し、必要に応じて再試合または0-3没収試合など適切な裁定を行う。<div class="rule-article-title">通信障害等</div>故意ではない場合、切断時点までの得点を有効とし、中断した時間から再試合を行う。その他のケースは運営が裁定する。' }] },
            { chapter: '第5章 リーグ戦', articles: [{ title: '第7条（試合方式）', text: '<ul class="rule-list"><li>ホーム＆アウェイ方式</li><li>各クラブ16試合</li><li>各節1クラブは試合なし（休み）</li></ul>' }, { title: '第8条（Matchweek）', text: '1週間で2節消化する。' }, { title: '第9条（勝点）', text: '勝利: 3点 / 引分: 1点 / 敗戦: 0点' }, { title: '第10条（順位決定）', text: '順位は以下の順で決定する。<ol class="rule-list"><li>勝点</li><li>得失点差</li><li>総得点</li><li>当該対戦結果</li></ol>' }] },
            { chapter: '第6章 試合運営', articles: [{ title: '第11条（試合告知）', text: 'FNL公式LINEにて試合日程を告知する。<div class="rule-article-title">告知内容</div><ul class="rule-list"><li>開催日時</li><li>Discordライブ配信の有無</li><li>開催場所</li><li>対戦カード</li></ul>' }, { title: '第12条（試合結果）', text: '試合終了後は「スコア画像」および「ハイライト動画・選手評価映像」を公式LINEへ提出する。' }] },
            { chapter: '第7章 選手登録・移籍', articles: [{ title: '第13条（選手登録）', text: '登録人数は25名までとする。選手名簿の追加・削除はシーズン準備期間中に行う。<div class="rule-article-title">特別カード選手</div>レジェンド・エピック・ショータイム・ビッグタイム選手は合計18名まで登録可能。<div class="rule-article-title">ノーマルカード選手</div>通常, POTS, POTW, POTD, ハイライト等のノーマルカード選手を7名以上登録すること。' }, { title: '第14条（トレード）', text: 'クラブ間トレードは両クラブの合意がある場合のみ成立する。トレードはシーズン中間移籍市場期間中のみ可能とする。' }, { title: '第15条（シーズン中間移籍市場）', text: 'MW9までの全試合終了後に自動的に開始し、MW10の最初の試合結果が登録されると終了する。「放出なし」「1名放出」「2名放出」「3名放出」を選択でき、放出人数と同数の補強が可能となる。指名順はリーグ順位の低いクラブから行う。トレードもこの期間中に行う。' }, { title: '第16条（シーズン終了移籍市場）', text: '全マッチウィークの試合終了後に自動的に開始し、次のシーズンを開始すると終了する。<div class="rule-article-title">プロテクト</div>各クラブはプロテクト選手を6名指定する（ドラフト対象外）。プロテクト対象は、そのシーズンのリーグ戦に10試合以上出場した選手に限る。<div class="rule-article-title">ドラフト</div><b>1巡目：</b>希望選手を全クラブ非公開で提出し、重複した場合は抽選を行う。<br><b>2巡目以降：</b>ウェーバー方式を採用する。指名順は 9→8→7→6→5→4→3→2→1 、次巡は 1→2→3→4→5→6→7→8→9 を繰り返す。' }] },
            { chapter: '第8章 カップ戦・大会特典', articles: [{ title: '第17条（平林杯）', text: '平林杯はシーズン終了後に開催する。大会運営は <b>BAYASHI JAPAN</b> が担当する（試合結果・大会管理はFNL公式では行わない）。' }, { title: '第18条（優勝特典）', text: '平林杯の成績に応じた特典：<ul class="rule-list"><li>優勝：翌シーズン プロテクト枠 ＋2</li><li>準優勝：翌シーズン プロテクト枠 ＋1</li></ul>' }] },
            { chapter: '第9章 表彰', articles: [{ title: '第19条（表彰）', text: 'シーズン終了後、<b>FNL Champion</b> および <b>シーズンMVP</b> を表彰する。' }] },
            { chapter: '第10章 メディア', articles: [{ title: '第20条（メディア）', text: '<div class="rule-article-title">FNL Official Media</div>試合告知、試合結果、公式声明を発信。<div class="rule-article-title">Club Media</div>各クラブは自由にニュース・インタビュー・クラブ情報等を発信できる。' }] },
            { chapter: '第11章 運営', articles: [{ title: '第21条（運営）', text: '運営権限はリーグ創設者が有する。' }] },
            { chapter: '第12章 懲戒規定', articles: [{ title: '第22条（懲戒規定）', text: '<div class="rule-article-title">禁止行為</div>参加者は、リーグの公平性を損なう次の行為（故意の回線切断、試合放棄、虚偽報告、不正行為・チート、暴言・誹謗中傷等）をしてはならない。<div class="rule-article-title">処分</div>違反行為が確認された場合、注意、試合の没収（0-3敗戦）、勝点剥奪、ドラフト指名権の制限、一定期間の出場停止、リーグ除名等の処分を科すことができる。' }] },
            { chapter: '第13章 規約改正', articles: [{ title: '第23条（規約改正）', text: '規約の追加・変更は参加クラブの賛成多数をもって成立する。審議中は新たな改正案を提出できない。<div class="rule-article-title">緊急措置</div>大型アップデートや障害等の緊急時は運営が暫定ルールを制定できる。' }] },
            { chapter: '第14章 リーグ理念', articles: [{ title: '第24条（リーグ理念）', text: 'Football Nine League（FNL）は、参加者全員が公平な競技環境のもとでeFootballを楽しみ、長期的に発展するリーグを目指す。すべての参加者は勝利を目指すとともに、互いを尊重し、フェアプレーの精神をもって大会へ参加するものとする。' }] }
        ];

        function createInitialRegulationState() {
            return {
                current: {
                    id: 'regulation-v1',
                    version: 1,
                    effectiveDate: '2026-07-23',
                    reason: 'FNL Season 1 初版',
                    publishedAt: '2026-07-23T00:00:00+09:00',
                    chapters: JSON.parse(JSON.stringify(FNL_REGULATIONS))
                },
                draft: null,
                history: []
            };
        }

        function ensureRegulationState() {
            if (!state.regulations || typeof state.regulations !== 'object') state.regulations = createInitialRegulationState();
            if (!state.regulations.current?.chapters?.length) state.regulations.current = createInitialRegulationState().current;
            if (!Array.isArray(state.regulations.history)) state.regulations.history = [];
            if (!Object.prototype.hasOwnProperty.call(state.regulations, 'draft')) state.regulations.draft = null;
            return state.regulations;
        }

        const CURRENT_CUP_GROUPS = {
            A: ['MGR United', 'YSC YOSHIDA', 'Koganei 3KSC'],
            B: ['Katsukou FC', 'Kasuga United', 'BAYASHI JAPAN'],
            C: ['FC Koshi', 'Manchester Cow', 'FC ARG']
        };

        function createCupGroupMatches(groups, previousMatches = []) {
            const previousByPair = new Map(previousMatches.map(match => [`${match.group}|${[match.h, match.a].sort().join('|')}`, match]));
            return Object.entries(groups).flatMap(([group, teams]) => [[0,1],[1,2],[2,0]].map(([home, away], index) => {
                const previous = previousByPair.get(`${group}|${[teams[home], teams[away]].sort().join('|')}`);
                return previous ? { ...previous, id: `hc_g${group}_${index + 1}`, group, label: `GROUP ${group}`, h: teams[home], a: teams[away] }
                    : { id: `hc_g${group}_${index + 1}`, stage: 'group', group, label: `GROUP ${group}`, h: teams[home], a: teams[away], hs: null, as: null, pkWinner: '', details: { events: [], motm: null, appearances: { home: [], away: [] } } };
            }));
        }

        function createHirabayashiCupState() {
            const groups = JSON.parse(JSON.stringify(CURRENT_CUP_GROUPS));
            return {
                groups,
                groupMatches: createCupGroupMatches(groups),
                repechageMatches: [], knockoutMatches: [], activeTab: 'groups', activeGroup: 'A',
                groupDraw: { locked: true, method: 'fixed-2026', season: 1, currentFixedApplied: true, confirmedAt: '2026-08-12T00:00:00+09:00', standingsSnapshot: [] }
            };
        }

        function createPendingHirabayashiCupState(seasonNumber) {
            return {
                groups: { A: [], B: [], C: [] }, groupMatches: [], repechageMatches: [], knockoutMatches: [], activeTab: 'groups', activeGroup: 'A',
                groupDraw: { locked: false, method: 'ranked-pots', season: Number(seasonNumber || 1), confirmedAt: '', standingsSnapshot: [] }
            };
        }

        function ensureHirabayashiCupState() {
            if (!state.hirabayashiCup || typeof state.hirabayashiCup !== 'object') state.hirabayashiCup = createHirabayashiCupState();
            const cup = state.hirabayashiCup;
            const fallback = createHirabayashiCupState();
            if (!cup.groups || typeof cup.groups !== 'object') cup.groups = fallback.groups;
            if (!Array.isArray(cup.groupMatches)) cup.groupMatches = fallback.groupMatches;
            if (!Array.isArray(cup.repechageMatches)) cup.repechageMatches = [];
            if (!Array.isArray(cup.knockoutMatches)) cup.knockoutMatches = [];
            if (!cup.activeTab) cup.activeTab = 'groups';
            if (!cup.activeGroup) cup.activeGroup = 'A';
            if (!cup.groupDraw || typeof cup.groupDraw !== 'object') cup.groupDraw = { locked: false, method: 'legacy', season: Number(state.seasonInfo?.number || 1), confirmedAt: '', standingsSnapshot: [] };
            const currentSeason = Number(state.seasonInfo?.number || 1);
            if (currentSeason === 1 && !cup.groupDraw.currentFixedApplied) {
                cup.groups = JSON.parse(JSON.stringify(CURRENT_CUP_GROUPS));
                cup.groupMatches = createCupGroupMatches(cup.groups, cup.groupMatches);
                cup.repechageMatches = [];
                cup.knockoutMatches = [];
                cup.groupDraw = { locked: true, method: 'fixed-2026', season: 1, currentFixedApplied: true, confirmedAt: new Date().toISOString(), standingsSnapshot: [] };
            }
            return cup;
        }

        // アプリ状態
        const state = {
            schedule: JSON.parse(JSON.stringify(INITIAL_SCHEDULE)),
            news: JSON.parse(JSON.stringify(INITIAL_NEWS)),
            rosters: {},
            transferMarket: { releasePlans: {} },
            activityLog: [],
            seasonArchive: [],
            seasonInfo: { number: 1, year: 2026 },
            regulations: createInitialRegulationState(),
            hirabayashiCup: createHirabayashiCupState(),
            previousSeasonSnapshot: null,
            lastMatchSnapshot: null,
            currentFilterMw: 1,
            cachedStandings: null,
            standingsDirty: true,
            dbRef: null,
            dbSaveFn: null,
            lastSavedAt: null
        };

        const STORAGE_KEY = 'fnl-state-v1';

        function loadPersistedState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return;
                const parsed = JSON.parse(raw);
                if (parsed.schedule) state.schedule = parsed.schedule;
                if (parsed.news) state.news = parsed.news;
                if (parsed.rosters) state.rosters = parsed.rosters;
                if (parsed.transferMarket) state.transferMarket = parsed.transferMarket;
                if (Array.isArray(parsed.activityLog)) state.activityLog = parsed.activityLog;
                if (Array.isArray(parsed.seasonArchive)) state.seasonArchive = parsed.seasonArchive;
                if (parsed.seasonInfo && typeof parsed.seasonInfo === 'object') state.seasonInfo = parsed.seasonInfo;
                if (parsed.regulations && typeof parsed.regulations === 'object') state.regulations = parsed.regulations;
                if (parsed.hirabayashiCup && typeof parsed.hirabayashiCup === 'object') state.hirabayashiCup = parsed.hirabayashiCup;
                if (Object.prototype.hasOwnProperty.call(parsed, 'previousSeasonSnapshot')) state.previousSeasonSnapshot = parsed.previousSeasonSnapshot;
                if (Object.prototype.hasOwnProperty.call(parsed, 'lastMatchSnapshot')) state.lastMatchSnapshot = parsed.lastMatchSnapshot;
                if (parsed.updatedAt) state.lastSavedAt = parsed.updatedAt;
                state.standingsDirty = true;
            } catch (e) {
                console.warn('State restore failed', e);
            }
        }

        function saveStateToStorage() {
            try {
                const payload = {
                    schedule: state.schedule,
                    news: state.news,
                    rosters: state.rosters,
                    transferMarket: state.transferMarket,
                    activityLog: state.activityLog,
                    seasonArchive: state.seasonArchive,
                    seasonInfo: state.seasonInfo,
                    regulations: state.regulations,
                    hirabayashiCup: state.hirabayashiCup,
                    previousSeasonSnapshot: state.previousSeasonSnapshot,
                    lastMatchSnapshot: state.lastMatchSnapshot,
                    updatedAt: state.lastSavedAt || new Date().toISOString()
                };
                const serialized = JSON.stringify(payload);
                localStorage.setItem(STORAGE_KEY, serialized);

                // データはFirebaseと端末内ストレージで管理し、URLは短く保つ
                window.history.replaceState({}, '', window.location.pathname);
            } catch (e) {
                console.warn('State save failed', e);
            }
        }

        function loadStateFromUrl() {
            try {
                const params = new URLSearchParams(window.location.search);
                const encoded = params.get('state');
                if (!encoded) return false;
                const serialized = typeof LZString !== 'undefined'
                    ? LZString.decompressFromEncodedURIComponent(encoded)
                    : decodeURIComponent(encoded);
                const parsed = JSON.parse(serialized);
                if (parsed.schedule) state.schedule = parsed.schedule;
                if (parsed.news) state.news = parsed.news;
                if (parsed.rosters) state.rosters = parsed.rosters;
                if (parsed.transferMarket) state.transferMarket = parsed.transferMarket;
                if (Array.isArray(parsed.activityLog)) state.activityLog = parsed.activityLog;
                if (Array.isArray(parsed.seasonArchive)) state.seasonArchive = parsed.seasonArchive;
                if (parsed.seasonInfo && typeof parsed.seasonInfo === 'object') state.seasonInfo = parsed.seasonInfo;
                if (parsed.regulations && typeof parsed.regulations === 'object') state.regulations = parsed.regulations;
                if (parsed.hirabayashiCup && typeof parsed.hirabayashiCup === 'object') state.hirabayashiCup = parsed.hirabayashiCup;
                if (Object.prototype.hasOwnProperty.call(parsed, 'previousSeasonSnapshot')) state.previousSeasonSnapshot = parsed.previousSeasonSnapshot;
                if (Object.prototype.hasOwnProperty.call(parsed, 'lastMatchSnapshot')) state.lastMatchSnapshot = parsed.lastMatchSnapshot;
                if (parsed.updatedAt) state.lastSavedAt = parsed.updatedAt;
                state.standingsDirty = true;
                if (typeof refreshAllViews === 'function') {
                    refreshAllViews();
                    renderNews();
                }
                return true;
            } catch (e) {
                console.warn('State load from URL failed', e);
                return false;
            }
        }

        function persistAppState() {
            state.lastSavedAt = state.lastSavedAt || new Date().toISOString();
            saveStateToStorage();
            window.setAppSaveStatus?.('未保存の変更あり', 'dirty');
            if (state.dbSaveFn) {
                return state.dbSaveFn();
            }
            return Promise.resolve();
        }

        function isEditMode() {
            return true;
        }

        function applyEditMode() {
            document.body.classList.add('edit-mode');
            ['schedule-assignment-button', 'add-player-button', 'add-market-player-button', 'midseason-draft-button',
                'midseason-preview-button', 'midseason-run-draft-button', 'undo-transfer-button', 'trade-listing-button',
                'trade-close-button', 'protection-register-button', 'end-draft-pick-button']
                .forEach(id => document.getElementById(id)?.classList.add('edit-only'));
        }

        function requireEditMode(action = 'この操作') {
            return true;
        }

        // クラブ名変更後も、保存済みの試合記録・規約・履歴を同じクラブとして表示する
        function normalizeStoredTeamNames(value) {
            if (typeof value === 'string') return value.replaceAll('小金井3KSC', 'Koganei 3KSC');
            if (Array.isArray(value)) return value.map(normalizeStoredTeamNames);
            if (value && typeof value === 'object') {
                Object.keys(value).forEach(key => { value[key] = normalizeStoredTeamNames(value[key]); });
            }
            return value;
        }

        window.normalizeFnlTeamNames = function() {
            ['schedule', 'news', 'activityLog', 'seasonArchive', 'seasonInfo', 'regulations', 'previousSeasonSnapshot', 'lastMatchSnapshot']
                .forEach(key => { state[key] = normalizeStoredTeamNames(state[key]); });
            state.standingsDirty = true;
        };

        loadPersistedState();
        loadStateFromUrl();
        ensureRegulationState();
        ensureHirabayashiCupState();
        window.normalizeFnlTeamNames();

        function getTeamLogo(name) {
            const t = RAW_TEAMS.find(item => item.name === name);
            return t ? t.logo : makeSvgBadge('FNL', '#334155', '#0f172a', 'shield');
        }

        function calculateStandings() {
            if (!state.standingsDirty && state.cachedStandings) return state.cachedStandings;

            const standingsMap = {};
            RAW_TEAMS.forEach(t => {
                standingsMap[t.name] = { name: t.name, logo: t.logo, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 };
            });

            state.schedule.forEach(m => {
                if (m.hs !== null && m.as !== null && !isNaN(m.hs) && !isNaN(m.as)) {
                    const hs = parseInt(m.hs, 10);
                    const as = parseInt(m.as, 10);
                    const home = standingsMap[m.h];
                    const away = standingsMap[m.a];
                    if (home && away) {
                        home.p += 1; away.p += 1; home.gf += hs; home.ga += as; away.gf += as; away.ga += hs;
                        if (hs > as) { home.w += 1; home.pts += 3; away.l += 1; }
                        else if (hs < as) { away.w += 1; away.pts += 3; home.l += 1; }
                        else { home.d += 1; home.pts += 1; away.d += 1; away.pts += 1; }
                        home.gd = home.gf - home.ga; away.gd = away.gf - away.ga;
                    }
                }
            });

            const list = Object.values(standingsMap);
            list.sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf);
            list.forEach((t, i) => t.rank = i + 1);

            state.cachedStandings = list;
            state.standingsDirty = false;
            return list;
        }

        // --- 画面ナビゲーション ---
        window.navigateTo = function(pageId, titleText, navEl) {
            document.querySelectorAll('.page').forEach(p => {
                p.classList.remove('active');
                p.hidden = true;
            });
            document.querySelectorAll('#bottom-nav-element .nav-item').forEach(n => {
                n.classList.remove('active');
                n.removeAttribute('aria-current');
            });

            const targetPage = document.getElementById(`page-${pageId}`);
            if (targetPage) {
                targetPage.hidden = false;
                targetPage.classList.add('active');
            }

            const pageTitleEl = document.getElementById('page-title-display');
            if (pageTitleEl) pageTitleEl.innerText = titleText;

            if (navEl) {
                navEl.classList.add('active');
                navEl.setAttribute('aria-current', 'page');
            } else {
                const matchedNav = document.querySelector(`#bottom-nav-element .nav-item[data-page="${pageId}"]`);
                if (matchedNav) {
                    matchedNav.classList.add('active');
                    matchedNav.setAttribute('aria-current', 'page');
                } else if (['transfer', 'news', 'rules', 'cup'].includes(pageId)) {
                    const moreNav = document.querySelector('#bottom-nav-element .nav-item[data-nav-more]');
                    moreNav?.classList.add('active');
                    moreNav?.setAttribute('aria-current', 'page');
                }
            }
            if (pageId === 'matches') {
                const latestMw = getLatestResultMatchweek();
                document.querySelectorAll('#matches-filter-bar .chip').forEach(chip => {
                    chip.classList.toggle('active', Number(chip.dataset.mw) === latestMw);
                });
                renderMatches(latestMw);
                focusMatchweekChip(latestMw, 'auto');
            }
            if (pageId === 'rules') {
                renderRules();
                switchRulesView('current', document.querySelector('[data-rules-tab="current"]'));
            }
            if (pageId === 'cup') renderHirabayashiCup();
            if (pageId === 'transfer') openRecommendedTransferView();
            // ページ切替後に高さが変わっても、Safariのスクロール位置を確実に先頭へ戻す
            requestAnimationFrame(() => window.scrollTo(0, 0));
        };

        window.openMoreNavigationSheet = function() {
            const activePageId = document.querySelector('.page.active')?.id?.replace('page-', '') || '';
            const menuItems = [
                { page: 'transfer', title: '選手名簿', icon: '<path d="M7 7h8.17l-2.59 2.59L14 11l5-5-5-5 1.41 1.41L12.83 6H7v1zm10 10H8.83l2.59-2.59L10 13l-5 5 5 5-1.41-1.41L11.17 18H17v-1z"/>' },

        window.navigateFromMoreMenu = function(pageId, titleText) {
            document.getElementById('sheet-overlay').classList.remove('active');
            navigateTo(pageId, titleText);
        };

        // --- LINE 共有 ---
        window.generateLineStandingsShareText = function() {
            const standings = calculateStandings();
            const info = state.seasonInfo || { number: 1 };
            let text = `【FNL Season ${info.number}】最新順位表\n---------------------\n`;
            standings.forEach(t => {
                const gdStr = t.gd > 0 ? `+${t.gd}` : `${t.gd}`;
                text += `${t.rank}位: ${t.name} (勝点${t.pts} / 試${t.p} / 差${gdStr})\n`;
            });
            text += `---------------------\n#FNL #eFootball`;
            executeShare("FNL 最新順位表", text);
        };

        window.generateLineMatchweekShareText = function() {
            const mwNum = typeof state.currentFilterMw === 'number' ? state.currentFilterMw : 1;
            const mwMatches = state.schedule.filter(m => m.mw === mwNum);
            const info = state.seasonInfo || { number: 1 };
            let text = `【FNL Season ${info.number}】MATCHWEEK ${mwNum} 結果速報\n---------------------\n`;
            mwMatches.forEach(m => {
                const scoreText = (m.hs !== null && m.as !== null) ? `${m.hs} - ${m.as}` : `VS (未消化)`;
                text += `・${m.h} ${scoreText} ${m.a}\n`;
            });
            text += `---------------------\n#FNL #eFootball`;
            executeShare(`FNL Matchweek ${mwNum} 結果速報`, text);
        };

        async function executeShare(title, text) {
            if (navigator.share) {
                try {
                    await navigator.share({ title, text });
                    return;
                } catch (e) {}
            }
            openCopyModal(title, text);
        }

        function openCopyModal(title, text) {
            const body = document.getElementById('sheet-body');
            body.innerHTML = `
                <div style="text-align:center; margin-bottom:0.8rem;">
                    <h3 style="font-size:1.1rem; font-weight:700;">${escapeHtml(title)}</h3>
                    <p style="font-size:0.75rem; color:var(--text-muted);">テキストをコピーしてLINEへ貼り付けられます</p>
                </div>
                <textarea id="copy-target-area" class="copy-textarea" readonly>${escapeHtml(text)}</textarea>
                <button class="btn-primary" onclick="copyTextToClipboard()">📋 クリップボードにコピー</button>
            `;
            document.getElementById('sheet-overlay').classList.add('active');
        }

        window.copyTextToClipboard = async function() {
            const area = document.getElementById('copy-target-area');
            if (!area) return;
            try {
                await navigator.clipboard.writeText(area.value);
                alert('LINE共有用テキストをコピーしました！');
                document.getElementById('sheet-overlay').classList.remove('active');
            } catch (err) {
                area.select();
                alert('手動でコピーを行ってください。');
            }
        };

        // --- ニュース ---
        function getNewsSourceLabel(item) {
            if (item?.sourceType === 'team') return item.sourceName || RAW_TEAMS.find(team => team.id === item.sourceTeamId)?.name || 'クラブメディア';
            return 'FNL運営';
        }

        function getNewsCategoryLabel(item) {
            const legacyLabels = {
                '結果速報': '試合結果',
                'プレビュー': '試合情報',
                '運営': '規約・運営'
            };
            const category = item?.category || 'お知らせ';
            return legacyLabels[category] || category;
        }

        let currentNewsPage = 1;
        const NEWS_PER_PAGE = 6;

        function renderNews() {
            const homeWrap = document.getElementById('home-news-preview');
            const fullWrap = document.getElementById('full-news-list');
            const paginationWrap = document.getElementById('news-pagination');
            if (!homeWrap || !fullWrap || !paginationWrap) return;

            if (state.news.length === 0) {
                homeWrap.innerHTML = `<div style="text-align:center; color:var(--text-muted); font-size:0.8rem; padding:1rem;">ニュースはありません</div>`;
                fullWrap.innerHTML = `<div style="text-align:center; color:var(--text-muted); font-size:0.8rem; padding:1rem;">ニュースはありません</div>`;
                paginationWrap.innerHTML = '';
                return;
            }

            const renderNewsItems = items => items.map(n => `
                    <button type="button" class="news-item" onclick="openNewsDetailSheet('${n.id}')">
                        <div class="news-meta">
                            <span class="news-category">${escapeHtml(getNewsCategoryLabel(n))}</span>
                            <span class="news-source">${escapeHtml(getNewsSourceLabel(n))}</span>
                            <span class="news-date">${escapeHtml(n.date)}</span>
                        </div>
                        <div class="news-title">${escapeHtml(n.title)}</div>
                    </button>
                `).join('');
            homeWrap.innerHTML = renderNewsItems(state.news.slice(0, 3));
            const totalPages = Math.ceil(state.news.length / NEWS_PER_PAGE);
            currentNewsPage = Math.min(Math.max(currentNewsPage, 1), totalPages);
            const start = (currentNewsPage - 1) * NEWS_PER_PAGE;
            fullWrap.innerHTML = renderNewsItems(state.news.slice(start, start + NEWS_PER_PAGE));
            paginationWrap.innerHTML = totalPages > 1 ? `
                <button class="news-page-button" type="button" onclick="goToNewsPage(${currentNewsPage - 1})" ${currentNewsPage === 1 ? 'disabled' : ''} aria-label="前のページ">‹</button>
                ${Array.from({ length: totalPages }, (_, index) => {
                    const page = index + 1;
                    return `<button class="news-page-button ${page === currentNewsPage ? 'active' : ''}" type="button" onclick="goToNewsPage(${page})" ${page === currentNewsPage ? 'aria-current="page"' : ''}>${page}</button>`;
                }).join('')}
                <button class="news-page-button" type="button" onclick="goToNewsPage(${currentNewsPage + 1})" ${currentNewsPage === totalPages ? 'disabled' : ''} aria-label="次のページ">›</button>` : '';
        }

        window.goToNewsPage = function(page) {
            const totalPages = Math.ceil(state.news.length / NEWS_PER_PAGE);
            if (page < 1 || page > totalPages || page === currentNewsPage) return;
            currentNewsPage = page;
            renderNews();
            document.getElementById('page-news')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };

        window.openNewsDetailSheet = function(newsId) {
            const item = state.news.find(n => n.id === newsId);
            if (!item) return;

            const body = document.getElementById('sheet-body');
            body.innerHTML = `
                <div class="news-detail-header">
                    <div class="news-meta">
                        <span class="news-category">${escapeHtml(getNewsCategoryLabel(item))}</span>
                        <span class="news-source">${escapeHtml(getNewsSourceLabel(item))}</span>
                        <span class="news-date">${escapeHtml(item.date)}</span>
                    </div>
                    <h2 class="news-detail-title">${escapeHtml(item.title)}</h2>
                </div>
                <div class="news-detail-content">${escapeHtml(item.content)}</div>
                <button class="btn-danger news-detail-delete" onclick="deleteNewsFromCloud('${item.id}')">このニュースを削除</button>
            `;
            document.getElementById('sheet-overlay').classList.add('active');
        };

        window.deleteNewsFromCloud = function(newsId) {
            if (confirm('このニュースを削除しますか？')) {
                state.news = state.news.filter(n => n.id !== newsId);
                renderNews();
                persistAppState();
                document.getElementById('sheet-overlay').classList.remove('active');
            }
        };

        window.openPostNewsSheet = function() {
            if (!requireEditMode('ニュース投稿')) return;
            const todayStr = new Date().toISOString().split('T')[0].replace(/-/g, '.');
            const body = document.getElementById('sheet-body');
            body.innerHTML = `
                <div class="news-composer-header">
                    <div class="news-composer-kicker">FNL NEWSROOM</div>
                    <h3 class="news-composer-title">ニュースを投稿</h3>
                    <div class="news-composer-copy">掲載情報を選び、見出しと本文を入力して公開します。</div>

                    <div class="news-composer-panel news-composer-meta">
                        <div class="form-group news-composer-field"><label class="form-label">カテゴリー</label><select id="post-category" class="form-select"><option value="お知らせ">お知らせ</option><option value="試合情報">試合情報</option><option value="試合結果">試合結果</option><option value="移籍情報">移籍情報</option><option value="チーム情報">チーム情報</option><option value="選手情報">選手情報</option><option value="大会・イベント">大会・イベント</option><option value="規約・運営">規約・運営</option></select></div>
                        <div class="form-group news-composer-field"><label class="form-label">発信元</label><select id="post-source" class="form-select"><option value="official">FNL運営</option>${RAW_TEAMS.map(team => `<option value="team:${team.id}">${escapeHtml(team.name)} メディア</option>`).join('')}</select></div>
                        <div class="form-group news-composer-field is-wide"><label class="form-label">投稿日</label><input type="text" id="post-date" class="form-input" value="${todayStr}" aria-label="投稿日"></div>
                    </div>
                </div>
                <div class="news-composer-section">
                    <div class="news-composer-section-heading"><span>記事内容</span><small>タイトルは60文字まで</small></div>
